id: badge:citizenship-in-the-nation
name: Citizenship in the Nation
edition: 2026
eagle_required: true
official_url: https://www.scouting.org/merit-badges/citizenship-in-the-nation/
worksheet_url: http://usscouts.org/mb/worksheets/Citizenship-in-the-Nation.pdf
requirements:
  - n: "1"
    text: What is the Constitution of the United States? What does the Constitution do? What principles does it reflect? Why is it important to have a Constitution?
  - n: "2"
    text: List the six purposes for creating the United States Constitution set forth in the Preamble to the Constitution. How do these purposes affect your family and community?
  - n: "3"
    text: "List the three branches of the United States government. Explain:"
    children:
      - n: 3a
        text: The function of each branch of government
      - n: 3b
        text: Why it is important to divide powers among different branches
      - n: 3c
        text: How each branch "checks" and "balances" the others
      - n: 3d
        text: How citizens can be involved in each branch of government
  - n: "4"
    text: "Discuss the importance of:"
    children:
      - n: 4a
        text: Declaration of Independence
      - n: 4b
        text: Bill of Rights (the first 10 Amendments to the Constitution) and the 14th Amendment
      - n: 4c
        text: “E Pluribus Unum,” the traditional United States motto
  - n: "5"
    text: Watch the national evening news for five days in a row or read the main stories in a national media organization (e.g., a newspaper or news website) for five days in a row. Discuss the national issues you learned about with your counselor. Choose one issue and explain how it affects you, your family, and community.
  - n: "6"
    text: "With your counselor's approval, choose a speech of national historical importance. Explain:"
    children:
      - n: 6a
        text: Who the author was
      - n: 6b
        text: What the historical context was
      - n: 6c
        text: What difficulties the nation faced that the author wished to discuss
      - n: 6d
        text: What the author said
      - n: 6e
        text: Why the speech is important to the nation's history. Choose a sentence or two from the speech that has significant meaning to you, and tell your counselor why.
  - n: "7"
    text: "Do TWO of the following:"
    choose: 2
    children:
      - n: 7a
        text: Visit a place that is listed as a National Historic Landmark or that is on the National Register of Historic Places. Tell your counselor what you learned about the landmark or site and what you found interesting about it.
      - n: 7b
        text: Tour your state capitol building or the U.S. Capitol. Tell your counselor what you learned about the capitol, its function, and the history.
      - n: 7c
        text: Tour a federal facility. Explain to your counselor what you saw and what you learned about its function in the local community and how it serves this nation.
      - n: 7d
        text: Choose a national monument that interests you. Using books, brochures, the internet (with your parent or guardian’s permission), and other resources, find out more about the monument. Tell your counselor what you learned, and explain why the monument is important to this country’s citizens.
  - n: "8"
    updated_2026: true
    text: Name your representatives in the United States Congress. Write to your representative in Congress explaining your views on a national issue. Show your correspondence, along with any response you receive, to your counselor.
