id: badge:motorboating
name: Motorboating
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/motorboating/
worksheet_url: http://usscouts.org/mb/worksheets/Motorboating.pdf
requirements:
  - n: "1"
    updated_2026: true
    text: "Do the following:"
    children:
      - n: 1a
        text: "Discuss with your counselor the following hazards you might encounter while motorboating: flammable fuel; carbon monoxide; propellers; collisions; falls overboard; capsize; running aground. Explain what you should do to anticipate, prevent, mitigate and respond to these hazards."
      - n: 1b
        text: Explain first aid for injuries or illnesses that could occur while motorboating, including hypothermia, heat reactions, dehydration, motion sickness, bug bites, blisters.
      - n: 1c
        text: Discuss the Scouting America Safety Afloat policy. Tell how it applies to motorboating activities.
  - n: "2"
    text: "Do the following:"
    children:
      - n: 2a
        updated_2026: true
        text: "Before doing requirement 5, successfully complete the Scouting America swimmer test. See the Swimming merit badge requirements for details about the Scouting America swimmer test. Note: See the Swimming merit badge pamphlet for details about the Scouting America swimmer test."
      - n: 2b
        text: Name the different types of personal flotation devices (PFDs), and explain when each type should be used. Show how to choose and properly fit a PFD.
  - n: "3"
    text: "Do the following:"
    children:
      - n: 3a
        text: Explain inboard, outboard, and inboard/outboard motors, and the uses and advantages of each. Discuss the special features of a bass boat and a ski boat.
      - n: 3b
        text: Explain the safety procedures and precautions involving handling fuel and engine servicing, and equipment storage and placement.
      - n: 3c
        text: Explain how to winterize a boat motor and tell why this procedure is necessary.
      - n: 3d
        text: Explain the safety procedures and precautions involving swimmers and skiers in the water, passenger positions underway, and boat wakes.
  - n: "4"
    text: "Show you know safety laws for motorboating by doing the following:"
    children:
      - n: 4a
        text: Review how each item of the Scouting America Safety Afloat policy applies, including checking the weather prior to and during time on the water, confirming all required equipment is present and functional, and following a float plan.
      - n: 4b
        text: Explain the rules or laws that apply to recreational boating in your area or state. Have a permit to operate a motorboat, if required by the laws of your state. Discuss how you would find information regarding the boating laws in different states.
      - n: 4c
        text: Discuss how the hazards of weather and heavy water conditions can affect both safety and performance in motorboating.
      - n: 4d
        text: Discuss with your counselor the nautical rules of the road and describe the national and your state’s aids to navigation.
      - n: 4e
        text: Explain and show the correct use of equipment required by both state and federal regulations to be carried aboard a motorboat.
      - n: 4f
        text: Explain federal and state rules for a ventilation system, and tell why these rules are required.
      - n: 4g
        text: Explain the use of lights (sight signals) and sound signals on motorboats.
      - n: 4h
        text: Discuss the common types of anchors used in motorboating and under what conditions each would be preferred. Explain proper anchoring techniques.
  - n: "5"
    text: "With your counselor or other adults on board, demonstrate proper boathandling procedures and skills by doing the following:"
    children:
      - n: 5a
        text: Board and assist others in boarding. Confirm that all passengers on board are wearing properly fitted life jackets.
      - n: 5b
        text: Fuel the boat and complete a safety check.
      - n: 5c
        text: If equipped, attach the engine cut-off switch link and safely start the motor. Get underway from dockside or from a beach launch.
      - n: 5d
        text: Run a course for at least a mile, showing procedures for overtaking and passing slower vessels, yielding right-of-way, passing oncoming traffic, making turns, reversing direction, and using navigation aids.
      - n: 5e
        text: Stop and secure the boat in position on the open water using anchors. Raise and stow the anchor and get underway.
      - n: 5f
        text: Land or dock the boat, disembark, and assist others in doing the same.
      - n: 5g
        text: Moor, dock, or beach the boat and secure all gear.
      - n: 5h
        text: "Demonstrate knots used in boating: cleating hitch, bowline, clove hitch, anchor bend, sheet bend."
