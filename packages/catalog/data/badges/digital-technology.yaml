id: badge:digital-technology
name: Digital Technology
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/digital-technology/
worksheet_url: http://usscouts.org/mb/worksheets/Digital-Technology.pdf
requirements:
  - n: "1"
    text: View the Personal Safety Awareness “Digital Safety” video (with a parent or guardian’s permission).
  - n: "2"
    text: "Do the following:"
    children:
      - n: 2a
        text: Give a brief history of the changes in digital technology over time. Discuss with your counselor how digital technology in your lifetime compares with that of your parent’s, grandparent’s, or other adult’s lifetime.
      - n: 2b
        text: Describe what kinds of computers or devices you imagine might be available when you are an adult.
  - n: "3"
    text: "Do the following:"
    children:
      - n: 3a
        text: Explain to your counselor how text, sound, and pictures are digitized for storage.
      - n: 3b
        text: Describe the difference between lossy and lossless data compression, and give an example where each might be used.
      - n: 3c
        text: Describe two digital devices and how they are made more useful by their programming.
      - n: 3d
        text: Discuss the similarities and differences between computers, mobile devices, and gaming consoles.
      - n: 3e
        text: Explain what a computer network is and the difference between a local area network (LAN) versus a wide area network (WAN).
  - n: "4"
    text: "Do the following:"
    children:
      - n: 4a
        text: Explain what a program or software application or “app” is and how a computer uses a CPU and memory to execute it.
      - n: 4b
        text: Name four software programs or mobile apps you or your family use, and explain how each one helps you.
      - n: 4c
        text: Describe what malware is, and explain how to protect your digital devices and the information stored on them.
      - n: 4d
        updated_2026: true
        text: Explain what a barcode, a QR code, and an RFID tag are along with the data they contain and two or more examples where each are used.
  - n: "5"
    text: "Do the following:"
    children:
      - n: 5a
        text: Describe at least two different ways data can be transferred through the internet.
      - n: 5b
        text: Using an internet search engine (with a parent or guardian’s permission), find ideas about how to conduct a troop court of honor or campfire program. Present the ideas to your counselor, and explain how you used a search engine to find this information.
      - n: 5c
        text: Use a web browser to connect to an HTTPS (secure) website (with your parent or guardian’s permission). Explain to your counselor how to tell whether the site’s security certificate can be trusted, and what it means to use this kind of connection.
  - n: "6"
    text: Do THREE of the following. For each project you complete, copy the files to a backup device and share the finished projects with your counselor.
    choose: 3
    children:
      - n: 6a
        text: "Using a spreadsheet or database program, develop a food budget for a patrol weekend campout OR create a troop roster that includes the name, rank, patrol, and telephone number of each Scout. Show your counselor that you can sort the roster by each of the following categories: rank, patrol, and alphabetically by name."
      - n: 6b
        text: Using a word processor, write a draft letter to the parents or guardians of your troop’s Scouts, inviting them to a troop event.
      - n: 6c
        text: Using a graphics program, design and draw a campsite plan for your troop OR create a flyer for an upcoming troop event, incorporating text and some type of visual such as a photograph or an illustration.
      - n: 6d
        text: Using a presentation software program, develop a report about a topic approved by your counselor. For your presentation, create at least five slides, with each one incorporating text and some type of visual such as a photograph or an illustration.
      - n: 6e
        text: Using a digital device, take a picture of a troop activity. Send or transfer this image to a device where it can be shared with your counselor.
      - n: 6f
        text: Make a digital recording of your voice, transfer the file to a different device, and have your counselor play back the recording.
      - n: 6g
        text: Create a blog and use it as an online journal of your Scouting activities, including group discussions and meetings, campouts, and other events. Include at least five entries and two photographs or illustrations. Share your blog with your counselor. You need not post the blog to the internet; however, if you choose to go live with your blog, you must first share it with your parent or guardian AND counselor AND get their approval.
      - n: 6h
        text: Create a webpage for your troop, patrol, school, or place of worship. Include at least three articles and two photographs or illustrations. Include at least one link to a website of interest to your audience. You need not post the page to the internet; however, if you decide to do so, you must first share the webpage with your parent or guardian AND counselor AND get their approval.
  - n: "7"
    text: "Do the following:"
    children:
      - n: 7a
        text: "Explain to your counselor each of these protections and why they exist: copyright, patents, trademarks, trade secrets."
      - n: 7b
        text: Explain when it is permissible to accept a free copy of a program from a friend.
      - n: 7c
        text: Discuss with your counselor an article or (with your parent or guardian’s permission) a report on the internet about a recent legal case involving an intellectual property dispute.
  - n: "8"
    text: "Do TWO of the following:"
    choose: 2
    children:
      - n: 8a
        text: Describe why it is important to properly dispose of digital technology. List at least three dangerous chemicals that could be used to create digital devices or used inside a digital device.
      - n: 8b
        text: Explain to your counselor why it is important to use a certified recycler of digital technology hardware or devices.
      - n: 8c
        text: Do an internet search for an organization that collects discarded digital technology hardware or devices for repurposing or recycling. Find out what happens to that waste. Share with your counselor what you found.
      - n: 8d
        text: Visit a recycling center that disposes of digital technology hardware or devices. Find out what happens to that waste. Share what you learned with your counselor.
      - n: 8e
        text: Find a battery recycling center near you and find out what it does to recycle batteries. Share what you have learned with your counselor about the proper methods for recycling batteries.
  - n: "9"
    updated_2026: true
    text: "Do ONE of the following:"
    choose: 1
    children:
      - n: 9a
        text: Explore careers related to the Digital Technology merit badge. Research one career to learn about the training and education needed, costs, job prospects, salary, job duties, and career advancement. Your research methods may include -- with your parent or guardian’s permission -- an internet or library search, an interview with a professional in the field, or a visit to a location where people in this career work. Discuss with your counselor both your findings and what about this profession might make it an interesting career.
      - n: 9b
        text: Explore how you could use knowledge and skills from the Digital Technology merit badge to pursue a hobby or interest. Research any training needed, expenses, and organizations that promote or support it. Discuss with your counselor what short-term and long-term goals you might have if you pursued this.
