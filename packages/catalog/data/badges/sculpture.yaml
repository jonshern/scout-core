id: badge:sculpture
name: Sculpture
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/sculpture/
worksheet_url: http://usscouts.org/mb/worksheets/Sculpture.pdf
requirements:
  - n: "1"
    text: Explain to your counselor the precautions that must be followed for the safe use and operation of a sculptor’s tools, equipment, and other materials.
  - n: "2"
    text: "Do TWO of the following:"
    choose: 2
    children:
      - n: 2a
        text: Model in clay a life-size human head. Then sculpt in modeling clay, carve in wood or plaster, or use 3D modeling software to make a small-scale model of an animal or person. Explain to your counselor the method and tools you used to sculpt the figure.
      - n: 2b
        text: Make a plaster mold of a fruit or vegetable. In this mold, make a copy of the fruit or vegetable. Explain to your counselor the method and tools you used to make the copy.
      - n: 2c
        text: With your parent or guardian’s permission and your counselor’s approval, visit a museum, art exhibit, art gallery, artists’ co-op, or artist’s studio. After your visit, share with your counselor what you have learned. Discuss the importance of visual arts and how it strengthens social tolerance and helps stimulate cultural, intellectual, and personal development.
  - n: "3"
    updated_2026: true
    text: "Do ONE of the following:"
    choose: 1
    children:
      - n: 3a
        text: Explore careers related to this merit badge. Research one career to learn about the training and education needed, costs, job prospects, salary, job duties, and career advancement. Your research methods may include -- with your parent or guardian’s permission -- an internet or library search, an interview with a professional in the field, or a visit to a location where people in this career work. Discuss with your counselor both your findings and what about this profession might make it an interesting career.
      - n: 3b
        text: Explore how you could use knowledge and skills from this merit badge to pursue a hobby. Research any training needed, expenses, and organizations that promote or support it. Discuss with your counselor what short-term and long-term goals you might have if you pursued this.
