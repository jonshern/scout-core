id: badge:scouting-heritage
name: Scouting Heritage
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/scouting-heritage/
worksheet_url: http://usscouts.org/mb/worksheets/Scouting-Heritage.pdf
requirements:
  - n: "1"
    text: Discuss with your counselor the life and times of Lord Baden-Powell of Gilwell. Explain why he felt a program like Scouting would be good for the young men of his day. Include in your discussion how Scouting was introduced in the United States, and the origins of Boy Scouting and Cub Scouting under Baden-Powell.
  - n: "2"
    updated_2026: true
    text: "Do the following:"
    children:
      - n: 2a
        text: Give a short biographical summary of any TWO of the following, and tell of their roles in how Scouting developed and grew in the United States.
        children:
          - n: 2a1
            text: Daniel Carter Beard
          - n: 2a2
            text: William D. Boyce
          - n: 2a3
            text: Waite Phillips
          - n: 2a4
            text: Ernest Thompson Seton
          - n: 2a5
            text: James E. West
          - n: 2a6
            text: '"Green Bar Bill" Hillcourt'
          - n: 2a7
            text: Frederick Russell Burnham
          - n: 2a8
            text: Dr. Charles Eastman
          - n: 2a9
            text: Edgar Robinson.
      - n: 2b
        text: "Discuss the significance to Scouting of any TWO of the following:"
        children:
          - n: 2b1
            text: Brownsea Island
          - n: 2b2
            text: The First World Scout Jamboree
          - n: 2b3
            text: Scouts BSA Handbook
          - n: 2b4
            text: Scout Life magazine (formerly Boys’ Life)
  - n: "3"
    text: Discuss with your counselor how Scouting’s programs have developed over time and been adapted to fit different age groups and interests (Cub Scouting, Scouts BSA, Exploring, Venturing).
  - n: "4"
    text: "Do ONE of the following:"
    choose: 1
    children:
      - n: 4a
        text: Attend either a Scouting America National Jamboree, OR World Scout Jamboree, OR a Scouting America national high-adventure base. While there, keep a journal documenting your day-to-day experiences. Upon your return, report to your counselor what you did, saw, and learned. You may include photos, brochures, and other documents in your report.
      - n: 4b
        text: Write or visit the National Scouting Museum. Obtain information about this facility. Give a short report on what you think the role of this museum is in the Scouting program.
      - n: 4c
        text: Visit an exhibit of Scouting memorabilia or a local museum with a Scouting history gallery, or (with your parent or guardian’s permission and counselor’s approval) visit with someone in your council who is recognized as a dedicated Scouting historian or memorabilia collector. Learn what you can about the history of Scouting America. Give a short report to your counselor on what you saw and learned.
  - n: "5"
    updated_2026: true
    text: Research the history of your unit, council, summer camp, or Order of the Arrow lodge. With the permission of a parent or guardian, your research methods may include an internet or library search, interviews with Scout leaders, or visits to locations where you learn about your topic. Prepare an oral or written report, a presentation, or a video of your research and review it with your counselor.
  - n: "6"
    text: Make a collection of some of your personal patches and other Scouting memorabilia. With their permission, you may include items borrowed from family members or friends who have been in Scouting in the past, or you may include photographs of these items. Show this collection to your counselor, and share what you have learned about items in the collection. (There is no requirement regarding how large or small this collection must be.)
  - n: "7"
    text: Reproduce the equipment for an old-time Scouting game such as those played at Brownsea Island. You may find one on your own (with your counselor’s approval), or pick one from the Scouting Heritage pamphlet. Teach and play the game with other Scouts.
  - n: "8"
    text: Interview at least three people (different from those you interviewed for requirement 5) over the age of 40 who were Scouts. Find out about their Scouting experiences. Ask about the impact that Scouting has had on their lives. Share what you learned with your counselor.
  - n: "9"
    updated_2026: true
    text: "Careers. Do ONE of the following:"
    choose: 1
    children:
      - n: 9a
        text: Explore careers related to Scouting. Research one career to learn about the training and education needed, costs, job prospects, salary, job duties, and career advancement. With permission of your parent or guardian, your research methods may include an internet or library search, an interview with a professional in the field, or a visit to a location where people in this career work. Discuss with your counselor both your findings and what about this profession might make it an interesting career.
      - n: 9b
        text: Explore how you could use knowledge and skills from this merit badge to serve as a Scouting volunteer. Research any training needed, expenses, and how you could serve as a unit, district, council, regional, or national volunteer. Discuss with your counselor what short-term and long-term goals you might have if you pursued this.
