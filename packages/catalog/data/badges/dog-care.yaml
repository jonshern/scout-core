id: badge:dog-care
name: Dog Care
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/dog-care/
worksheet_url: http://usscouts.org/mb/worksheets/Dog-Care.pdf
requirements:
  - n: "1"
    text: "Do the following:"
    children:
      - n: 1a
        text: Briefly discuss the historical origin and domestication of the dog.
      - n: 1b
        text: Describe some common characteristics of the dogs that make up each of the seven major dog groups.
      - n: 1c
        text: Tell some specific characteristics of seven breeds of dogs (one from each major group), OR give a short history of one breed.
  - n: "2"
    text: Point out on a dog or a sketch at least 10 body parts. Give the correct name of each one.
  - n: "3"
    text: "Do the following:"
    children:
      - n: 3a
        text: Explain the importance of house-training, obedience training, and socialization training for your dog.
      - n: 3b
        text: Explain what “responsible pet ownership” means.
      - n: 3c
        text: Explain what issues (including temperament) must be considered when deciding on what breed of dog to get as a family pet.
  - n: "4"
    text: "For two months, keep and care for your dog. Maintain a log of your activities during this period that includes these items: feeding schedule, types of food used, amount fed, exercise periods, training schedule, a weekly bodyweight record, grooming and bathing schedules, veterinary care, if necessary, and costs. Also include a brief description of the type of housing/ shelter arrangements you have for your dog. (The activities used to fulfill the requirements for the Dog Care merit badge may not be used to help fulfill requirements for other merit badges.)"
  - n: "5"
    text: "Explain the correct way to obedience train a dog and what equipment you would need. Show with your dog any three of these commands: “come,” “sit,” “down,” “heel,” “stay,” “fetch” or “get it,” “drop it.”"
  - n: "6"
    text: "Do the following:"
    children:
      - n: 6a
        text: Discuss the proper vaccination schedule for a dog in your area from puppyhood through adulthood.
      - n: 6b
        text: Discuss the control methods for preventing fleas, ticks, heartworms, and intestinal parasites (worms) for a dog in your area from puppyhood through adulthood.
      - n: 6c
        text: Explain the importance of dental care and tooth brushing to your pet’s health.
      - n: 6d
        text: Discuss the benefits of grooming your dog’s coat and nails on a regular basis.
      - n: 6e
        text: Discuss with your counselor any seasonal conditions (like hot summers, cold winters, or extreme humidity) where you live that need to be considered for your dog.
      - n: 6f
        text: Discuss with your counselor the considerations and advantages of spaying or neutering your dog.
  - n: "7"
    text: "Do the following:"
    children:
      - n: 7a
        text: Explain precautions to take in handling a hurt dog.
      - n: 7b
        text: Show how to put on an emergency muzzle.
      - n: 7c
        text: Explain how to treat wounds. Explain first aid for a dog bite.
      - n: 7d
        text: Show how to put on a simple dressing and bandage the foot, body, or head of your dog.
      - n: 7e
        text: Explain what to do if a dog is hit by a car.
      - n: 7f
        text: List the things needed in every dog owner’s first-aid kit.
      - n: 7g
        text: Tell the dangers of home treatment of a serious ailment.
      - n: 7h
        text: Briefly discuss the cause and method of spread, the signs and symptoms and the methods of prevention of rabies, parvovirus, distemper, and heartworms in dogs.
  - n: "8"
    text: Visit a veterinary hospital or an animal shelter and give a report about your visit to your counselor.
  - n: "9"
    text: Know the laws and ordinances involving dogs that are in force in your community.
  - n: "10"
    text: "Do ONE of the following:"
    choose: 1
    children:
      - n: 10a
        text: Identify three career opportunities that would use skills and knowledge in working with dogs. Pick one and research the training, education, certification requirements, experience, and expenses associated with entering the field. Research the prospects for employment, starting salary, advancement opportunities and career goals associated with this career. Discuss what you learned with your counselor and whether you might be interested in this career.
      - n: 10b
        text: Identify how you might use the skills and knowledge in working with dogs to pursue a personal hobby and/or healthy lifestyle. Research the additional training required, expenses, and affiliation with organizations that would help you maximize the enjoyment and benefit you might gain from it. Discuss what you learned with your counselor and share what short-term and long-term goals you might have if you pursued this.
