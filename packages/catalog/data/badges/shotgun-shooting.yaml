id: badge:shotgun-shooting
name: Shotgun Shooting
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/shotgun-shooting/
worksheet_url: http://usscouts.org/mb/worksheets/Shotgun-Shooting.pdf
requirements:
  - n: "1"
    text: "Do the following:"
    children:
      - n: 1a
        text: Explain what a projectile is, and why any device that shoots a projectile at high speed must be handled with care and respect, and used only in approved locations.
      - n: 1b
        text: Explain the basic rules of safe gun handling that apply to all firearms.
      - n: 1c
        text: Describe how you would react if a friend visiting your home asked to see your or your family’s firearm.
      - n: 1d
        text: Explain the need for, types, and use of eye protection and hearing protection.
      - n: 1e
        text: Explain the main points of the laws for owning and using guns in your community and state.
      - n: 1f
        text: Explain how hunting is related to the wise use of renewable wildlife resources.
      - n: 1g
        text: Successfully complete a state hunter education course, or obtain a copy of the hunting laws for your state, then do the following.
        children:
          - n: 1g1
            text: Explain the main points of hunting laws in your state, and any special laws on the use of guns and ammunition, AND
          - n: 1g2
            text: List the kinds of wildlife that can be legally hunted in your state.
      - n: 1h
        text: Explain to your counselor the proper hygienic guidelines followed while shooting.
      - n: 1i
        text: List and explain three shotgun sports. Identify places in your community where you could practice these sports, and explain how you can join or be a part of range and target activities.
      - n: 1j
        text: Discuss with your counselor a list of sources you could contact for information on firearms and their use.
  - n: "2"
    text: "Working under the supervision of a certified National Rifle Association (NRA) Shotgun instructor and a certified range safety officer, at a nationally authorized camp property or at a commercial firearm range (as defined in the Scouting America National Range and Target Activities Manual), do ONE of the following options:"
    choose: 1
    options:
      - key: A
        name: Shotgun Shooting (Modern Shotshell Type)
      - key: B
        name: Muzzleloading Shotgun Shooting
    children:
      - n: 2a-optA
        option: A
        text: Identify and explain the principal parts of a shotgun, action types, and how they function.
      - n: 2b-optA
        option: A
        text: Identify and demonstrate the rules for safely storing and handling a shotgun.
      - n: 2c-optA
        option: A
        text: Identify the parts of a shotgun shell and their functions.
      - n: 2d-optA
        option: A
        text: Identify the various gauges of shotguns. Explain which you would choose for a particular use and why.
      - n: 2e-optA
        option: A
        text: Identify the causes of a shotgun’s failure to fire, and explain what a misfire, hangfire, and squib fire are. Explain and demonstrate proper preventive measures, and the procedures to follow in response to each.
      - n: 2f-optA
        option: A
        text: Demonstrate the knowledge, skills, and attitude necessary to safely shoot a shotgun on a range, including understanding and following range procedures and commands.
      - n: 2g-optA
        option: A
        text: Explain the basic safety rules for cleaning a shotgun, and identify the materials needed.
      - n: 2h-optA
        option: A
        text: Demonstrate how to clean a shotgun properly and safely.
      - n: 2i-optA
        option: A
        text: Discuss what points you would consider in selecting a shotgun.
      - n: 2j-optA
        option: A
        text: Shoot a moving target with a shotgun using the four fundamentals of firing a shot—position, mount, vision, and movement.
      - n: 2k-optA
        option: A
        text: "Shooting score required: Hit at least 12 out of 25 targets (48 percent) in two 25-target groups. The two groups need not be shot in consecutive order. A minimum of 50 shots must be fired. Shooting skill rules: • Targets may be thrown by a hand trap, manual mechanical trap, or on any trap or skeet field. If using a hand trap or manual mechanical trap, the trap operator should be at least 5 feet to the right and 3 feet to the rear of the shooter. If throwing left-handed with a hand trap, the trap operator should be at least 5 feet to the left and 3 feet to the rear of the shooter. • All targets should be thrown at a reasonable speed and in the same direction. • Targets should be generally thrown so as to climb in the air after leaving the trap. • Scores may be fired at any time, either in formal competition or in practice, but only under approved supervision and at an approved range as noted in the Scouting America National Range and Target Activities Manual. • Modern, age-appropriate, target shotgun models, 12-, 16- or 20-gauge, may be used. • Only commercially manufactured ammunition may be used. Reloads may not be used in Scouting America range and target activities. • Shooters must shoot in rounds of 25. Rounds need not be shot continuously or on the same day. The term “round” refers to a single series of 25 shots. • If using a trap field, shoot station 3 with traps set to throw straightaway targets. • If using a skeet field, shoot station 7 low house."
      - n: 2a-optB
        option: B
        text: Discuss with your counselor a brief history of the development of the muzzleloading shotgun.
      - n: 2b-optB
        option: B
        text: Identify principal parts of muzzleloading shotguns and discuss how they function.
      - n: 2c-optB
        option: B
        text: Identify and demonstrate the rules for safely storing and handling a muzzleloading shotgun.
      - n: 2d-optB
        option: B
        text: Identify the grades of black powder and explain their proper and safe use.
      - n: 2e-optB
        option: B
        text: Discuss proper safety procedures pertaining to black powder storage.
      - n: 2f-optB
        option: B
        text: Discuss proper components of a load.
      - n: 2g-optB
        option: B
        text: Identify proper procedures and accessories used for safely loading a muzzleloading shotgun.
      - n: 2h-optB
        option: B
        text: Identify the causes of a muzzleloading shotgun’s failure to fire, and explain what a misfire, hangfire, and squib fire are. Explain and demonstrate proper preventive measures, and the procedures to follow in response to each.
      - n: 2i-optB
        option: B
        text: Demonstrate the knowledge, skills, and attitude necessary to safely shoot a muzzleloading shotgun on a range, including understanding and following range procedures and commands.
      - n: 2j-optB
        option: B
        text: Explain the basic safety rules for cleaning a muzzleloading shotgun, and identify the materials needed.
      - n: 2k-optB
        option: B
        text: Demonstrate how to clean a muzzleloading shotgun properly and safely.
      - n: 2l-optB
        option: B
        text: Discuss what you would consider in selecting a muzzleloading shotgun.
      - n: 2m-optB
        option: B
        text: Shoot a moving target with a muzzleloading shotgun using the four fundamentals of firing a shot—position, mount, vision, and movement.
      - n: 2n-optB
        option: B
        text: "Shooting score required: Hit at least 5 out of 15 targets in each of two 15-target groups. The two groups need not be shot in consecutive order. A minimum of 30 shots must be fired. Shooting skill rules: • Targets may be thrown by a hand trap, manual mechanical trap, or on any trap or skeet field. Note: If using a hand trap or manual mechanical trap, the trap operator should be at least five feet to the right and three feet to the rear of the shooter. If throwing left-handed with a hand trap, the trap operator should be at least 5 feet to the left and 3 feet to the rear of the shooter. • All targets should be thrown at a reasonable speed and in the same direction. • Targets should be generally thrown so as to climb in the air after leaving the trap. • Scores may be fired at any time, either in formal competition or in practice, but only under approved supervision and at an approved range as noted in the Scouting America National Range and Target Activities Manual. • A 10 gauge or smaller muzzleloading rifle in appropriate size for the participant may be used. Matchlock, wheellock, or flintlock firearms are not approved. • Standard clay targets customarily used for trap and skeet are to be used. • On a standard trap field, the shooter should be positioned 8 yards behind the trap house. • The trap should be set to throw only straightaway targets. • On a skeet field, use station 7 low house."
  - n: "3"
    text: Identify how you could apply the skills and knowledge of safe and responsible use of firearms you learned in this merit badge to pursue a career or personal hobby. Research the additional training and experience you would need, expenses you may incur, and the affiliation with organizations that could help you maximize the positive impact and enjoyment you gain from it. Discuss what you learned with your counselor, and share what short-term and longterm goals you might have if you pursued this.
