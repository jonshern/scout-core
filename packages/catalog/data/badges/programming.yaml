id: badge:programming
name: Programming
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/programming/
worksheet_url: http://usscouts.org/mb/worksheets/Programming.pdf
requirements:
  - n: "1"
    text: "Safety. Do the following:"
    children:
      - n: 1a
        text: View the Personal Safety Awareness “Digital Safety” video with your parent or guardian’s permission.
      - n: 1b
        text: Discuss first aid and prevention for the types of injuries that could occur during programming activities, including repetitive stress injuries and eyestrain.
  - n: "2"
    text: History. Discuss with your counselor the history of programming and the evolution of programming languages, including at least three milestones related to the advancement or development of programming over time.
  - n: "3"
    text: "General Knowledge. Do the following:"
    children:
      - n: 3a
        text: Create a list of five popular programming languages in use today and describe which industry or industries they are primarily used in and why.
      - n: 3b
        text: Describe three different programmed devices you rely on every day.
  - n: "4"
    text: "Intellectual Property. Do the following:"
    children:
      - n: 4a
        text: Explain the four types of intellectual property used to protect computer programs.
      - n: 4b
        text: Describe the difference between licensing and owning software.
      - n: 4c
        text: Describe the differences between freeware, open source, and commercial software, and why it is important to respect the terms of use of each.
  - n: "5"
    text: "Project. With your counselor’s guidance, select three different programming languages and development environments. For each subrequirement below, do the following: Write or modify a program using the indicated programming language and development environment. The program must take input and produce output based on computations and decisions made on the input. Debug and demonstrate the program to your counselor. Explain how each program processes inputs, makes decisions based on those inputs, and provides outputs based on computations and decision making."
    children:
      - n: 5a
        text: In the first language and environment, write or modify a program, debug and demonstrate, and explain as above.
      - n: 5b
        text: In the second language and environment, write or modify a program, debug and demonstrate, and explain as above.
      - n: 5c
        text: In the third language and environment, write or modify a program, debug and demonstrate, and explain as above.
  - n: "6"
    updated_2026: true
    text: "Careers. Do ONE of the following:"
    choose: 1
    children:
      - n: 6a
        text: Explore careers related to this merit badge. Research one career to learn about the training and education needed, costs, job prospects, salary, job duties, and career advancement. Your research methods may include-with your parent or guardian’s permission-an internet or library search, an interview with a professional in the field, or a visit to a location where people in this career work. Discuss with your counselor both your findings and what about this profession might make it an interesting career.
      - n: 6b
        text: Explore how you could use knowledge and skills from this merit badge to pursue a hobby or healthy lifestyle. Research any training needed, expenses, and organizations that promote or support it. Discuss with your counselor what short-term and long-term goals you might have if you pursued this.
