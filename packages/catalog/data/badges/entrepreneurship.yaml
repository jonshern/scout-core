id: badge:entrepreneurship
name: Entrepreneurship
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/entrepreneurship/
worksheet_url: http://usscouts.org/mb/worksheets/Entrepreneurship.pdf
requirements:
  - n: "1"
    text: In your own words, define entrepreneurship. Explain to your counselor how entrepreneurs impact the U.S. economy.
  - n: "2"
    text: "Explain to your counselor why having good skills in the following areas is important for an entrepreneur: communication, planning, organization, problem solving, decision making, basic math, adaptability, technical and social skills, teamwork, and leadership."
  - n: "3"
    text: Identify and interview an individual who has started a business. Learn about this person’s educational background, early work experiences, where the idea for the business came from, and what was involved in starting the business. Find out how the entrepreneur raised the capital (money) to start the business, examples of successes and challenges faced, and how the business is currently doing (if applicable). Discuss with your counselor what you have learned.
  - n: "4"
    text: Think of as many ideas for a business as you can, and write them down. From your list, select three ideas you believe represent the best opportunities. Choose one of these and explain to your counselor why you selected it and why you feel it can be successful.
  - n: "5"
    text: "Create a written business plan for your idea that includes all of the following:"
    children:
      - n: 5a
        text: Product or Service
        children:
          - n: 5a1
            text: Describe the product or service to be offered.
          - n: 5a2
            text: Identify goals for your business.
          - n: 5a3
            text: Explain how you can make enough of the product or perform the service to meet your goals.
          - n: 5a4
            text: Identify and describe the potential liability risks for your product or service.
          - n: 5a5
            text: Determine what type of license, if any, you might need in order to sell or make your product or service.
      - n: 5b
        text: Market Analysis
        children:
          - n: 5b1
            text: Identify the types of people who would buy your product or service.
          - n: 5b2
            text: Identify your business’s competitors, and describe their strengths and weaknesses.
          - n: 5b3
            text: Describe what makes your product or service unique.
      - n: 5c
        text: Financial
        children:
          - n: 5c1
            text: Determine how much money you will need to start your business, and identify how you will obtain the money.
          - n: 5c2
            text: Determine the cost of offering your product or service and the price you will charge in order to make a profit.
          - n: 5c3
            text: Describe what will happen with the money you make from the sales of your product or service.
      - n: 5d
        text: Personnel
        children:
          - n: 5d1
            text: Determine what parts of the business you will handle yourself, and describe your qualifications.
          - n: 5d2
            text: Determine whether you will need additional help to operate your business. If you will need help, describe the responsibilities and qualifications needed for the personnel who will fill each role.
      - n: 5e
        text: Promotion and Marketing
        children:
          - n: "5e1"
            text: Describe the methods you will use to promote your business to potential customers.
          - n: "5e2"
            text: Explain how you will utilize the internet and social media to increase awareness of your product or service.
          - n: "5e3"
            text: Design a promotional flyer or poster for your product or service.
  - n: "6"
    text: When you believe your business idea is feasible, imagine your business idea is now up and running. What successes and problems might you experience? How would you overcome any failures? Discuss with your counselor any ethical questions you might face and how you would deal with them.
