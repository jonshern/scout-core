id: badge:nuclear-science
name: Nuclear Science
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/nuclear-science/
worksheet_url: http://usscouts.org/mb/worksheets/Nuclear-Science.pdf
requirements:
  - n: "1"
    updated_2026: true
    text: "Radiation. Do the following:"
    children:
      - n: 1a
        text: Explain radiation and the difference between ionizing and nonionizing radiation.
      - n: 1b
        text: Explain the ALARA principle. Explain what process you would go through to ensure your dose is kept ALARA when performing the requirements in this merit badge.
      - n: 1c
        text: Describe the radiation hazard symbol and explain where it should be used.
      - n: 1d
        text: Explain how we are exposed to ionizing radiation from outside the earth as well as on earth every day. List four examples of Naturally Occurring Radioactive Materials, NORM, that are in your house or grocery store and explain why they are radioactive.
      - n: 1e
        text: Explain the difference between radiation exposure and contamination. Describe the hazards of radiation to humans, the environment, and wildlife. Calculate your approximate annual radiation dose and compare it to a typical expected dose of someone who works in a nuclear power plant.
  - n: "2"
    text: "Do the following:"
    children:
      - n: 2a
        text: "Explain the following terms: atom, nucleus, proton, neutron, electron, quark, isotope; alpha particle, beta particle, gamma ray, X-ray; ionization, radioactivity, radioisotope, stability."
      - n: 2b
        text: Choose an element from the periodic table. Construct 3-D models for the atoms of three isotopes of this element, showing neutrons, protons, and electrons. Write down the isotope notation for each model including the atomic and mass numbers. In a separate model or diagram, explain or show how quarks make up protons and neutrons.
  - n: "3"
    updated_2026: true
    text: Modern Particle Physics.
    children:
      - n: 3a
        text: Explain how a particle accelerator works.
      - n: 3b
        text: "Do ONE of the following:"
        choose: 1
        children:
          - n: 3b1
            text: Visit an accelerator, research lab, or university and discuss with a scientist how they study the properties of the nucleus or nucleons.
          - n: 3b2
            text: List three particle accelerators and describe several experiments conducted and their associated basic science and practical applications.
  - n: "4"
    updated_2026: true
    text: "Classic Experiments. Do TWO of the following:"
    choose: 2
    children:
      - n: 4a
        text: Build an electroscope. Show how it works. Place a radiation source near the electroscope ball and explain the effect it causes.
      - n: 4b
        text: Make a cloud chamber. Show how it can be used to see the tracks caused by radiation. Explain what is happening.
      - n: 4c
        text: Perform an experiment demonstrating half-life. Discuss decay chains.
  - n: "5"
    updated_2026: true
    text: "Radiation Safety. Do ONE of the following:"
    choose: 1
    children:
      - n: 5a
        text: Using a radiation survey meter and a radioactive source, show how the counts per minute change as the source gets closer to or farther from the radiation detector. Place three different materials between the source and the detector, then explain any differences in the measurements per minute. Explain how time, distance, and shielding can reduce an individual's radiation dose.
      - n: 5b
        text: Describe how radon is detected in homes. Discuss the steps taken for the long-term and shortterm test methods, tell how to interpret the results, and explain when each type of test should be used. Explain the health concern related to radon gas and tell what steps can be taken to reduce radon in buildings.
      - n: 5c
        text: Visit a place where X-rays are used. Draw a floor plan of this room. Show where the unit, the unit operator, and the patient would be when the X-ray unit is operated. Explain the precautions taken and the importance of those precautions for the safety of the operator.
  - n: "6"
    updated_2026: true
    text: "Nuclear Energy. Do ONE of the following:"
    choose: 1
    children:
      - n: 6a
        text: Make a drawing showing how nuclear fission happens. Observe a mousetrap reactor (setup by an adult) and use it to explain how a chain reaction could be started. Explain how a chain reaction could be stopped or controlled in a nuclear reactor. Explain what is meant by a "critical mass."
      - n: 6b
        text: Visit a local nuclear power plant or nuclear reactor either in person or online (with your parent or guardian's permission). Learn how a reactor works and how the plant generates electricity. Find out what percentage of electricity in the United States and in your state is generated by nuclear power plants, and by other methods. Make a graph of the information you find.
  - n: "7"
    updated_2026: true
    text: "Beneficial Applications of Nuclear Science. Give an example of each of the following and explain how nuclear science in used in this application: nuclear medicine, environmental applications, industrial applications, space exploration, and radiation therapy."
  - n: "8"
    updated_2026: true
    text: Careers. Explore careers related to nuclear science. Research one career to learn about the training and education needed, costs, job prospects, salary, job duties, and career advancement. Your research methods may include-with your parent or guardian’s permission-an internet or library search, an interview with a professional in the field, or a visit to a location where people in this career work. Discuss with your counselor both your findings and what about this profession might make it an interesting career.
