id: badge:horsemanship
name: Horsemanship
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/horsemanship/
worksheet_url: http://usscouts.org/mb/worksheets/Horsemanship.pdf
requirements:
  - n: "1"
    text: "Do the following:"
    children:
      - n: 1a
        text: Describe the safety precautions you should take when handling and caring for a horse.
      - n: 1b
        text: Describe the fire safety precautions you should take in a barn and around horses.
  - n: "2"
    text: Name the 15 main parts of a horse and discuss the function of each with your counselor.
  - n: "3"
    text: Name four breeds of horses. Explain the special features for which each breed is known.
  - n: "4"
    text: Describe the symptoms of colic. Name and describe four other horse health problems.
  - n: "5"
    text: Explain what conformation is and why it is important. Explain the difference between lameness and unsoundness.
  - n: "6"
    text: Explain the importance of hoof care and why a horse might need to wear shoes.
  - n: "7"
    text: Demonstrate how to groom a horse, including picking hooves and caring for a horse after a ride.
  - n: "8"
    text: Explain how to determine what and how much to feed a horse and why the amount and kind of feed are changed according to the activity level and the breed of horse. A parent, guardian, or counselor may supervise the Scout’s work on any Home Repairs requirements.
  - n: "9"
    text: "Do the following:"
    children:
      - n: 9a
        text: Name 10 parts of the saddle and bridle that you will use, and explain how to care for this equipment.
      - n: 9b
        text: Show how to properly saddle and bridle a horse.
      - n: 9c
        text: Demonstrate how to safely mount and dismount a horse.
  - n: "10"
    text: Explain and demonstrate how to approach and lead a horse safely from a stall, corral, or field and how to tie the horse securely.
  - n: "11"
    text: On level ground, continuously do the following movements after safely mounting the horse. Do them correctly, at ease, and in harmony with the horse.
    children:
      - n: 11a
        text: Walk the horse in a straight line for 60 feet.
      - n: 11b
        text: Walk the horse in a half-circle of not more than 16 feet in radius.
      - n: 11c
        text: Trot or jog the horse in a straight line for 60 feet.
      - n: 11d
        text: Trot or jog the horse in a half-circle of not more than 30 feet in radius.
      - n: 11e
        text: Halt straight.
      - n: 11f
        text: Back up straight four paces.
      - n: 11g
        text: Halt and dismount.
  - n: "12"
    updated_2026: true
    text: "Do ONE of the following:"
    choose: 1
    children:
      - n: 12a
        text: Explore careers related to this merit badge. Research one career to learn about the training and education needed, costs, job prospects, salary, job duties, and career advancement. Your research methods may include-with your parent or guardian’s permission-an internet or library search, an interview with a professional in the field, or a visit to a location where people in this career work. Discuss with your counselor both your findings and what about this profession might make it an interesting career.
      - n: 12b
        text: Explore how you could use knowledge and skills from this merit badge to pursue a hobby or healthy lifestyle. Research any training needed, expenses, and organizations that promote or support it. Discuss with your counselor what short-term and long-term goals you might have if you pursued this.
