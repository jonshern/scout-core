id: badge:welding
name: Welding
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/welding/
worksheet_url: http://usscouts.org/mb/worksheets/Welding.pdf
requirements:
  - n: "1"
    text: "Do the following:"
    children:
      - n: 1a
        text: Explain to your counselor the hazards you are most likely to encounter while welding, and what you should do to anticipate, help prevent, mitigate, or lessen these hazards.
      - n: 1b
        text: Show that you know first aid for, and the prevention of, injuries or illnesses that could occur while welding, including electrical shock, eye injuries, burns, fume inhalation, dizziness, skin irritation, and exposure to hazardous chemicals, including filler metals and welding gases.
  - n: "2"
    text: "Do the following:"
    children:
      - n: 2a
        text: With your counselor, discuss general safety precautions and Safety Data Sheets related to welding. Explain the importance of the SDS.
      - n: 2b
        text: Describe the appropriate safety gear and clothing that must be worn when welding. Then, present yourself properly dressed for welding—in protective equipment, clothing, and footwear.
      - n: 2c
        text: Explain and demonstrate the proper care and storage of welding equipment, tools, and protective clothing and footwear.
  - n: "3"
    text: Explain the terms welding, electrode, slag, oxidation. Describe the welding process, how heat is generated, what kind of filler metal is added (if any), and what protects the molten metal from the atmosphere.
  - n: "4"
    text: Name the different mechanical and thermal cutting methods. Choose one method and describe how to use the process. Discuss one advantage and one limitation of this process.
  - n: "5"
    text: "Do the following:"
    children:
      - n: 5a
        text: Select two welding processes, and make a list of the different components of the equipment required for each process. Discuss one advantage and one limitation for each process.
      - n: 5b
        text: Choose one welding process. Set up the process you have chosen, including gas regulators, work clamps, cables, filler materials, and equipment settings. Have your counselor inspect and approve the area for the welding process you have chosen.
  - n: "6"
    text: "After successfully completing requirements 1 through 5, use the equipment you prepared for the welding process in 5(b) to do the following:"
    children:
      - n: 6a
        text: Using a metal scribe or soapstone, sketch your initial onto a metal plate, and weld a bead on the plate following the pattern of your initial.
      - n: 6b
        text: Cover a small plate (approximately 3" x 3" x ¼") with weld beads side by side.
      - n: 6c
        text: Tack two plates together in a square groove butt joint.
      - n: 6d
        text: Weld the two plates together from 6(c) on both sides.
      - n: 6e
        text: Tack two plates together in a T joint, have your counselor inspect it, then weld a T joint with fillet weld on both sides.
      - n: 6f
        text: Tack two plates together in a lap joint, have your counselor inspect it, then weld a lap joint with fillet weld on both sides.
  - n: "7"
    text: "Do the following:"
    children:
      - n: 7a
        text: Find out about three career opportunities in the welding industry. Pick one and find out the education, training, and experience required for this profession. Discuss this with your counselor, and explain why the profession might interest you.
      - n: 7b
        text: Discuss the role of the American Welding Society in the welding profession.
