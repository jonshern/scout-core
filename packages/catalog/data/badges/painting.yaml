id: badge:painting
name: Painting
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/painting/
worksheet_url: http://usscouts.org/mb/worksheets/Painting.pdf
requirements:
  - n: "1"
    text: Explain the proper safety procedures to follow when preparing surfaces and applying coatings.
  - n: "2"
    text: "Do the following:"
    children:
      - n: 2a
        text: Explain three ways that coatings can improve a surface.
      - n: 2b
        text: Explain the differences between oil-based paints, acrylic-based paints, and water-based paints.
      - n: 2c
        text: Explain where you would apply enamel paint, flat paint, wood stain, and varnish, and explain the importance of sheen.
      - n: 2d
        text: Tell why each is best for these uses.
  - n: "3"
    text: Prepare and paint two different surfaces using patching materials or caulking and the proper primers and topcoats. Suggested projects include an interior or exterior wall, a door, a piece of furniture, a concrete wall or floor, a porch rail, or a fence. Your counselor must preapprove the projects.
  - n: "4"
    text: Prepare and paint an item using harmonizing colors that you have selected using the color wheel in the Painting pamphlet.
  - n: "5"
    text: Show the right way to use, clean, maintain, and store painting equipment.
  - n: "6"
    text: Explain the importance of ladder safety, personal hygiene, and the use of personal protective equipment when painting.
  - n: "7"
    text: Explain some of the environmental and health issues concerning removing paint, applying paint, and discarding old paint.
  - n: "8"
    updated_2026: true
    text: "Do ONE of the following:"
    choose: 1
    children:
      - n: 8a
        text: Explore careers related to this merit badge. Research one career to learn about the training and education needed, costs, job prospects, salary, job duties, and career advancement. Your research methods may include-with your parent or guardian’s permission-an internet or library search, an interview with a professional in the field, or a visit to a location where people in this career work. Discuss with your counselor both your findings and what about this profession might make it an interesting career.
      - n: 8b
        text: Explore how you could use knowledge and skills from this merit badge to pursue a hobby or healthy lifestyle. Research any training needed, expenses, and organizations that promote or support it. Discuss with your counselor what short-term and long-term goals you might have if you pursued this.
