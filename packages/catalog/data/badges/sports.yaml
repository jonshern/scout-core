id: badge:sports
name: Sports
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/sports/
worksheet_url: http://usscouts.org/mb/worksheets/Sports.pdf
notes:
  - "Note: The activities used to fulfill the requirements for the Sports merit badge may not be used to help fulfill requirements for other merit badges."
requirements:
  - n: "1"
    text: "Do the following:"
    children:
      - n: 1a
        text: Explain to your counselor the most likely risks you may encounter while participating in sports, and what you should do to anticipate, help prevent, mitigate, and respond to these hazards.
      - n: 1b
        text: Show that you know first aid for injuries or illnesses that could occur while participating in sports, including sprains; strains; muscle cramps; contusions; abrasions; blisters; dehydration; heat reactions; fractures; injured teeth; head, neck, and back injuries; concussions.
  - n: "2"
    text: "Explain the importance of the following:"
    children:
      - n: 2a
        text: The importance of the physical exam
      - n: 2b
        text: The importance of maintaining good health habits for life (such as exercising regularly), and how the use of tobacco products, alcohol, and other harmful substances can negatively affect your health and your performance in sports activities
      - n: 2c
        text: The importance of maintaining a healthy diet
  - n: "3"
    text: "Discuss the following:"
    children:
      - n: 3a
        text: The importance of warming up and cooling down
      - n: 3b
        text: The importance of weight training
      - n: 3c
        text: What an amateur athlete is and the differences between an amateur and a professional athlete
      - n: 3d
        text: The attributes (qualities) of a good sport, the importance of sportsmanship, and the traits of a good team leader and player who exhibits Scout spirit on and off the playing field
  - n: "4"
    text: "Select TWO of the following sports and discuss with your counselor how you will complete the requirements in 5(a) through 5(h) for each sport: badminton, baseball, basketball, bowling, cross-country, diving, field hockey, flag football, flag team, golf, gymnastics, ice hockey, lacrosse, soccer, softball, spirit/cheerleading, swimming, tackle football, table tennis, tennis, track and field, volleyball, water polo, and/or wrestling. Your counselor may approve in advance other recognized sports, but not any sport that is prohibited by Scouting America. The sports you choose must include regular practice sessions and at least four structured, officiated, scored games, meets, or contests against other competitive individuals or organized teams during the period of participation."
  - n: "5"
    text: "Do the following:"
    children:
      - n: 5a
        text: With guidance from your counselor, establish a suitable personal training program that you will follow throughout your competition season (or for three months).
      - n: 5b
        text: Create a chart or other tracking system, and document your training, practice, and development during this time.
      - n: 5c
        text: Demonstrate proper technique to play each sport effectively and avoid injury.
      - n: 5d
        text: List and describe the equipment needed for each sport, including protective equipment and any specialized clothing.
      - n: 5e
        text: List and explain the rules and proper etiquette of each sport.
      - n: 5f
        text: Draw and explain a diagram of the playing area for each sport.
      - n: 5g
        text: Participate in each sport as a competitive individual or as a member of an organized team for one season (or for three months).
      - n: 5h
        text: At the end of the season, share your completed chart with your counselor and discuss how your participation in the sports you chose has affected you mentally and physically.
  - n: "6"
    text: "Do ONE of the following:"
    choose: 1
    children:
      - n: 6a
        text: Identify three career opportunities that would use skills and knowledge related to a sport. Pick one and research the training, education, certification requirements, experience, and expenses associated with entering the field. Research the prospects for employment, starting salary, advancement opportunities and career goals associated with this career. Discuss what you learned with your counselor and whether you might be interested in this career.
      - n: 6b
        text: Identify how you might use skills and knowledge related to a sport to pursue a personal hobby and/or healthy lifestyle. Research the additional training required, expenses, and affiliation with organizations that would help you maximize the enjoyment and benefit you might gain from it. Discuss what you learned with your counselor and share what short-term and long-term goals you might have if you pursued this.
