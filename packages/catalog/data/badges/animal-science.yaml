id: badge:animal-science
name: Animal Science
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/animal-science/
worksheet_url: http://usscouts.org/mb/worksheets/Animal-Science.pdf
requirements:
  - n: "1"
    text: "Name two breeds of livestock in each of the following classifications: horses, dairy cattle, beef cattle, sheep, hogs, poultry, and goats. Tell their principal uses and merits. Tell where the breeds originated."
  - n: "2"
    text: List two diseases that afflict the animals in each of the classifications in requirement 1. Also list five diseases of poultry. Describe the symptoms of each disease and explain how each is contracted and how it could be prevented.
  - n: "3"
    text: Draw models of the digestive tracts of ruminants, horses, pigs, and poultry. Explain how the differences in structure and function among these types of digestive tracts affect the nutritional management of these species.
  - n: "4"
    text: Select one type of animal—beef cow, dairy cow, horse, sheep, goat, or hog, or a poultry flock—and tell how you would properly manage it. Include in your discussion nutritional (feeding) concerns, housing, disease prevention, waste control/removal, breeding programs, and biosecurity as appropriate.
  - n: "5"
    text: "Do the following:"
    children:
      - n: 5a
        text: Explain how agricultural producers make desired improvements to their stock through breeding practices and programs.
      - n: 5b
        text: Explain the terms pure breeding and cross breeding.
      - n: 5c
        text: List two modern technologies used in the production of horses, dairy cattle, beef cattle, sheep, hogs, poultry, or goats. and tell what the advantages are of using the technology.
  - n: "6"
    text: "Complete ONE of the following options:"
    choose: 1
    options:
      - key: A
        name: Beef Cattle Option
      - key: B
        name: Dairy Option
      - key: C
        name: Horse Option
      - key: D
        name: Sheep or Goat Option (choose one and complete the following based upon the choice)
      - key: E
        name: Hog Option
      - key: F
        name: Avian Option
    children:
      - n: 6a-optA
        option: A
        text: "Visit a farm or ranch where beef cattle are produced under any of these systems:"
        children:
          - n: 6a-optA1
            text: Feeding market cattle for harvest
          - n: 6a-optA2
            text: Cow/calf operation, producing cattle for sale to commercial feeders
          - n: 6a-optA3
            text: Producing purebred cattle for sale as breeding stock to others Talk with the operator to learn how the cattle were handled, fed, weighed, and shipped. Describe what you saw and explain what you learned. If you cannot visit a cattle ranch or farm, view a video from a breed association, or research the internet (with your parent or guardian’s permission) for information on beef cattle production. Tell about your findings.
      - n: 6b-optA
        option: A
        text: Sketch a plan of a feedlot to include its forage and grain storage facilities, and loading chute for 30 or more fattening steers; or sketch a corral plan with cutting and loading chutes for handling 50 or more beef cows and their calves at one time.
      - n: 6c-optA
        option: A
        text: Make a sketch showing the principal wholesale and retail cuts of beef. Tell about the U.S. Department of Agriculture (USDA) dual grading system of beef. Tell the basis of each grade in each system.
      - n: 6d-optA
        option: A
        text: "Define the following terms: bull, steer, bullock, cow, heifer, freemartin, heiferette, calf."
      - n: 6a-optB
        option: B
        text: Tell how a cow or a goat converts forage and grain into milk. Explain the differences in feeds typically used for dairy cows versus those fed to beef cows.
      - n: 6b-optB
        option: B
        text: Make a chart showing the components in cow’s milk or goat’s milk. Chart the amount of each component.
      - n: 6c-optB
        option: B
        text: Explain the requirements for producing grade A milk. Tell how and why milk is pasteurized.
      - n: 6d-optB
        option: B
        text: Tell about the kinds of equipment used for milking and the sanitation standards that must be met on dairy farms.
      - n: 6e-optB
        option: B
        text: "Define the following terms: bull, cow, steer, heifer, springer; buck, doe, kid."
      - n: 6f-optB
        option: B
        text: Visit a dairy farm or a milk processing plant. Describe what you saw and explain what you learned. If you cannot visit a dairy farm or processing plant, view a video from a breed or dairy association, or research the internet (with your parent or guardian’s permission) for information on dairying. Tell about your findings.
      - n: 6a-optC
        option: C
        text: Make a sketch of a useful saddle horse barn and exercise yard.
      - n: 6b-optC
        option: C
        text: Tell about the history of the horse and the benefits it has brought to people. Using the four breeds of horses you chose in requirement 1, discuss the different special uses of each breed.
      - n: 6c-optC
        option: C
        text: "Define the following terms: mare, stallion, gelding, foal, colt, filly; mustang, quarter horse, draft horse, pacer, trotter; pinto, calico, palomino, roan, overo, tobiano."
      - n: 6d-optC
        option: C
        text: Visit a horse farm. Describe what you saw and explain what you learned. If you cannot visit a horse farm, view a video from a breed association, or research the internet (with your parent or guardian’s permission) for information on horses. Tell about your findings.
      - n: 6e-optC
        option: C
        text: Outline the proper feeding of a horse doing light work. Explain why the amount and kind of feed will change according to the kind of horse and the work it does. Describe what colic is, what can cause it, and its symptoms.
      - n: 6a-optD
        option: D
        text: Make a sketch of a live lamb or goat. Show the location of the various wholesale and retail cuts.
      - n: 6b-optD
        option: D
        text: Discuss how wools are sorted and graded.
      - n: 6c-optD
        option: D
        text: List products that can be made from the milk
      - n: 6d-optD
        option: D
        text: "Based on your choice, do ONE of the following:"
        choose: 1
        children:
          - n: 6d-optD1
            text: Raise a lamb or goat from weaning to market weight. Keep records of feed intake, weight gains, medication, vaccination, and mortality. Present your records to your counselor for review.
          - n: 6d-optD2
            text: Visit a farm or ranch where sheep or goats are raised. Describe what you saw and explain what you learned. If you cannot visit a sheep or goat farm or ranch, view a video from a breed association, or research the Internet (with your parent’s permission) for information on sheep or goats. Tell about your findings.
      - n: 6e-optD
        option: D
        text: Define the following terms for a sheep (wether, ewe, ram, lamb) OR a goat (doe, nanny, kid, buck, billy).
      - n: 6a-optE
        option: E
        text: Make a sketch showing the principal wholesale and retail cuts of pork. Tell about the recommended USDA grades of pork. Tell the basis for each grade.
      - n: 6b-optE
        option: E
        text: Outline in writing the proper feeding programs used from the breeding of a gilt or sow through the weaning of the litter. Discuss the feeding programs for the growth and finishing periods.
      - n: 6c-optE
        option: E
        text: "Do ONE of the following:"
        choose: 1
        children:
          - n: 6c-optE1
            text: Raise a feeder pig from weaning to market weight. Keep records of feed intake, weight gains, medication, vaccination, and mortality. Present your records to your counselor for review.
          - n: 6c-optE2
            text: Visit a farm where hogs are produced, or visit a packing plant handling hogs. Describe what you saw and explain what you learned. If you cannot visit a hog production unit or packing plant, view a video from a packer or processor, or research the internet (with your parent or guardian’s permission) for information on hogs. Tell about your findings.
      - n: 6d-optE
        option: E
        text: "Define the following terms: gilt, sow, barrow, boar."
      - n: 6a-optF
        option: F
        text: Make a sketch of a layer house or broiler house showing nests, roosts, feeders, waterers, and means of ventilation. Explain how insulation, ventilation, temperature controls, automatic lights, and other environmental controls are used to protect birds from heat, cold, and bad weather. Explain the importance of light for egg production.
      - n: 6b-optF
        option: F
        text: Explain why overcrowding is dangerous for poultry flocks.
      - n: 6c-optF
        option: F
        text: Tell about the grading of eggs. Describe the classes of chicken meat.
      - n: 6d-optF
        option: F
        text: "Do ONE of the following:"
        choose: 1
        children:
          - n: 6d-optF1
            text: Manage an egg-producing flock for five months. Keep records of feed purchased, eggs sold, medication, vaccination, and mortality. Present your records to your counselor for review.
          - n: 6d-optF2
            text: Raise five chickens from hatching. Keep records of feed intake, weight gains, medication, vaccination, and mortality. Present your records to your counselor for review.
          - n: 6d-optF3
            text: Visit a commercial avian production facility. Describe what you saw and explain what you learned. If you cannot visit a commercial facility, view a video from a poultry association, or research the internet (with your parent or guardian’s permission) for information on poultry production. Tell about your findings.
      - n: 6e-optF
        option: F
        text: "Define the following terms: chick, pullet, hen, cockerel, cock, capon."
  - n: "7"
    text: Find out about three career opportunities in animal science. Pick one and find out the education, training, and experience required for this profession. Discuss this with your counselor, and explain why this profession might interest you.
