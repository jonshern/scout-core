id: badge:inventing
name: Inventing
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/inventing/
worksheet_url: http://usscouts.org/mb/worksheets/Inventing.pdf
requirements:
  - n: "1"
    text: "In your own words, define inventing. Then do the following:"
    children:
      - n: 1a
        text: Explain to your counselor the role of inventors and their inventions in the economic development of the United States.
      - n: 1b
        text: List three inventions and state how they have helped humankind.
  - n: "2"
    updated_2026: true
    text: "Do ONE of the following:"
    choose: 1
    children:
      - n: 2a
        text: With your parent or guardian's permission and counselor's approval, interview an adult who has invented a useful item or process. Report what you learned to your counselor.
      - n: 2b
        text: Read about three inventors. Select the one you find most interesting and tell your counselor what you learned.
  - n: "3"
    text: "Do the following:"
    children:
      - n: 3a
        text: Define the term intellectual property. Explain which government agencies oversee the protection of intellectual property, the types of intellectual property that can be protected, how such property is protected, and why protection is necessary.
      - n: 3b
        text: Explain the components of a patent and the different types of patents available.
      - n: 3c
        text: Examine your Scouting gear and find a patent number on a camping item you have used. With your parent or guardian’s permission, use the internet to find out more about that patent. Compare the finished item with the claims and drawings in the patent. Report what you learned to your counselor.
      - n: 3d
        text: Explain to your counselor the term patent infringement.
  - n: "4"
    text: Discuss with your counselor the types of inventions that are appropriate to share with others, and explain why. Tell your counselor about one unpatented invention and its impact on society.
  - n: "5"
    text: Choose a commercially available product that you have used on an overnight camping trip with your troop. Make recommendations for improving the product, and make a sketch that shows your recommendations. Discuss your recommendations with your counselor.
  - n: "6"
    text: Think of an item you would like to invent that would solve a problem for your family, troop, chartered organization, community, or a special-interest group. Then do the following, while keeping a notebook to record your progress.
    children:
      - n: 6a
        text: Talk to potential users of your invention and determine their needs. Then, based on what you have learned, write a statement describing the invention and how it would help solve a problem. This statement should include a detailed sketch of the invention.
      - n: 6b
        text: Create a model of the invention using clay, cardboard, or any other readily available material. List the materials necessary to build a working prototype of the invention.
      - n: 6c
        text: Share the idea and the model with your counselor and potential users of your invention. Record their feedback in your notebook.
  - n: "7"
    text: Build a working prototype of the item you invented for requirement 6*. Test and evaluate the invention. Among the aspects to consider in your evaluation are cost, usefulness, marketability, appearance, and function. Describe how your original vision and expectations for your invention are similar or dissimilar to the prototype you built. Have your counselor evaluate and critique your prototype.
  - n: "8"
    text: "Do ONE of the following:"
    choose: 1
    children:
      - n: 8a
        text: Participate with a club or team (robotics team, science club, or engineering club) that builds a useful item. Share your experience with your counselor.
      - n: 8b
        text: Visit a museum or exhibit dedicated to an inventor or invention, and create a presentation of your visit to share with a group such as your troop or patrol.
  - n: "9"
    text: Discuss with your counselor the diverse skills, education, training, and experience it takes to be an inventor. Discuss how you can prepare yourself to be creative and inventive to solve problems at home, in school, and in your community. Discuss three career fields that might utilize the skills of an inventor. *Before you begin building the prototype, you must have your counselor’s approval, based on the design and building plans you have already shared.
