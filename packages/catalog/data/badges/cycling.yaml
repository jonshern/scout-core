id: badge:cycling
name: Cycling
edition: 2026
eagle_required: true
official_url: https://www.scouting.org/merit-badges/cycling/
worksheet_url: http://usscouts.org/mb/worksheets/Cycling.pdf
notes:
  - deleted requirement
requirements:
  - n: "1"
    text: "Do the following:"
    children:
      - n: 1a
        text: Explain to your counselor the most likely hazards you may encounter while participating in cycling activities and what you should do to anticipate, help prevent, mitigate, and respond to these hazards. Explain to your counselor how to ride predictably, be conspicuous, think ahead, and ride ready.
      - n: 1b
        text: Show that you know first aid for injuries or illnesses that could occur while cycling, including cuts, scratches, concussions, blisters, sunburn, heat exhaustion, heatstroke, hypothermia, frostbite, dehydration, insect stings, tick bites, and snakebite. Explain to your counselor why you should be able to identify the poisonous plants and poisonous animals that are found in your area.
  - n: "2"
    text: Describe your state and local laws concerning bicycles. Discuss what is the same and what is different from laws applying to motor vehicles. Explain where and how you should ride on roads and streets to include lane position, changing lanes, making left and right turns, and riding through intersections.
  - n: "3"
    updated_2026: true
    text: Explain the importance of wearing the right clothing and gear while cycling, including a properly sized and fitted helmet. Know the Scouting America Bike Safety Guidelines.
  - n: "4"
    text: "Using a bicycle safety checklist, clean and adjust a bicycle and present it to your counselor for inspection. Do the following:"
    children:
      - n: 4a
        text: Show points that should be checked regularly to make sure the bicycle is safe to ride.
      - n: 4b
        text: Show how to adjust the saddle and handlebars for a proper fit.
      - n: 4c
        text: Show how to adjust brakes and gear shifting (derailleurs).
      - n: 4d
        text: Show all points that need regular lubrication.
      - n: 4e
        text: Show how to repair a flat by removing the tire, replacing or patching the tube, and remounting the tire.
      - n: 4f
        text: Show that the bicycle meets local laws.
  - n: "5"
    text: Demonstrate basic bicycle handling skills to your counselor, to include how to properly mount your bicycle, starting and stopping (to include emergency stops), riding in a straight line, turning, shifting gears, scanning, and signaling.
  - n: "6"
    text: "Using the Scouting America buddy system, complete all of the requirements for ONE of the following options: Road Biking OR Trail or Mixed Surface Biking. These requirements may be completed using a road bike, mountain bike or other properly equipped, manually-powered cycle such as a gravel bike, tandem bike, hand-powered bike, recumbent bike, adult tricycle, or adaptive cycle. If a tandem bike is used, the Scout must actively power the cycle in concert with the other rider."
    choose: 1
    options:
      - key: A
        name: Road Biking
      - key: B
        name: "Trail or Mixed Surface Biking. Do ALL of the following: Note: These requirements may be completed using a mountain bike or other properly equipped, manually-powered cycle such as a gravel bike, tandem bike, hand-powered bike, recumbent bike, adult tricycle, or adaptive cycle. If a tandem bike is used, the Scout must actively power the cycle in concert with the other rider."
    children:
      - n: 6a-optA
        option: A
        text: "Take a road safety test with your counselor and demonstrate the following:"
        children:
          - n: 6a-optA1
            text: On an urban street with light traffic, properly execute a left turn from the center of the street; also demonstrate an alternate left-turn technique used during periods of heavy traffic.
          - n: 6a-optA2
            text: Properly execute a right turn.
          - n: 6a-optA3
            text: Demonstrate appropriate actions at a right-turn-only lane when you are continuing straight.
          - n: 6a-optA4
            text: Show proper curbside and road-edge riding. Show how to ride safely along a row of parked cars.
          - n: 6a-optA5
            text: Cross railroad tracks properly.
      - n: 6b-optA
        option: A
        text: Avoiding main highways, take two rides of 10 miles each, two rides of 15 miles each, and two rides of 25 miles each. You must make a report of the rides taken. List dates for the routes traveled, and interesting things seen on the ride.
      - n: 6c-optA
        option: A
        text: "After completing requirement b for the road biking option, do ONE of the following:"
        children:
          - n: 6c-optA1
            text: Lay out on a road map a 50-mile trip. Stay away from main highways. Using your map, make this ride in eight hours or less.
          - n: 6c-optA2
            text: Participate in an organized bike tour of at least 50 miles. Make this ride in eight hours or less. Afterward, use the tour’s cue sheet to make a map of the ride.
        choose: 1
      - n: 6a-optB
        option: B
        updated_2026: true
        text: "Demonstrate the following mountain bike handling skills to your counselor:"
        children:
          - n: 6a-optB1
            text: Neutral position, ready position, bike body separation (side to side, and forward and back), and body positioning for cornering
          - n: 6a-optB2
            text: Show shifting skills as applicable to climbs and obstacles.
          - n: 6a-optB3
            text: Show proper technique for riding up and down hills, including when you would ride seated, crouched, or standing.
      - n: 6b-optB
        option: B
        updated_2026: true
        text: "Take a trail safety test with your counselor and demonstrate the following:"
        children:
          - n: 6b-optB1
            text: Show proper trail etiquette to hikers and other cyclists, including when to yield the right-of-way.
          - n: 6b-optB2
            text: Demonstrate how to correctly cross an obstacle by either going over the obstacle on your bike or dismounting your bike and crossing over or around the obstacle
          - n: 6b-optB3
            text: Cross rocks, gravel, and roots properly
      - n: 6c-optB
        option: B
        updated_2026: true
        text: Describe the rules of trail riding, including how to know when a trail is unsuitable for riding.
      - n: 6d-optB
        option: B
        updated_2026: true
        text: On mountain biking or multi-use trails approved by your counselor, take two rides of 2 miles each, two rides of 5 miles each, and two rides of 8 miles each. You must make a report of the rides taken. List dates for the routes traveled, and interesting things seen.
      - n: 6e-optB
        option: B
        updated_2026: true
        text: After fulfilling the previous requirement, lay out on a trail map a 22-mile trip. You may include multiple trail systems, if needed. Stay away from main highways. Using your map, complete this ride in one day.
