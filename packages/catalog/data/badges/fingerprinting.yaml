id: badge:fingerprinting
name: Fingerprinting
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/fingerprinting/
worksheet_url: http://usscouts.org/mb/worksheets/Fingerprinting.pdf
requirements:
  - n: "1"
    text: Give a short history of fingerprinting. Tell the difference between civil and criminal identification.
  - n: "2"
    text: "Do the following:"
    children:
      - n: 2a
        text: Explain the difference between the automated fingerprint identification systems (AFIS) now used by law enforcement agencies and the biometric fingerprint systems used to control access to computers and places like buildings and airports.
      - n: 2b
        text: Discuss how our society uses identification systems based on tokens, passwords, and biometrics.
  - n: "3"
    text: "Do the following:"
    children:
      - n: 3a
        text: Name the surfaces of the body where friction or papillary ridges are found.
      - n: 3b
        text: Name the two basic principles supporting the science of fingerprints and give a brief explanation of each principle.
      - n: 3c
        text: Explain what it takes to positively identify a person using fingerprints.
  - n: "4"
    text: "Take a clear set of prints using ONE of the following methods:"
    children:
      - n: 4a
        text: Make both rolled and plain impressions. Make these on an 8-by-8-inch fingerprint identification card, available from your local police department or your counselor.
      - n: 4b
        text: Using clear adhesive tape, a pencil, and plain paper, record your own fingerprints or those of another person.
  - n: "5"
    text: Show your counselor you can identify the three basic types of fingerprint patterns and their subcategories. Using your own hand, identify the types of patterns you see.
  - n: "6"
    text: Identify three career opportunities that would use skills and knowledge in the areas of biometrics and/or fingerprinting. Pick one and research the training, education, certification requirements, experience, and expenses associated with entering the field. Research the prospects for employment, starting salary, advancement opportunities, and career goals associated with this career. Discuss what you learned with your counselor and whether you might be interested in this career.
