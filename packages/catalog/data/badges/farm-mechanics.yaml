id: badge:farm-mechanics
name: Farm Mechanics
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/farm-mechanics/
worksheet_url: http://usscouts.org/mb/worksheets/Farm-Mechanics.pdf
requirements:
  - n: "1"
    text: "Do the following:"
    children:
      - n: 1a
        text: Discuss with your counselor the safety equipment, tools, and clothing used while checking or repairing farm equipment. Use this equipment, tools, and/or clothing (when needed or called for) in meeting the requirements for this merit badge.
      - n: 1b
        text: Draw a plan showing a well-equipped farm shop. Point out the shop’s mandatory safety devices and features.
      - n: 1c
        text: Find all the universal warning and safety symbols on a piece of equipment and explain what they mean.
      - n: 1d
        text: Describe what a safety data sheet (SDS) is and tell why it is used. Obtain the SDS for any engine coolant, oil, grease, fuel, hydraulic or transmission fluid, or other flammable or hazardous materials you use in meeting the requirements for this merit badge.
  - n: "2"
    text: "Explain how power is produced or transferred in a:"
    children:
      - n: 2a
        text: Diesel engine
      - n: 2b
        text: Hydraulic system
      - n: 2c
        text: Transmission or any other power system
  - n: "3"
    text: "Do TWO of the following:"
    choose: 2
    children:
      - n: 3a
        text: Replace the handle of any tool found on the farm.
      - n: 3b
        text: Organize a tool rack or a storage system for nails, bolts, nuts, and washers.
      - n: 3c
        text: Using a hand file, properly dress the mushroomed head of a chisel or punch.
      - n: 3d
        text: Using a hand file, correctly dress a screwdriver tip.
  - n: "4"
    text: "Do ONE of the following:"
    choose: 1
    children:
      - n: 4a
        text: "On an engine-powered machine: Grease all fittings, change the oil and oil filter, clean the air filter, clean the radiator fins, and replace the fuel filters."
      - n: 4b
        text: For any engine-powered machine, create a preoperational checklist; include checking the engine coolant, engine oil, hydraulic and/or transmission fluid, and battery voltage (using a voltmeter). Using your checklist, conduct a preoperational check of that machinery or equipment.
      - n: 4c
        text: Prepare any farm machine for winter storage.
  - n: "5"
    text: Visit an implement dealer. Interview the dealer technician or service manager for hints on good preventive maintenance. Ask why it is important, the costs, and what causes wear or damage. Report what you learn.
  - n: "6"
    text: "Explain each step in ONE of the following maintenance procedures:"
    children:
      - n: 6a
        text: Tightening hydraulic fittings
      - n: 6b
        text: Checking the air filter
      - n: 6c
        text: Cleaning a work piece with a wire-brush wheel
  - n: "7"
    text: Find out about three career opportunities in farm mechanics. Pick one and find out the education, training, and experience required for this profession. Discuss this with your counselor, and explain why this profession might interest you.
