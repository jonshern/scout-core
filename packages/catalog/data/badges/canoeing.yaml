id: badge:canoeing
name: Canoeing
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/canoeing/
worksheet_url: http://usscouts.org/mb/worksheets/Canoeing.pdf
requirements:
  - n: "1"
    text: "Do the following:"
    children:
      - n: 1a
        text: Review with your counselor the most likely hazards you may encounter while participating in canoeing activities and what you should do to anticipate, help prevent, mitigate, and respond to these hazards.
      - n: 1b
        text: "Review prevention, symptoms, and first-aid treatment for the following injuries or illnesses that could occur while canoeing: blisters, cold-water shock and hypothermia, dehydration, heat-related illnesses, sunburn, sprains, strains."
      - n: 1c
        text: Discuss the Scouting America Safety Afloat policy. Tell how it applies to canoeing activities.
  - n: "2"
    updated_2026: true
    text: Before doing the following requirements, successfully complete the Scouting America swimmer test, found in the Swimming merit badge pamphlet.
  - n: "3"
    text: "Do the following:"
    children:
      - n: 3a
        text: Name and point out the major parts of a canoe.
      - n: 3b
        text: Describe how the length and shape of a canoe affect its performance.
  - n: "4"
    text: "Do the following:"
    children:
      - n: 4a
        text: Name and point out the parts of a paddle.
      - n: 4b
        text: Demonstrate how to correctly size a paddle for a paddler in a sitting position and a kneeling position.
  - n: "5"
    text: "Do the following:"
    children:
      - n: 5a
        text: Review with your counselor the characteristics of life jackets most appropriate for canoeing and tell why a life jacket must always be worn while paddling.
      - n: 5b
        text: Demonstrate how to select and properly fit the correct size life jacket.
      - n: 5c
        text: Review the importance of safety and rescue equipment such as a sound signal device, extra paddle, sponge, bailer, bilge pump, rescue sling, ropes, throw bag.
  - n: "6"
    text: Review with your counselor the general care and maintenance of canoes, paddles, and other canoeing equipment.
  - n: "7"
    text: "With a companion, use a properly equipped canoe to demonstrate the following:"
    children:
      - n: 7a
        text: Safely carry and launch the canoe from a dock or shore (both, if possible).
      - n: 7b
        text: Safely land the canoe on a dock or shore (both, if possible) and return it to its proper storage location.
      - n: 7c
        text: Demonstrate kneeling and sitting positions in a canoe and explain the proper use for each position.
      - n: 7d
        text: Change places while afloat in the canoe.
  - n: "8"
    text: "With a companion, use a properly equipped canoe to demonstrate the following:"
    children:
      - n: 8a
        text: Safely exit the canoe in deep water without losing contact with the canoe. Reenter the canoe with the assistance of the other paddler without capsizing the boat.
      - n: 8b
        text: Safely perform a controlled capsize of the canoe and demonstrate how staying with a capsized canoe will support both paddlers.
      - n: 8c
        text: Swim, tow, or push a swamped canoe 50 feet to shallow water. In the shallow water, empty the swamped canoe and reenter it.
      - n: 8d
        text: In deep water, rescue a swamped canoe and its paddlers. After checking that those in the water do not need immediate assistance, empty the swamped canoe and help the paddlers safely reenter their boat without capsizing.
      - n: 8e
        text: Perform a canoe rescue of a conscious swimmer.
      - n: 8f
        text: Using a rescue (throw) bag from shore, lay the line within 3 feet of a conscious swimmer 30 feet away. Show how to repack the bag when done.
  - n: "9"
    text: "With a companion, using a properly equipped canoe to demonstrate the following tandem maneuvers while paddling in unison on opposite sides and without changing sides. Each paddler must demonstrate these maneuvers in both the bow and stern and on both sides of the canoe while maintaining trim and balance of the canoe:"
    children:
      - n: 9a
        text: Pivot (spin) the canoe 180° (half circle) to the right from a stationary position, stop, and return to the starting position by pivoting to the left using draw and pushaway strokes or using forward and reverse sweeps staying within 2 boat lengths of the starting position.
      - n: 9b
        text: Move a canoe sideways (abeam) in one direction for 10 feet and then return to the starting position using the draw and pushaway strokes.
      - n: 9c
        text: While in forward motion, stop the canoe within two boat lengths using the backstroke.
      - n: 9d
        text: While in the stern position and without assistance from the bow paddler, paddle in a straight line 15-20 boat lengths using an appropriate steering stroke, e.g., the J-stroke or thumb-down rudder stroke with or without a stern pry.
      - n: 9e
        text: Move the canoe in a straight line 15-20 boat lengths with the bow paddler using as necessary the forward stroke, draw stroke or forward sweep and the stern paddler using an appropriate steering stroke, e.g., the J-stroke or thumbdown rudder stroke with or without a stern pry.
      - n: 9f
        text: While maintaining forward motion, turn the canoe 90° in an arc to the right in 5-10 boat lengths with the bow paddler using as necessary either the draw stroke or forward sweep and the stern paddler using only the forward stroke. Repeat the maneuver turning the canoe 90° to the left.
      - n: 9g
        text: Move the canoe backwards in a straight line 3-4 boat lengths using as necessary the back stroke, reverse sweep or draw stroke in the bow or the stern.
      - n: 9h
        text: Complete a figure of 8 course around markers 3-4 boat lengths apart using appropriate strokes including the draw stroke, and the forward and reverse sweeps.
