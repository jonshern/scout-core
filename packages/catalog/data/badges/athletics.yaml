id: badge:athletics
name: Athletics
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/athletics/
worksheet_url: http://usscouts.org/mb/worksheets/Athletics.pdf
notes:
  - If meeting any of the requirements for this merit badge is against the Scout’s religious convictions, the requirement does not have to be done if the Scout’s parent or guardian and the proper religious advisors state in writing that to do so would be against religious convictions. The Scout’s parent or guardian must also accept full responsibility for anything that might happen because of this exemption.
requirements:
  - n: "1"
    text: "Do the following:"
    children:
      - n: 1a
        text: Explain to your counselor the most likely hazards you may encounter during athletic activities, and what you should do to anticipate, help prevent, mitigate, and respond to these hazards.
      - n: 1b
        text: Show that you know first aid for injuries or illnesses that could occur while participating in athletics events, including sprains, strains, contusions, abrasions, blisters, dehydration, heat reactions, and concussions.
  - n: "2"
    updated_2026: true
    text: "Do the following with your counselor:"
    children:
      - n: 2a
        text: Discuss the importance of having a physical examination each year. Discuss why overall health, immunizations, medications, allergies, and medical history are covered during an examination. Tell your counselor when you last underwent a physical examination.
      - n: 2b
        text: Explain how you maintain good health habits, especially during training, and how the use of tobacco products, alcohol, and other harmful substances can negatively affect your health and your performance in athletic activities.
      - n: 2c
        text: Describe the elements of a nutritious, balanced diet, and explain what you do to maintain a healthy diet.
  - n: "3"
    updated_2026: true
    text: "Select an athletic activity that interests you, then do the following:"
    children:
      - n: 3a
        text: With guidance from your counselor, establish a personal training program suited to the activity you have chosen. Follow this training program for three months.
      - n: 3b
        text: Use a chart or other tracking method to monitor your progress during this time.
      - n: 3c
        text: Explain to your counselor the equipment necessary to participate in this activity and the appropriate clothing for the activity and time of year.
      - n: 3d
        text: At the end of three months, review your records from requirement 3(b), and discuss with your counselor what progress you have made during training. Tell how your development has affected you mentally and physically.
  - n: "4"
    updated_2026: true
    text: "Do the following:"
    children:
      - n: 4a
        text: Explain the rules for two athletic activities, one of which is the activity you chose for requirement 3.
      - n: 4b
        text: Discuss the importance of warming up and cooling down before and after each training session or event.
      - n: 4c
        text: Explain to your counselor what an amateur athlete is and the differences between an amateur and a professional athlete.
      - n: 4d
        text: Discuss the traits and importance of good sportsmanship. Tell what role sportsmanship plays in both individual and group athletic activities.
  - n: "5"
    text: "Complete the activities in FOUR of the following options and show improvement over a three-month period:"
    choose: 4
    options:
      - key: A
        name: Sprinting
      - key: B
        name: Long-Distance Running
      - key: C
        name: Long Jump OR High Jump
      - key: D
        name: Swimming
      - key: E
        name: Pull-Ups AND Push-Ups
      - key: F
        name: Baseball Throw
      - key: G
        name: "Basketball Shooting. Do ALL of the following:"
      - key: H
        name: Football Kick OR Soccer Kick
      - key: I
        name: Weight Training
    children:
      - n: 5a-optA
        option: A
        text: 100-meter dash
      - n: 5b-optA
        option: A
        text: 200-meter dash
      - n: 5a-optB
        option: B
        text: 3k run
      - n: 5b-optB
        option: B
        text: 5k run
      - n: 5a-optC
        option: C
        text: Running long jump OR running high jump (best of three tries)
      - n: 5b-optC
        option: C
        text: Standing long jump OR standing high jump (best of three tries)
      - n: 5a-optD
        option: D
        text: 100-meter swim
      - n: 5b-optD
        option: D
        text: 200-meter swim
      - n: 5a-optE
        option: E
        text: Pull-ups in two minutes
      - n: 5b-optE
        option: E
        text: Push-ups in two minutes
      - n: 5a-optF
        option: F
        text: "Baseball throw for accuracy, 10 throws at a target (distance to be determined by age): ages 11 to 12, 20 feet; ages 13 to 15, 30 feet; ages 16 to 17, 40 feet"
      - n: 5b-optF
        option: F
        text: Baseball throw for distance, five throws (total distance)
      - n: 5a-optG
        option: G
        updated_2026: true
        text: Basketball shot for accuracy, 10 free-throw shots
      - n: 5b-optG
        option: G
        updated_2026: true
        text: "Basketball throw for skill and agility, the following shots:"
        children:
          - n: 5b-optG1
            text: Left-side layup
          - n: 5b-optG2
            text: Right-side layup
          - n: 5b-optG3
            text: Left side of hoop, along the key line
          - n: 5b-optG4
            text: Right side of hoop, along the key line
          - n: 5b-optG5
            text: Where key line and free-throw line meet, left side
          - n: 5b-optG6
            text: Where key line and free-throw line meet, right side
          - n: 5b-optG7
            text: Top of the key
          - n: 5b-optG8
            text: Another spot along the three-point line.
      - n: 5a-optH
        option: H
        text: Goals from the 10-yard line, eight kicks
      - n: 5b-optH
        option: H
        text: Football kick or soccer kick for distance, five kicks (total distance)
      - n: 5a-optI
        option: I
        text: Chest/bench press, two sets of 15 repetitions each
      - n: 5b-optI
        option: I
        text: Leg curls, two sets of 15 repetitions each
  - n: "6"
    text: "Do the following:"
    children:
      - n: 6a
        text: Prepare plans for conducting a sports meet or field day that includes 10 activities, at least five of which must come from the groups mentioned in requirement 5. Outline the duties of each official needed and list the equipment the meet will require.
      - n: 6b
        text: With your parent or guardian’s and counselor’s approval, serve as an official or volunteer at a sports meet to observe officials in action. Tell your counselor about your responsibilities at the meet and discuss what you learned.
  - n: "7"
    updated_2026: true
    text: "Do ONE of the following:"
    choose: 1
    children:
      - n: 7a
        text: Explore three careers related to athletics. Research one career area by interviewing an expert in the field, visiting a site, or using other resources. Learn about training, education, expenses, job outlook, salary, and advancement. Discuss your findings and career interest with your counselor.
      - n: 7b
        text: Explore how an area of athletics could contribute to a hobby or healthy lifestyle. Research education, costs, and organizations related to this activity. Discuss your findings and goals with your counselor.
