id: badge:engineering
name: Engineering
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/engineering/
worksheet_url: http://usscouts.org/mb/worksheets/Engineering.pdf
requirements:
  - n: "1"
    text: Select a manufactured item in your home (such as a toy or an appliance) and, under adult supervision and with the approval of your counselor, investigate how and why it works as it does. Find out what sort of engineering activities were needed to create it. Discuss with your counselor what you learned and how you got the information.
  - n: "2"
    text: Select an engineering achievement that has had a major impact on society. Using resources such as the internet (with your parent or guardian’s permission), books, and magazines, find out about the engineers who made this engineering feat possible, the special obstacles they had to overcome, and how this achievement has influenced the world today. Tell your counselor what you learned.
  - n: "3"
    text: Explain the work of six types of engineers. Pick two of the six types and explain how their work is related to engineering.
  - n: "4"
    text: "Visit with an engineer (who may be your counselor, parent or guardian) and do the following:"
    children:
      - n: 4a
        text: Discuss the work this engineer does and the tools the engineer uses.
      - n: 4b
        text: Discuss with the engineer a current project and the engineer’s particular role in it.
      - n: 4c
        text: Find out how the engineer’s work is done and how results are achieved.
      - n: 4d
        text: Ask to see the reports that the engineer writes concerning the project.
      - n: 4e
        text: Discuss with your counselor what you learned about engineering from this visit.
  - n: "5"
    text: Use the systems engineering approach to design an original piece of patrol equipment, a toy or a useful device for the home, office or garage.
  - n: "6"
    text: "Do TWO of the following:"
    choose: 2
    children:
      - n: 6a
        text: Transforming motion. Using common materials or a construction set, make a simple model that will demonstrate motion. Explain how the model uses basic mechanical elements like levers and inclined planes to demonstrate motion. Describe an example where this mechanism is used in a real product.
      - n: 6b
        text: Using electricity. Make a list of 10 electrical appliances in your home. Find out approximately how much electricity each uses in one month. Learn how to find out the amount and cost of electricity used in your home during periods of light and heavy use. List five ways to conserve electricity.
      - n: 6c
        text: Understanding electronics. Using an electronic device such as a smartphone or tablet computer, find out how sound, video, text or images travel from one location to another. Explain how the device was designed for ease of use, function, and durability.
      - n: 6d
        text: Using materials. Do experiments to show the differences in strength and heat conductivity in wood, metal, and plastic. Discuss with your counselor what you have learned.
      - n: 6e
        text: Converting energy. Do an experiment to show how mechanical, heat, chemical, solar, and/or electrical energy may be converted from one or more types of energy to another. Explain your results. Describe to your counselor what energy is and how energy is converted and used in your surroundings.
      - n: 6f
        text: Moving people. Find out the different ways people in your community get to work. Make a study of traffic flow (number of vehicles and relative speed) in both heavy and light traffic periods. Discuss with your counselor what might be improved to make it easier for people in your community to get where they need to go.
      - n: 6g
        text: Building an engineering project. Enter a project in a science or engineering fair or similar competition. (This requirement may be met by participation on an engineering competition project team.) Discuss with your counselor what your project demonstrates, the kinds of questions visitors to the fair asked you, and how well you were able to answer their questions.
  - n: "7"
    text: Explain what it means to be a registered Professional Engineer (P.E.). Name the types of engineering work for which registration is most important.
  - n: "8"
    text: Study the Engineer’s Code of Ethics. Explain how it is like the Scout Oath and Law.
  - n: "9"
    text: Find out about three career opportunities in engineering. Pick one and research the education, training, and experience required for this profession. Discuss this with your counselor, and explain why this profession might interest you.
