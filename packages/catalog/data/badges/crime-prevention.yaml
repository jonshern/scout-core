id: badge:crime-prevention
name: Crime Prevention
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/crime-prevention/
worksheet_url: http://usscouts.org/mb/worksheets/Crime-Prevention.pdf
requirements:
  - n: "1"
    text: "Laws and Society. Discuss the following with your counselor:"
    children:
      - n: 1a
        text: Why we have criminal laws.
      - n: 1b
        text: What are types of crimes, including property crimes, crimes against people, white collar crime, and environmental crime.
      - n: 1c
        text: Why people commit crimes.
      - n: 1d
        text: Why everyone should follow the law even when no one is watching.
      - n: 1e
        text: What is the meaning of crime prevention.
  - n: "2"
    text: "Groups Working to Prevent Crime. Research how the following groups contribute to crime prevention and share your findings with your counselor:"
    children:
      - n: 2a
        text: Citizens, including youth
      - n: 2b
        text: Schools
      - n: 2c
        text: Neighborhood, social and civic groups, including youth groups
      - n: 2d
        text: Private security
      - n: 2e
        text: Law enforcement agencies
      - n: 2f
        text: Courts
      - n: 2g
        text: Corrections and rehabilitation programs
  - n: "3"
    text: "Crime in Your Community, State, and Nation. Do the following:"
    children:
      - n: 3a
        text: With your parent or guardian’s permission and the approval of your counselor, research local, state, or national news coverage of three crimes of different types. Research how common these types of crimes are in your state or in the United States.
      - n: 3b
        text: Record notes on which law enforcement agencies and courts were involved in the pursuit of justice for the victims and the accused person, why you think these crimes were committed, and what could be done to prevent similar crimes. Review your research with your counselor.
  - n: "4"
    text: "Home and Neighborhood Crime Prevention. Do the following:"
    children:
      - n: 4a
        text: "Discuss the following with your counselor:"
        children:
          - n: 4a1
            text: How participation in activities of families, churches, sports teams, and clubs prevents crime.
          - n: 4a2
            text: How designs of houses, neighborhoods, public buildings, stores, streets, and parks prevent crime.
      - n: 4b
        text: Conduct a security survey of a home, a neighborhood, a park, or a camp building with adult supervision and following youth protection guidelines using a security checklist in the pamphlet or one approved by your counselor.
      - n: 4c
        text: Use information from your survey for requirement 4(b) and the EDGE method to develop a lesson about how a family or Scouts can protect themselves from crime. Review your teaching plan with your counselor, then present your lesson to your family or to Scouts.
  - n: "5"
    text: "Retail Crime Prevention. Research the following topics and review them with your counselor:"
    children:
      - n: 5a
        text: The impact of shoplifting and employee theft (also known as shrinkage) and loss prevention on retail finances, customer service, and reputation
      - n: 5b
        text: Techniques used by retail stores to prevent shoplifting
  - n: "6"
    text: "Reporting Crime. Discuss the following with your counselor:"
    children:
      - n: 6a
        text: When and how to report a crime or an impending crime
      - n: 6b
        text: The warning signs for child abuse and domestic violence and how to report these situations
      - n: 6c
        text: How to resist peer influence
      - n: 6d
        text: The three R’s of personal safety and protection and how to apply them
      - n: 6e
        text: How reporting a crime can help law enforcement provide resources for crime victims
  - n: "7"
    text: "Peers and Crime. Discuss the following with your counselor:"
    children:
      - n: 7a
        text: The role that peers play in crime, crime prevention, and experiencing crime
      - n: 7b
        text: How to resist peer influence
      - n: 7c
        text: Bullying and hazing behaviors and signs that a friend may be bullying you or someone else
      - n: 7d
        text: Explain the impact of gangs on communities
  - n: "8"
    text: "Substance Use and Crime. Discuss the following with your counselor:"
    children:
      - n: 8a
        text: The legal and health consequences of using alcohol, tobacco and vaping products, illegal drugs, and diverted prescription drugs
      - n: 8b
        text: How substance use contributes to violence and property crime and increases a person’s risk of becoming a victim of crime
      - n: 8c
        text: How drug abuse awareness, prevention, and recovery programs help prevent crime
      - n: 8d
        text: How to get help if you or someone you know needs help with drugs or alcohol
  - n: "9"
    text: "Online Crime and You. Discuss the following with your counselor:"
    children:
      - n: 9a
        text: How to avoid being the victim of online crimes.
      - n: 9b
        text: Common online financial scams
      - n: 9c
        text: Effective online security
      - n: 9d
        text: Identity theft and how to prevent it
      - n: 9e
        text: How criminals use social media to target victims
      - n: 9f
        text: How bullying, texting, and sharing photos can become crimes
  - n: "10"
    text: Interview a law enforcement officer or a civil servant about their work in crime prevention. Learn about how they chose this career and about their duties. Discuss what you learned with your counselor.
  - n: "11"
    text: Identify three career opportunities that would use skills and knowledge in the field of crime prevention. Pick one and research the training, education, certification requirements, experience, and expenses associated with entering the field. Research the prospects for employment, starting salary, advancement opportunities and career goals associated with this career. Discuss what you learned with your counselor and whether you might be interested in this career.
