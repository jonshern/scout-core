id: badge:communication
name: Communication
edition: 2026
eagle_required: true
official_url: https://www.scouting.org/merit-badges/communication/
worksheet_url: http://usscouts.org/mb/worksheets/Communication.pdf
requirements:
  - n: "1"
    text: "Do ONE of the following:"
    choose: 1
    children:
      - n: 1a
        text: For one day, keep a log in which you describe your communication activities. Keep track of the time and different ways you spend communicating, such as talking person-to-person, listening to teachers, listening to the radio or podcasts, watching television, using social media, reading books and other print media, and using any electronic communication device. Discuss with your counselor what your log reveals about the importance of communication in your life. Think of ways to improve your communication skills.
      - n: 1b
        text: "For three days, keep a journal of your listening experiences. Identify one example of each of the following, and discuss with your counselor when you have listened to:"
        children:
          - n: 1b1
            text: Obtain information
          - n: 1b2
            text: Be persuaded
          - n: 1b3
            text: Appreciate or enjoy something
          - n: 1b4
            text: Understand someone’s feelings
      - n: 1c
        text: In a small-group setting, meet with other Scouts or with friends. Have them share personal stories about significant events in their lives that affected them in some way. Take note of how each Scout participates in the group discussion and how effectively each Scout communicates their story. Report what you have learned to your counselor about the differences you observed in effective communication.
      - n: 1d
        text: List as many ways as you can think of to communicate with others (face-to-face, by telephone, letter, email, text messages, social media, and so on). For each type of communication, discuss with your counselor an instance when that method might not be appropriate or effective.
  - n: "2"
    text: "Do ONE of the following:"
    choose: 1
    children:
      - n: 2a
        text: Think of a creative way to describe yourself using, for example, a collage, short story or autobiography, drawing or series of photographs, or a song or skit. Using the aid you created, make a presentation to your counselor about yourself.
      - n: 2b
        text: Choose a concept, product, or service in which you have great confidence. Build a sales plan based on its good points. Try to persuade the counselor to agree with, use, or buy your concept, product, or service. After your sales talk, discuss with your counselor how persuasive you were.
  - n: "3"
    text: Write a five-minute speech. Give it at a meeting of a group.
  - n: "4"
    text: Interview someone you know fairly well, like, or respect because of his or her position, talent, career, or life experiences. Listen actively to learn as much as you can about the person. Then prepare and deliver to your counselor an introduction of the person as though this person were to be a guest speaker, and include reasons why the audience would want to hear this person speak. Show how you would call to invite this person to speak.
  - n: "5"
    text: Attend a public meeting (city council, school board, debate) approved by your counselor where several points of view are given on a single issue. Practice active listening skills and take careful notes of each point of view. Prepare an objective report that includes all points of view that were expressed, and share this with your counselor.
  - n: "6"
    text: With your counselor’s approval, develop a plan to teach a skill or inform someone about something. Prepare teaching aids for your plan. Carry out your plan. With your counselor, determine whether the person has learned what you intended.
  - n: "7"
    text: "Do ONE of the following:"
    choose: 1
    children:
      - n: 7a
        text: Write to the editor of a magazine or your local newspaper to express your opinion or share information on any subject you choose. Send your message by fax, email, or regular mail.
      - n: 7b
        text: Create a webpage or blog of special interest to you (for instance, your troop or crew, a hobby, or a sport). Include at least three articles or entries and one photograph or illustration, and one link to some other webpage or blog that would be helpful to someone who visits the webpage or blog you have created. It is not necessary to post your webpage or blog to the internet, but if you decide to do so, you must first share it with your parent or guardian and counselor and get their permission.
      - n: 7c
        text: Use desktop publishing to produce a newsletter, brochure, flyer, or other printed material for your troop or crew, class at school, or other group. Include at least one article and one photograph or illustration.
  - n: "8"
    text: Plan a troop or crew court of honor, campfire program, or interfaith worship service. Have the patrol leaders’ council approve it, then write the script and prepare the program. Serve as master of ceremonies.
  - n: "9"
    text: Find out about three career opportunities in communication. Pick one and find out the education, training, and experience required for this profession. Discuss this with your counselor, and explain why this profession might interest you.
