id: badge:bugling
name: Bugling
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/bugling/
worksheet_url: http://usscouts.org/mb/worksheets/Bugling.pdf
requirements:
  - n: "1"
    text: Give a brief history of the bugle.
  - n: "2"
    text: "Do the following:"
    children:
      - n: 2a
        text: Explain and demonstrate how the bugle makes sound, and explain how the bugle is related to other brass wind instruments.
      - n: 2b
        text: Compose a bugle call for your troop or patrol to signal a common group activity, such as assembling for mealtime or striking a campsite. Play the call that you have composed before your unit or patrol.
  - n: "3"
    text: "Sound 10 of the following bugle calls: “First Call,” “Reveille,” “Assembly,” “Mess,” “Drill,” “Fatigue,” “Officers,” “Recall,” “Church,” “Swimming,” “Fire,” “Retreat,” “To the Colors,” “Call to Quarters,” “Taps.”"
  - n: "4"
    text: Explain when each of the calls in requirement 3 is used.
  - n: "5"
    text: Explain how to care for, clean, and maintain a bugle.
  - n: "6"
    text: "Serve as bugler in your troop for three months.* * NOTE: A bugle, trumpet, or cornet may be used to meet these requirements."
