id: badge:truck-transportation
name: Truck Transportation
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/truck-transportation/
worksheet_url: http://usscouts.org/mb/worksheets/Truck-Transportation.pdf
requirements:
  - n: "1"
    text: List the major truck lines serving your town.
  - n: "2"
    text: "Do the following:"
    children:
      - n: 2a
        text: Describe the role of truck transportation within commerce (the movement of goods, funds, and information).
      - n: 2b
        text: Describe how trucks fit into a company’s supply chain. This could be a manufacturer, importer, wholesaler, or retailer.
      - n: 2c
        text: On paper, map out how goods that are manufactured overseas are transported to a retailer in this country.
  - n: "3"
    text: Describe the difference between the gasoline engine and the diesel engine that power trucks. List the advantages of each.
  - n: "4"
    text: Visit a truck terminal and complete items 4(a) through 4(e). After your visit, share what you have learned with your counselor.
    children:
      - n: 4a
        text: Find out what kind of maintenance program the company follows to help keep its fleet, drivers, and the roadway safe.
      - n: 4b
        text: Find out how dispatchers maintain communication with drivers on the road.
      - n: 4c
        text: Talk with a professional truck driver about safety. Learn about the truck driver’s rules of the road for safe driving. List five safe-driving rules every professional truck driver must follow.
      - n: 4d
        text: Review the driver’s log and find out what kind of information the log contains.
      - n: 4e
        text: Learn about important federal regulations that help ensure public safety.
  - n: "5"
    text: "Do the following:"
    children:
      - n: 5a
        text: Outline the general organization of a trucking company. Describe what each department does.
      - n: 5b
        text: List five positions with trucking companies and describe each one.
  - n: "6"
    text: Name five government agencies that work closely with the trucking industry. Describe their role.
  - n: "7"
    text: List five different kinds of trucks. Tell the service each provides.
  - n: "8"
    text: "Assume that you are going to ship by truck 500 pounds of goods (freight class 65) from your town to another town 500 miles away. Your shipment must arrive within three days. Explain in writing:"
    children:
      - n: 8a
        text: How to prepare the shipment
      - n: 8b
        text: How to compare at least three carriers for time in transit and rates
      - n: 8c
        text: How to choose which carrier to use
      - n: 8d
        text: How to insure the shipment for damages
  - n: "9"
    text: "Explain the following terms: bill of lading, ETA, logbook, intermodal, containers, tariff, shippers, carrier, consignee, drayage, cartage."
  - n: "10"
    updated_2026: true
    text: Explore careers related to this merit badge. Research one career to learn about the training and education needed, costs, job prospects, salary, job duties, and career advancement. Your research methods may include-with your parent or guardian’s permission-an internet or library search, an interview with a professional in the field, or a visit to a location where people in this career work. Discuss with your counselor both your findings and what about this profession might make it an interesting career.
