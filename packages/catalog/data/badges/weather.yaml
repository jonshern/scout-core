id: badge:weather
name: Weather
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/weather/
worksheet_url: http://usscouts.org/mb/worksheets/Weather.pdf
requirements:
  - n: "1"
    text: Define meteorology. Explain what weather is and what climate is. Discuss how the weather affects farmers, sailors, aviators, and the outdoor construction industry. Tell why weather forecasts are important to each of these groups.
  - n: "2"
    text: Name five dangerous weather-related conditions. Give the safety rules for each when outdoors and explain the difference between a severe weather watch and a warning. Discuss the safety rules with your family.
  - n: "3"
    updated_2026: true
    text: Identify at least two sources of weather forecasts that can be used to prepare for hikes, overnight camping, and other outdoor activities. Name two sources of emergency weather warnings both at home and during outdoor Scout functions.
  - n: "4"
    text: Tell what causes wind, why it rains, and how lightning and hail are formed.
  - n: "5"
    text: Identify and describe clouds in the low, middle, and upper levels of the atmosphere. Relate these to specific types of weather.
  - n: "6"
    text: Draw a diagram of the water cycle and label its major processes. Explain the water cycle to your counselor.
  - n: "7"
    text: Identify some human activities that can alter the environment, and describe how they affect the climate and people.
  - n: "8"
    text: Describe how the tilt of Earth’s axis helps determine the climate of a region near the equator, near the poles, and across the area in between.
  - n: "9"
    text: "Do ONE of the following:"
    choose: 1
    children:
      - n: 9a
        text: "Make one of the following instruments: wind vane, anemometer, rain gauge, hygrometer. Keep a daily weather log for one week using information from this instrument as well as from other sources such as local radio and television stations, NOAA Weather Radio All Hazards, and internet sources (with your parent or guardian’s permission). Record the following information at the same time every day: wind direction and speed, temperature, precipitation, and types of clouds. Be sure to make a note of any morning dew or frost. In the log, also list the weather forecasts from radio or television at the same time each day and show how the weather really turned out."
      - n: 9b
        text: Visit a National Weather Service office or talk with a local radio or television weathercaster, private meteorologist, local agricultural extension service officer, or university meteorology instructor. Find out what type of weather is most dangerous or damaging to your community. Determine how severe weather and flood warnings reach the homes in your community.
  - n: "10"
    text: Give a talk of at least five minutes to a group (such as your unit or a Cub Scout pack) explaining the outdoor safety rules in the event of lightning, flash floods, and tornadoes. Before your talk, share your outline with your counselor for approval.
  - n: "11"
    text: Find out about a weather-related career opportunity that interests you. Discuss with and explain to your counselor what training and education are required for such a position, and the responsibilities required of such a position.
  - n: "12"
    updated_2026: true
    text: Explore careers related to this merit badge. Research one career to learn about the training and education needed, costs, job prospects, salary, job duties, and career advancement. Your research methods may include-with your parent or guardian’s permission-an internet or library search, an interview with a professional in the field, or a visit to a location where people in this career work. Discuss with your counselor both your findings and what about this profession might make it an interesting career.
