id: badge:safety
name: Safety
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/safety/
worksheet_url: http://usscouts.org/mb/worksheets/Safety.pdf
requirements:
  - n: "1"
    updated_2026: true
    text: "Safety and Hazards. Do the following:"
    children:
      - n: 1a
        text: Explain what safety is and what it means to be safe.
      - n: 1b
        text: Explain what hazards are and how people manage hazards to reduce risks of harm and to improve safety.
  - n: "2"
    updated_2026: true
    text: "Family and Home Safety. Do the following:"
    children:
      - n: 2a
        text: Explain common causes of and prevention of home injuries.
      - n: 2b
        text: Discuss the dangers involved with the use of fireworks.
      - n: 2c
        text: Explain common causes of and prevention of home fires.
      - n: 2d
        text: Using the Home Safety Checklist in the Safety merit badge pamphlet or one approved by your counselor, inspect your home or a similar building for hazards with an adult. Review your checklist and findings with your counselor.
      - n: 2e
        text: Develop a fire-escape plan for your home or for a similar building. Include in your drawings exit routes from each room and a meeting place outside. Conduct a fire-escape drill. Review your plan and your drill with your counselor.
      - n: 2f
        text: Develop a family emergency action plan for evacuation because of weather or other natural disasters that occur in your area. Using a checklist in the Safety merit badge pamphlet or one approved by your counselor, assemble or inspect an emergency supplies kit. Explain to your counselor how a family would use the plan and the kit supplies in an emergency.
  - n: "3"
    updated_2026: true
    text: "Safety from Crime. Do the following:"
    children:
      - n: 3a
        text: Explain common types of crimes that can affect teens.
      - n: 3b
        text: Using a Home Security Checklist in the Safety merit badge pamphlet or one approved by your counselor, inspect your home or a similar building for crime security measures with an adult. Review your checklist and findings with your counselor.
  - n: "4"
    updated_2026: true
    text: "Safety in Public Places. Explain each of the following to your counselor:"
    children:
      - n: 4a
        text: How a person would safely exit from public buildings, a hotel, and a stadium in an emergency.
      - n: 4b
        text: How and why Scouts would take shelter at camp.
      - n: 4c
        text: How should Scouts respond to an active shooter.
      - n: 4d
        text: "The meaning of this saying: “If You See Something, Say Something.®”"
  - n: "5"
    updated_2026: true
    text: "Safeguarding Youth. Do the following:"
    children:
      - n: 5a
        text: Discuss Scouting America’s Safeguarding Youth guidelines that adults and Scouts must follow so that everyone is safe at Scouting activities.
      - n: 5b
        text: Discuss with your counselor what situations and behaviors would prompt you to Recognize, Resist, and Report a possible abuse situation.
      - n: 5c
        text: Discuss how you, other Scouts, leaders, and anyone can report situations suspicious for abuse through the Scouts First Helpline and other means.
  - n: "6"
    updated_2026: true
    text: "Safety from Assault. Explain how to avoid or prevent:"
    children:
      - n: 6a
        text: Assault on a street
      - n: 6b
        text: Assault at a restaurant event
      - n: 6c
        text: Sexual assault at a party or on a date.
  - n: "7"
    updated_2026: true
    text: "Online Safety. Discuss the following with your counselor:"
    children:
      - n: 7a
        text: How to avoid being the victim of online crimes.
      - n: 7b
        text: Common online financial scams.
      - n: 7c
        text: Effective online security.
      - n: 7d
        text: Identity theft and how to prevent it.
      - n: 7e
        text: How criminals use social media to target victims.
      - n: 7f
        text: How bullying, texting, and sharing photos can become crimes.
  - n: "8"
    updated_2026: true
    text: "Travel Safety. Explain guidelines for traveling safely:"
    children:
      - n: 8a
        text: as a pedestrian in a city
      - n: 8b
        text: in a friend's car or truck
      - n: 8c
        text: in a rideshare vehicle
      - n: 8d
        text: on a bus
      - n: 8e
        text: on a subway or train
      - n: 8f
        text: on a commercial airplane.
  - n: "9"
    updated_2026: true
    text: "Careers. Do ONE of the following:"
    choose: 1
    children:
      - n: 9a
        text: Explore careers related to Safety merit badge. Research one career to learn about the training and education needed, costs, job prospects, salary, job duties, and career advancement. With permission of your parent or guardian, your research methods may include an internet or library search, an interview with a professional in the field, or a visit to a location where people in this career work. Discuss with your counselor both your findings and what about this profession might make it an interesting career.
      - n: 9b
        text: Explore how you could use knowledge and skills related to safety to pursue a hobby, lifestyle, or service as a volunteer. Research any training needed, expenses, and organizations that promote or support it. Discuss with your counselor what short-term and long-term goals you might have if you pursue this.
