id: badge:whitewater
name: Whitewater
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/whitewater/
worksheet_url: http://usscouts.org/mb/worksheets/Whitewater.pdf
requirements:
  - n: "1"
    text: "Do the following:"
    children:
      - n: 1a
        text: Explain to your counselor the most likely hazards you may encounter while participating in whitewater activities, including branches and trees in water along a shore and stretching across the stream, rocks, hydraulics over ledges or lowhead dams, strong wind, low water or air temperature, and thunder and lightning storms. Explain what you should do to anticipate, help prevent, mitigate, and respond to these hazards.
      - n: 1b
        text: Review with your counselor the prevention, symptoms, and first-aid treatment for the following injuries or illnesses that could occur while participating in whitewater activities including cold-water shock; hypothermia; head, neck, and back injuries; heat-related illnesses; sunburn; dehydration; blisters; bruises; cuts; sprains and strains; shoulder dislocation; and submersion injuries.
      - n: 1c
        text: Discuss with your counselor the Scouting America Safety Afloat policy and the American Whitewater safety guidelines, including the use of helmet and life jackets.
  - n: "2"
    updated_2026: true
    text: "Do the following:"
    children:
      - n: 2a
        text: "Demonstrate understanding of the following river features by drawing lines to show the flow of water: upstream V, downstream V, riffle, eddy with an eddy line, ledge, river bend, shallows, current at different depths, drop, horizon line, and hydraulic."
      - n: 2b
        text: Describe how waves form including standing waves and wave trains.
      - n: 2c
        text: Explain how to tilt or edge the boat without leaning your body
        children:
          - n: 2c1
            text: When entering and exiting an eddy.
          - n: 2c2
            text: When ferrying in downstream and upstream directions.
      - n: 2d
        text: Explain when, why, and how you should scout a river while ashore, while on the river, and when you should portage your boat.
  - n: "3"
    text: "Before doing requirements 4 through 12, earn the Canoeing merit badge if you will be using a canoe to earn this merit badge. If you will be using a kayak, earn the Kayaking merit badge. Then do ONE of the following:"
    choose: 1
    children:
      - n: 3a
        text: If you will be using a canoe to earn this merit badge, demonstrate strokes and maneuvers from the Canoeing merit badge to the satisfaction of your counselor.
      - n: 3b
        text: If you will be using a kayak to earn this merit badge, demonstrate strokes and maneuvers from the Kayaking merit badge to the satisfaction of your counselor.
  - n: "4"
    text: "Do ONE of the following options:"
    choose: 1
    options:
      - key: A
        name: "Tandem Canoeist Perform the following on calm water:"
      - key: B
        name: "Solo Canoeist Perform the following on calm water:"
      - key: C
        name: "Solo Kayaker Perform the following on calm water:"
    children:
      - n: 4a-optA
        option: A
        text: "Demonstrate the following strokes in the bow: cross forward, bow draw, cross bow draw, bow pry, and sculling draw."
      - n: 4b-optA
        option: A
        text: "Demonstrate the following strokes in the stern: stern draw, stern pry, sculling draw, and forward with stern pry."
      - n: 4c-optA
        option: A
        text: Demonstrate a high brace, low brace, and righting pry.
      - n: 4a-optB
        option: B
        text: "Demonstrate the following strokes: cross forward, bow draw, cross bow draw, stern draw, pry, stern pry, sculling draw, and forward with stern pry."
      - n: 4b-optB
        option: B
        text: Demonstrate a high brace, low brace, and righting pry.
      - n: 4a-optC
        option: C
        text: "Demonstrate the following strokes: bow draw, rudder, and sculling draw."
      - n: 4b-optC
        option: C
        text: Demonstrate a high brace and low brace.
  - n: "5"
    text: "Do the following:"
    children:
      - n: 5a
        text: Explain the International Scale of River Difficulty and apply the scale to the stretch of river approved by your counselor.
      - n: 5b
        text: Identify the specific characteristics of the river that are factors in your classification according to the International Scale.
      - n: 5c
        text: Discuss how the level of flow changes a river from one class to another and what effects different flow rates have on the features of a river and its hazards.
  - n: "6"
    text: "Explain the importance of communication during every whitewater outing. Demonstrate knowledge and ability to use the following American Whitewater Universal River Signals, both visual and auditory: “Stop,” “Are you OK?,” “Help/emergency,” “Run river right,” “Run river left,” “All clear—come ahead.”"
  - n: "7"
    text: "Do ONE of the following:"
    choose: 1
    children:
      - n: 7a
        text: If completing this merit badge in a canoe, describe the various types of canoes used on moving water and how they differ in design, materials, and purpose.
      - n: 7b
        text: If completing this merit badge in a kayak, describe the various types of kayaks used on moving water and explain how they differ in design, materials, and purpose.
  - n: "8"
    text: Review the personal and group equipment necessary for a safe whitewater outing and how and why it is used. Explain how to pack and protect these items.
  - n: "9"
    text: Demonstrate your ability to read a Class II section of river approved by your counselor. Describe the most desirable paths or lines of travel as well as alternative routes and options. Point out how to use the existing water features to your advantage, and explain how to best avoid the hazards present.
  - n: "10"
    text: Wearing a proper life jacket and being appropriately dressed for the weather and water conditions, perform the following skills in moving water in a properly equipped whitewater craft of your choice (tandem canoe, solo canoe, or solo kayak). If a tandem canoe is used, the skills must be demonstrated from both the bow and stern positions.
    children:
      - n: 10a
        text: Launch and land.
      - n: 10b
        text: Paddle forward in a straight line at least 10 boat lengths.
      - n: 10c
        text: Backpaddle in a straight line at least five boat lengths.
      - n: 10d
        text: Ferry upstream from both sides of the river.
      - n: 10e
        text: Ferry downstream from both sides of the river.
      - n: 10f
        text: Eddy turn from both sides of an eddy.
      - n: 10g
        text: Peel out from both sides of an eddy.
  - n: "11"
    text: "Explain and demonstrate the following to your counselor:"
    children:
      - n: 11a
        text: Self-rescue and procedures when capsized in moving water, including a wet exit if necessary
      - n: 11b
        text: Proper use of a throw rope to rescue a swimmer in whitewater
      - n: 11c
        text: Proper technique for receiving a throw rope as a swimmer
      - n: 11d
        text: Portaging—where portaging would be appropriate, and when and how to do it
      - n: 11e
        text: The whitewater buddy system using at least three persons and three craft
  - n: "12"
    text: "Participate in one or more whitewater trips using either a canoe or kayak on a Class I and/or Class II river. The trip(s) must involve at least six hours of paddling time. For each trip:"
    children:
      - n: 12a
        text: Help to prepare a written plan, specifying the route (put-ins and takeouts), schedule, equipment, safety precautions, and emergency procedures.
      - n: 12b
        text: Determine local rules and obtain permission from landowners and land managers in advance.
      - n: 12c
        text: Explain what steps have been taken to comply with Scouting America Safety Afloat and the American Whitewater safety guidelines.
      - n: 12d
        text: Show how to protect personal and group equipment from water and how to load and secure the containers in boats to be used in the trip. Execute the plans with other paddlers.
      - n: 12e
        text: Explain to your counselor how well your plans worked for each trip taken.
