id: badge:nature
name: Nature
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/nature/
worksheet_url: http://usscouts.org/mb/worksheets/Nature.pdf
requirements:
  - n: "1"
    text: Name three ways in which plants are important to animals. Name a plant that is protected in your state or region, and explain why it is at risk.
  - n: "2"
    text: Name three ways in which animals are important to plants. Name an animal that is protected in your state or region, and explain why it is at risk.
  - n: "3"
    text: Explain the term “food chain.” Give an example of a four-step land food chain and a four-step water food chain.
  - n: "4"
    text: "Do all of the requirements in FIVE of the following fields:"
    choose: 5
    children:
      - n: 4a
        text: Birds
        children:
          - n: 4a1
            text: In the field, identify eight species of birds.
          - n: 4a2
            text: Make and set out a birdhouse OR a feeding station OR a birdbath. List what birds used it during a period of one month.
      - n: 4b
        text: Mammals
        children:
          - n: 4b1
            text: In the field, identify three species of wild mammals.
          - n: 4b2
            text: Make plaster casts of the tracks of a wild mammal.
      - n: 4c
        text: Reptiles and Amphibians
        children:
          - n: 4c1
            text: Show that you can recognize the venomous snakes in your area.
          - n: 4c2
            text: In the field, identify three species of reptiles or amphibians.
          - n: 4c3
            text: Recognize one species of toad or frog by voice; OR identify one reptile or amphibian by eggs, den, burrow, or other signs.
      - n: 4d
        text: Insects and Spiders
        children:
          - n: 4d1
            text: Collect and identify either in the field or through photographs 10 species of insects or spiders. Photos may be taken with your own equipment or gathered from other sources.
          - n: 4d2
            text: Hatch an insect from the pupa or cocoon; OR hatch adults from nymphs; OR keep larvae until they form pupae or cocoons; OR keep a colony of ants or bees through one season.
      - n: 4e
        text: Fish
        children:
          - n: "4e1"
            text: Identify two species of fish native to your area.
          - n: "4e2"
            text: Collect four kinds of animal food eaten by fish in the wild.
      - n: 4f
        text: Mollusks and Crustaceans
        children:
          - n: 4f1
            text: Identify five species of mollusks and crustaceans.
          - n: 4f2
            text: Collect, mount, and label six shells.
      - n: 4g
        text: Plants
        children:
          - n: 4g1
            text: In the field, identify 15 species of wild plants.
          - n: 4g2
            text: "Do ONE of the following options: (a) Collect and label the seeds of six plants OR the leaves of 12 plants. (b) Photograph the seeds of six plants OR the leaves of 12 plants and create a catalog of your photos."
      - n: 4h
        text: Soils and Rocks
        children:
          - n: 4h1
            text: Collect and identify three different types of soil that represent soils high in sand, clay and humus.
          - n: 4h2
            text: Collect and identify five different types of rocks from your area.
  - n: "5"
    text: Discuss the importance of the Leave No Trace Seven Principles and the Outdoor Code and how they relate to nature. Explain how you have followed the Leave No Trace Seven Principles and the Outdoor Code while in natural areas during field observation, specimen collection, and identification.
  - n: "6"
    text: "Do the following:"
    children:
      - n: 6a
        text: Explain what succession is to your counselor.
      - n: 6b
        text: Visit a natural area (forest, grassland, meadow, water feature) and explain what stage of succession (both plant and animal) the area is in. Talk about what community/succession stages may have been there before and what community/succession stages may replace what you see now. Discuss what disturbances or changes have taken place in the past to create this landscape and what changes may occur in the future to change the landscape further.
  - n: "7"
    text: "Do ONE of the following:"
    choose: 1
    children:
      - n: 7a
        text: Identify three career opportunities that would use skills and knowledge in Nature. Pick one and research the training, education, certification requirements, experience, and expenses associated with entering the field. Research the prospects for employment, starting salary, advancement opportunities and career goals associated with this career. Discuss what you learned with your counselor and whether you might be interested in this career.
      - n: 7b
        text: "Identify how you might use the skills and knowledge in Nature to pursue a personal hobby. Research the additional training required, expenses, and affiliation with organizations that would help you maximize the enjoyment and benefit you might gain from it. Discuss what you learned with your counselor and share what short-term and long-term goals you might have if you pursued this. NOTE: In most cases all specimens should be returned to the wild at the location of original capture after the requirements have been met. Check with your counselor for those instances where the return of these specimens would not be appropriate. Under the Endangered Species Act of 1973, some plants and animals are or may be protected by federal law. The same ones and/or others may be protected by state law. Be sure that you do not collect protected species. Your state may require that you purchase and carry a license to collect certain species. Check with the wildlife and fish and game officials in your state regarding species regulations before you begin to collect."
