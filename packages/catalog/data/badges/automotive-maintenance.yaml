id: badge:automotive-maintenance
name: Automotive Maintenance
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/automotive-maintenance/
worksheet_url: http://usscouts.org/mb/worksheets/Automotive-Maintenance.pdf
notes:
  - You will need access to a car or truck and its owner’s manual to meet some requirements for this merit badge. If you do not have your own vehicle, you should work with your counselor or other trusted adult to obtain access to a vehicle and the owner's manual for that vehicle.
requirements:
  - n: "1"
    text: "Safety and Registration. Do the following:"
    children:
      - n: 1a
        text: Explain to your counselor the hazards you are most likely to encounter during automotive maintenance activities, and what you should do to anticipate, help prevent, mitigate, or lessen these hazards.
      - n: 1b
        text: Discuss with your counselor the safety equipment, tools, and clothing used while checking or repairing a motor vehicle. Use this equipment, tools, and/or clothing (when needed or called for) in meeting the requirements for this merit badge.
      - n: 1c
        updated_2026: true
        text: Explain the different ways motor vehicles are powered.
      - n: 1d
        text: Explain the safety considerations when performing maintenance on a vehicle equipped with a high-voltage electrical system.
      - n: 1e
        text: Review the maintenance chart in the vehicle owner’s manual. Explain the requirements and time limits.
      - n: 1f
        text: Explain the purpose, importance, and limitations of safety belts and passive restraints.
      - n: 1g
        text: Find out the requirements for your state’s emissions and safety inspections (as applicable), including how often a vehicle needs to be inspected.
      - n: 1h
        text: Explain the importance of registering a vehicle and find out the annual registration fee for renewing your family car’s registration.
  - n: "2"
    updated_2026: true
    text: "General Maintenance. Do the following:"
    children:
      - n: 2a
        text: "Demonstrate how to check the following:"
        children:
          - n: 2a1
            text: Brake fluid
          - n: 2a2
            text: Engine oil
          - n: 2a3
            text: Coolant
          - n: 2a4
            text: Power steering fluid
          - n: 2a5
            text: Windshield washer fluid
          - n: 2a6
            text: Transmission fluid
          - n: 2a7
            text: Battery fluid (if possible) and condition of the battery terminals.
      - n: 2b
        text: Locate the fuse boxes; determine the type and size of fuses. Demonstrate the proper replacement of burned-out fuses.
      - n: 2c
        text: Demonstrate how to check the condition and tension of belts and hoses.
      - n: 2d
        text: Check the vehicle for proper operation of its lights, including the interior overhead lights, instrument lights, warning lights, and exterior bulbs.
      - n: 2e
        text: Locate and check the air filter(s).
  - n: "3"
    text: "Dashboard/Driver Information Center. Do the following:"
    children:
      - n: 3a
        text: Explain the function of the fuel gauge, speedometer, tachometer, oil pressure, and engine temperature gauge. Point each one out on the instrument cluster.
      - n: 3b
        text: Explain the symbols that light up on the dashboard and the difference between the yellow and red symbols. Explain each of the indicators on the dashboard, using the owner’s manual if necessary.
      - n: 3c
        text: Explain the messages and alerts that may be displayed on the dashboard/ driver information center including maintenance-related reminders.
  - n: "4"
    text: "Tires. Do the following:"
    children:
      - n: 4a
        text: Explain the difference between tire manufacturer’s and vehicle manufacturer’s specifications and show where to find them.
      - n: 4b
        text: Demonstrate how to check tire pressure and properly inflate a tire. Check the spare tire and make sure it is ready for use.
      - n: 4c
        text: Explain why wheel alignment is important to the life of a tire. Explain caster, camber, and toe-in adjustments on wheel alignment.
      - n: 4d
        text: Explain the purpose of the lateral-wear bar indicator.
      - n: 4e
        text: Explain how to dispose of old tires in accordance with local laws and regulations.
  - n: "5"
    text: "Engine. Do the following:"
    children:
      - n: 5a
        text: Explain how an internal combustion engine operates. Tell the differences between gasoline and diesel engines. Explain how a gasoline-electric hybrid vehicle is powered.
      - n: 5b
        text: Discuss the purpose of engine oil. Explain the API service code, the SAE number, and the viscosity rating.
      - n: 5c
        text: Explain where to find the recommended oil type and the amount of oil to be used in the vehicle engine.
  - n: "6"
    text: "Cooling System. Do the following:"
    children:
      - n: 6a
        text: Explain the need for coolant in the cooling system, and the importance of selecting the correct coolant type for a given vehicle.
      - n: 6b
        text: Explain how to flush and change the engine coolant in the vehicle, and how to properly dispose of the used coolant.
  - n: "7"
    text: "Fuel System. Do the following:"
    children:
      - n: 7a
        text: Explain how the air and fuel systems work together and why it is necessary to have an air filter and fuel filter.
      - n: 7b
        text: Explain how a fuel injection system works and how an onboard computer works with the fuel injection system.
  - n: "8"
    text: "Ignition and Electrical Systems. Do the following:"
    children:
      - n: 8a
        text: "Diagram and explain the parts of one of the following electrical systems:"
        children:
          - n: 8a1
            text: Starting/charging system
          - n: 8a2
            text: Hybrid or electric vehicle inverter
          - n: 8a3
            text: Lighting system
      - n: 8b
        text: Explain the engine’s firing order.
      - n: 8c
        text: Explain the purpose of the spark gap.
      - n: 8d
        text: Demonstrate how to safely connect jumper cables to your car battery.
      - n: 8e
        text: Discuss with your counselor what factors can affect range on an electrified vehicle. Explain the procedure for recharging an electric or plug-in hybrid vehicle.
      - n: 8f
        text: Explain what other vehicle systems are dependent on a reliable electrical system.
  - n: "9"
    text: "Drive Train. Do the following:"
    children:
      - n: 9a
        text: Diagram the drive train and explain the different parts.
      - n: 9b
        text: Explain the difference between automatic and standard transmissions.
      - n: 9c
        text: Explain the types of automatic transmission fluid.
      - n: 9d
        text: Explain the types of lubricants used in a standard transmission, and in the differential and transfer case.
      - n: 9e
        text: Explain the difference between front-wheel, rear-wheel, and four-wheel drive.
  - n: "10"
    text: "Brake System. Do the following:"
    children:
      - n: 10a
        text: Explain the brake system (including antilock systems) and how it operates.
      - n: 10b
        updated_2026: true
        text: Explain the differences between disc and drum brake systems.
      - n: 10c
        text: Demonstrate how to check the condition of a vehicle’s brake system. After checking, make recommendations for repairs (if necessary).
  - n: "11"
    text: "Do TWO of the following:"
    choose: 2
    children:
      - n: 11a
        text: Determine the value of three different vehicles you are interested in purchasing. One must be new and one must be used; the third vehicle can be new or used. For each vehicle, find out the requirements and cost of automobile insurance to include basic liability and options for collision, comprehensive, towing, and rental car. Using the three vehicles you chose and with your counselor’s assistance, complete the operation/maintenance chart provided in the Automotive Maintenance pamphlet. Use this information to determine the operating cost per mile for each vehicle, and discuss what you learn with your counselor.
      - n: 11b
        text: Choose a car cleaner and wax product for a vehicle you want to clean. Explain clear-coat paint and the precautions necessary for care. Clean the vehicle, both inside and out, and wax the exterior. Use a vinyl and rubber protectant (on vinyl tops, rubber door seals, sidewalls, etc.) and explain the importance of this protectant.
      - n: 11c
        text: Locate the manufacturer’s jack. Use the jack to demonstrate how to engage the jack correctly on the vehicle, then change a tire correctly.
      - n: 11d
        text: Perform an oil filter and oil change on a vehicle. Explain how to properly dispose of the used oil and filter.
  - n: "12"
    text: Find out about three career opportunities in the automotive industry. Pick one and find out the education, training, and experience required for this profession. Discuss this with your counselor, and explain why this profession might interest you.
