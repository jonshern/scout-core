id: badge:space-exploration
name: Space Exploration
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/space-exploration/
worksheet_url: http://usscouts.org/mb/worksheets/Space-Exploration.pdf
requirements:
  - n: "1"
    text: "Tell the purpose of space exploration and include the following:"
    children:
      - n: 1a
        text: Historical reasons
      - n: 1b
        text: Immediate goals in terms of specific knowledge
      - n: 1c
        text: Benefits related to Earth resources, technology, and new products
      - n: 1d
        text: International relations and cooperation
  - n: "2"
    text: Design a collector’s card, with a picture on the front and information on the back, about your favorite space pioneer. Share your card and discuss four other space pioneers with your counselor.
  - n: "3"
    text: Build, launch, and recover a model rocket.* Make a second launch to accomplish a specific objective. (Rocket must be built to meet the safety code of the National Association of Rocketry. See the “Model Rocketry” chapter of the Space Exploration pamphlet.) Identify and explain the following rocket parts.
    children:
      - n: 3a
        text: Body tube
      - n: 3b
        text: Engine mount
      - n: 3c
        text: Fins
      - n: 3d
        text: Igniter
      - n: 3e
        text: Launch lug
      - n: 3f
        text: Nose cone
      - n: 3g
        text: Payload
      - n: 3h
        text: Recovery system
      - n: 3i
        text: Rocket engine
  - n: "4"
    text: "Discuss and demonstrate each of the following:"
    children:
      - n: 4a
        text: The law of action-reaction
      - n: 4b
        text: How rocket engines work
      - n: 4c
        text: How satellites stay in orbit
      - n: 4d
        text: How satellite pictures of Earth and pictures of other planets are made and transmitted
  - n: "5"
    text: "Do TWO of the following:"
    choose: 2
    children:
      - n: 5a
        text: Discuss with your counselor a robotic space exploration mission and a historic crewed mission. Tell about each mission’s major discoveries, its importance, and what was learned from it about the planets, moons, or regions of space explored.
      - n: 5b
        text: Using articles from the internet, photographs and text, create a blog, website, or slide show about a current planetary mission or use magazine photographs, news clippings, and articles from the internet to make a scrapbook about a current planetary mission.
      - n: 5c
        text: Design a robotic mission to another planet, moon, comet, or asteroid that will return samples of its surface to Earth. Name the planet, moon, comet, or asteroid your spacecraft will visit. Show how your design will cope with the conditions of the environments of the planet, moon, comet, or asteroid.
  - n: "6"
    text: "Describe the purpose, operation, and components of ONE of the following:"
    children:
      - n: 6a
        text: Space shuttle or any other crewed orbital vehicle, whether governmentowned (U.S. or foreign) or commercial
      - n: 6b
        text: International Space Station
  - n: "7"
    text: "Design an inhabited base located within our solar system, such as Titan, asteroids, or other locations that humans might want to explore in person. Make drawings or a model of your base. In your design, consider and plan for the following:"
    children:
      - n: 7a
        text: Source of energy
      - n: 7b
        text: How it will be constructed
      - n: 7c
        text: Life-support system
      - n: 7d
        text: Purpose and function
  - n: "8"
    updated_2026: true
    text: Explore careers related to this merit badge. Research one career to learn about the training and education needed, costs, job prospects, salary, job duties, and career advancement. Your research methods may include -- with your parent or guardian’s permission -- an internet or library search, an interview with a professional in the field, or a visit to a location where people in this career work. Discuss with your counselor both your findings and what about this profession might make it an interesting career.
