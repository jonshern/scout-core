id: badge:chemistry
name: Chemistry
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/chemistry/
worksheet_url: http://usscouts.org/mb/worksheets/Chemistry.pdf
requirements:
  - n: "1"
    text: "Do the following and discuss with your counselor:"
    children:
      - n: 1a
        text: Obtain safety data sheets (SDS) for sucrose (sugar), isopropyl alcohol (rubbing alcohol), and a waterproofing spray. Compare their properties and potential hazard(s), including handling and disposal guidelines and toxicity information.
      - n: 1b
        text: What types of personal protective equipment (PPE) are recommended for each, and why? How does the recommended PPE change with toxicity and route of exposure?
      - n: 1c
        text: Review the pictograms in Section 2 of each SDS. What do they mean, and how do you see them used in your community?
      - n: 1d
        text: Discuss the safe storage of chemicals. How does the safe storage of chemicals apply to your home, your school, your community, and the environment?
  - n: "2"
    text: "Chemistry and First Aid. After successfully completing requirement 1, do the following:"
    children:
      - n: 2a
        text: Discuss with your counselor why you think soap and alcohol are used to clean cuts and scrapes. Discuss how you could test your hypotheses with your counselor.
      - n: 2b
        text: Coat your hands with a mixture of cooking oil and a nontoxic powder, such as sand or cocoa. Wash your hands with water and observe what happens. Coat your hands again, then wash with soap and water. Discuss the differences with your counselor.
      - n: 2c
        text: Perform an experiment to demonstrate how rubbing alcohol affects microbial growth using baker’s yeast. Discuss the results with your counselor.
  - n: "3"
    text: "Chemistry in the Kitchen. After successfully completing requirement 1, do the following:"
    children:
      - n: 3a
        text: Perform a Maillard, or browning, reaction. Discuss with your counselor whether a physical or chemical change has occurred, and what happened to molecules in the food during the cooking process.
      - n: 3b
        text: Prepare and use red cabbage indicator to measure the pH of five common household liquids, including water. Discuss your observations with your counselor.
  - n: "4"
    text: "Chemistry and Camping. After successfully completing requirement 1, do TWO of the following:"
    choose: 2
    children:
      - n: 4a
        text: Design and conduct an experiment to compare at least two different types of waterproofing. Discuss with your counselor which one you would prefer to use on your tent and which one you would prefer to use on your boots, and why.
      - n: 4b
        text: Describe the four classes of fires, and the four classes of fire extinguishers. Discuss with your counselor how sand, baking soda, and the four classes of extinguishers work to put out fires.
      - n: 4c
        text: Under your counselor’s supervision and/or the supervision of a knowledgeable adult approved in advance by your counselor, conduct flame tests of at least five elements using a kitchen or propane torch.
      - n: 4d
        text: Under your counselor’s supervision and/or the supervision of a knowledgeable adult approved in advance by your counselor, synthesize nylon (may be from a kit).
  - n: "5"
    text: Describe how chemistry can be used to reduce the environmental impacts of single-use items, such as water bottles, bags, straws, or batteries.
  - n: "6"
    text: Identify five fields of chemistry. Briefly describe each, tell how each applies to your life and how they interact.
  - n: "7"
    text: Identify three government agencies that oversee or provide guidance on the use of chemicals for personal, pharmaceutical, commercial, or industrial use, and discuss the agencies’ history and responsibilities with your counselor.
  - n: "8"
    text: "Do ONE of the following:"
    choose: 1
    children:
      - n: 8a
        text: Visit a research laboratory, and discuss the research performed there with a chemist or chemical technician. Learn what education and training they received.
      - n: 8b
        text: Visit a company or plant that makes chemical products or uses chemical processes. Learn about their products or processes, and talk with someone who works there. Learn what they do, and what education and training they received.
      - n: 8c
        text: Identify three career opportunities that would use skills and knowledge in chemistry. Pick one and research the training, education, certification requirements, experience, and expenses associated with entering the field. Research the prospects for employment, starting salary, advancement opportunities and career goals associated with this career. Discuss what you learned with your counselor and whether you might be interested in this career.
