id: badge:photography
name: Photography
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/photography/
worksheet_url: http://usscouts.org/mb/worksheets/Photography.pdf
requirements:
  - n: "1"
    text: "Safety. Do the following:"
    children:
      - n: 1a
        text: Explain to your counselor the most likely hazards you may encounter while working with photography and what you should do to anticipate, mitigate, prevent, and respond to these hazards. Explain how you would prepare for exposure to environmental situations such as weather, sun, and water.
      - n: 1b
        text: View the Personal Safety Awareness “Digital Safety” video (with your parent or guardian’s permission).
  - n: "2"
    text: "Explain how the following elements and terms can affect the quality of a picture:"
    children:
      - n: 2a
        text: Light—natural light (ambient/existing), low light (such as at night), and artificial light (such as from a flash)
      - n: 2b
        text: Exposure—aperture (f-stops), shutter speed, ISO
      - n: 2c
        text: Depth of field
      - n: 2d
        text: Composition—rule of thirds, leading lines, framing, depth
      - n: 2e
        text: Angle of view
      - n: 2f
        text: Stop action and blur motion
      - n: 2g
        text: Decisive moment (action or expression captured by the photographer)
  - n: "3"
    text: Explain the basic parts and operation of a camera. Explain how an exposure is made when you take a picture.
  - n: "4"
    text: Do TWO of the following, then share your work with your counselor.
    choose: 2
    children:
      - n: 4a
        text: Photograph one subject from two different angles or perspectives.
      - n: 4b
        text: Photograph one subject from two different light sources—artificial and natural.
      - n: 4c
        text: Photograph one subject with two different depth of fields.
      - n: 4d
        text: Photograph one subject with two different compositional techniques.
  - n: "5"
    text: Photograph THREE of the following, then share your work your counselor.
    children:
      - n: 5a
        text: Close-up of a person
      - n: 5b
        text: Two to three people interacting
      - n: 5c
        text: Action shot
      - n: 5d
        text: Animal shot
      - n: 5e
        text: Nature shot
      - n: 5f
        text: Picture of a person—candid, posed, or camera aware
  - n: "6"
    text: Describe how software allows you to enhance your photograph after it is taken. Select a photo you have taken, then do ONE of the following, and share what you have done with your counselor.
    choose: 1
    children:
      - n: 6a
        text: Crop your photograph.
      - n: 6b
        text: Adjust the exposure or make a color correction.
      - n: 6c
        text: Show another way you could improve your picture for impact.
  - n: "7"
    text: "Using images other than those created for requirements 4, 5, or 6, produce a visual story to document an event to photograph OR choose a topic that interests you to photograph. Do the following:"
    children:
      - n: 7a
        text: Plan the images you need to photograph for your photo story.
      - n: 7b
        text: Share your plan with your counselor, and get your counselor’s input and approval before you proceed.
      - n: 7c
        text: Select eight to 12 images that best tell your story. Arrange your images in order and mount the prints on a poster board, OR create an electronic presentation. Share your visual story with your counselor.
  - n: "8"
    text: Identify three career opportunities in photography. Pick one and explain to your counselor how to prepare for such a career. Discuss what education and training are required, and why this profession might interest you.
