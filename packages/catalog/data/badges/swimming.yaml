id: badge:swimming
name: Swimming
edition: 2026
eagle_required: true
official_url: https://www.scouting.org/merit-badges/swimming/
worksheet_url: http://usscouts.org/mb/worksheets/Swimming.pdf
requirements:
  - n: "1"
    updated_2026: true
    text: "Do the following:"
    children:
      - n: 1a
        text: Review with your counselor how Scouting’s Safe Swim Defense plan anticipates and deals with common drowning situations such as unfenced residential pools, non-swimmers entering deep water, risky behaviors, medical impairment in the water, drop-offs, cold water, murky water, river currents, rip currents, and surf.
      - n: 1b
        text: Discuss the prevention and treatment of health concerns that could occur while swimming, including hypothermia, dehydration, sunburn, heat exhaustion, heatstroke, muscle cramps, hyperventilation, spinal injury, stings and bites, and cuts and scrapes.
  - n: "2"
    updated_2026: true
    text: Before doing the following requirements, successfully complete the Scouting America swimmer test, found in the Swimming merit badge pamphlet.
  - n: "3"
    text: "Correctly perform the following strokes:"
    children:
      - n: 3a
        text: Demonstrate the front crawl or the trudgen using good form.
      - n: 3b
        text: Demonstrate the back crawl using good form.
      - n: 3c
        text: Demonstrate the sidestroke using good form.
      - n: 3d
        text: Demonstrate the breaststroke using good form.
      - n: 3e
        text: Demonstrate the elementary backstroke using good form.
  - n: "4"
    text: Swim continuously for 150 yards in a strong manner using each of the following strokes in any order; front crawl or trudgen (25 yards); back crawl (25 yards); sidestroke (25 yards); breaststroke (25 yards); and elementary backstroke (50 yards).
  - n: "5"
    text: "Do the following:"
    children:
      - n: 5a
        text: Demonstrate water rescue methods by reaching with your arm or leg, by reaching with a suitable object, and by throwing lines and objects. Explain why swimming rescues should not be attempted when a reaching or throwing rescue is possible, and explain why and how a rescue swimmer should avoid contact with the victim.
      - n: 5b
        text: With a helper and a practice victim, show a line rescue both as tender and as rescuer. The practice victim should be approximately 30 feet from shore in deep water.
  - n: "6"
    text: "Do the following:"
    children:
      - n: 6a
        text: Float faceup in a resting position for at least three minutes with minimal movement.
      - n: 6b
        text: Demonstrate survival floating for at least five minutes.
      - n: 6c
        text: While wearing a properly fitted U.S. Coast Guard–approved life jacket, demonstrate the HELP and huddle positions. Explain their purposes.
      - n: 6d
        text: Explain why swimming or survival floating will hasten the onset of hypothermia in cold water.
  - n: "7"
    text: "In water over your head, but not to exceed 10 feet, do the following:"
    children:
      - n: 7a
        text: Use the feetfirst method of surface diving and bring an object up from the bottom.
      - n: 7b
        text: Do a headfirst surface dive (pike or tuck), and bring the object up again.
      - n: 7c
        text: Do a headfirst surface dive to a depth of at least 5 feet and swim underwater for three strokes. Come to the surface, take a breath, and repeat the sequence twice.
  - n: "8"
    text: Following the guidelines set in the Scouting America Safe Swim Defense, in water at least 7 feet deep*, show a standing headfirst dive from a dock or pool deck. Show a long shallow dive, also from the dock or pool deck.
  - n: "9"
    text: Explain the health benefits of regular aerobic exercise, and discuss why swimming is favored as both fitness and therapeutic exercise. *If your state, city, or local community requires a water depth greater than 7 feet, it is important to abide by that mandate.
