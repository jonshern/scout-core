id: badge:salesmanship
name: Salesmanship
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/salesmanship/
worksheet_url: http://usscouts.org/mb/worksheets/Salesmanship.pdf
requirements:
  - n: "1"
    text: "Do the following:"
    children:
      - n: 1a
        text: Explain the responsibilities of a salesperson and how a salesperson serves customers and helps stimulate the economy.
      - n: 1b
        text: Explain the differences between a business-to-business salesperson and a consumer salesperson.
  - n: "2"
    text: "Explain why it is important for a salesperson to do the following:"
    children:
      - n: 2a
        text: Research the market to be sure the product or service meets the needs of customers.
      - n: 2b
        text: Learn all about the product to be sold.
      - n: 2c
        text: If possible, visit the location where the product is built and learn how it is constructed. If a service is being sold, learn about the benefits of the service to the customer.
      - n: 2d
        text: Follow up with customers after their purchase to confirm their satisfaction and discuss their concerns about the product.
  - n: "3"
    text: Write and present a sales plan for a product and a sales territory assigned by your counselor.
  - n: "4"
    text: Make a sales presentation of a product assigned by your counselor.
  - n: "5"
    text: "Do ONE of the following and keep a record (cost sheet). Use the sales techniques you have learned, and share your experience with your counselor:"
    choose: 1
    children:
      - n: 5a
        text: Help your unit raise funds through sales of merchandise or of tickets to a Scout event.
      - n: 5b
        text: Sell your services such as lawn raking or mowing, pet watching, dog walking, snow shoveling, and car washing to your neighbors. Follow up after the service has been completed and determine the customer’s satisfaction.
      - n: 5c
        text: Earn money through retail selling.
  - n: "6"
    text: "Do ONE of the following:"
    choose: 1
    children:
      - n: 6a
        text: "Interview a salesperson and learn the following:"
        children:
          - n: 6a1
            text: What made the person choose sales as a profession?
          - n: 6a2
            text: What are the most important things to remember when talking to customers?
          - n: 6a3
            text: How is the product sold?
          - n: 6a4
            text: Include your own questions.
      - n: 6b
        text: "Interview a retail store owner and learn the following:"
        children:
          - n: 6b1
            text: How often is the owner approached by a sales representative?
          - n: 6b2
            text: What good traits should a sales representative have? What habits should the sales representative avoid?
          - n: 6b3
            text: What does the owner consider when deciding whether to establish an account with a sales representative?
          - n: 6b4
            text: Include at least two of your own questions.
  - n: "7"
    text: "Investigate and report on career opportunities in sales, then do the following:"
    children:
      - n: 7a
        text: Prepare a written statement of your qualifications and experience. Include relevant classes you have taken in school and merit badges you have earned.
      - n: 7b
        text: Discuss with your counselor what education, experience, or training you should obtain so you are prepared to serve in a sales position.
