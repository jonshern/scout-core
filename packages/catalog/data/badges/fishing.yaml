id: badge:fishing
name: Fishing
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/fishing/
worksheet_url: http://usscouts.org/mb/worksheets/Fishing.pdf
requirements:
  - n: "1"
    text: "Do the following:"
    children:
      - n: 1a
        text: Explain to your counselor the most likely hazards you may encounter while participating in fishing activities, and what you should do to anticipate, help prevent, mitigate, and respond to these hazards.
      - n: 1b
        text: "Discuss the prevention of and treatment for the following health concerns that could occur while fishing: cuts and scratches, puncture wounds, insect bites, hypothermia, dehydration, heat exhaustion, heatstroke, sunburn."
      - n: 1c
        text: Explain how to remove a barbed hook that is lodged in someone’s arm.
      - n: 1d
        text: Name and explain five safety practices you should always follow while fishing.
  - n: "2"
    text: Discuss the differences between two types of fishing outfits. Point out and identify the parts of several types of rods and reels. Explain how and when each would be used. Review with your counselor how to care for this equipment.
  - n: "3"
    text: Demonstrate the proper use of two different types of fishing equipment.
  - n: "4"
    text: "Demonstrate how to tie the following knots: improved clinch knot, Palomar knot, uni knot, uni to uni knot, and arbor knot. Explain how and when each knot is used."
  - n: "5"
    text: Name and identify five basic artificial lures and five natural baits and explain how to fish with them. Explain why baitfish are not to be released.
  - n: "6"
    text: "Do the following:"
    children:
      - n: 6a
        text: Explain the importance of practicing Leave No Trace Seven Principles and the Outdoor Code. Discuss the positive effects of Leave No Trace Seven Principles and the Outdoor Code on fishing resources.
      - n: 6b
        text: Discuss the meaning and importance of catch and release. Describe how to properly release a fish safely to the water.
  - n: "7"
    text: Obtain and review the regulations affecting gamefishing where you live. Explain why they were adopted and what is accomplished by following them.
  - n: "8"
    text: Explain what good outdoor sportsmanlike behavior is and how it relates to anglers. Tell how the Leave No Trace Seven Principles and the Outdoor Code relate to a fishing sports enthusiast, including the aspects of littering, trespassing, courteous behavior, and obeying fishing regulations.
  - n: "9"
    text: Catch one fish and identify it. 10.If regulations and health concerns permit, clean and cook a fish you have caught. Otherwise, acquire a fish and cook it. (You do not need to eat your fish.) Scouts should obey all local fishing regulations and property laws.
  - n: "10"
    updated_2026: true
    text: "If regulations and health concerns permit, clean and cook a fish you have caught. If you are unable to catch a fish for eating, acquire a fish, clean the fish you acquired, and cook the fish you acquired. Note: It is not required that you eat the fish."
