id: badge:home-repairs
name: Home Repairs
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/home-repairs/
worksheet_url: http://usscouts.org/mb/worksheets/Home-Repairs.pdf
requirements:
  - n: "1"
    text: "Do the following:"
    children:
      - n: 1a
        text: Explain to your counselor the most likely hazards you may encounter while working on home repairs and what you should do to anticipate, mitigate and prevent, and respond to these hazards. Describe the appropriate safety gear and clothing that should be used when working on home repairs.
      - n: 1b
        text: Discuss general precautions related to home repairs. Name at least 10 safe practices that every home repairer should exercise.
  - n: "2"
    updated_2026: true
    text: "Under the supervision of your parent, guardian, or counselor, do THREE of the following:"
    choose: 3
    children:
      - n: 2a
        text: Maintain or recondition a yard tool and show that you know how to clean up and properly store this equipment.
      - n: 2b
        text: Weather strip a window or door.
      - n: 2c
        text: Caulk cracks or joints open to the weather.
      - n: 2d
        text: Repair a break in a concrete or asphalt surface.
      - n: 2e
        text: Repair or replace the screen in a window or door.
      - n: 2f
        text: Replace a pane of glass.
  - n: "3"
    text: "Under the supervision of your parent, guardian, or counselor, do THREE of the following:"
    choose: 3
    children:
      - n: 3a
        text: Install or build equipment for storing tools.
      - n: 3b
        text: Build a workbench.
      - n: 3c
        text: Repair a piece of furniture.
      - n: 3d
        text: Paint or varnish a piece of furniture, a door, or trim on a house.
      - n: 3e
        text: Repair a sagging door or gate.
      - n: 3f
        text: Repair a loose step or railing.
      - n: 3g
        text: Repair a fence.
  - n: "4"
    text: "Under the supervision of your parent, guardian, or counselor, do TWO of the following:"
    choose: 2
    children:
      - n: 4a
        text: Locate a main electrical switch box and know how to replace a fuse or reset a circuit breaker.
      - n: 4b
        text: Replace an electrical cord or repair a plug or lamp socket.
      - n: 4c
        text: Install a single-pole light switch.
      - n: 4d
        text: Replace an electrical wall outlet.
  - n: "5"
    updated_2026: true
    text: "Under the supervision of your parent, guardian, or counselor, locate and know how to turn off the main water source, including well pumps, and do TWO of the following:"
    choose: 2
    children:
      - n: 5a
        text: Clear a clogged drain or trap.
      - n: 5b
        text: Repair a leaky water faucet.
      - n: 5c
        text: Repair a flush toilet.
      - n: 5d
        text: Repair a leaky hose or connector.
      - n: 5e
        text: Clean or replace a sprinkler head.
  - n: "6"
    updated_2026: true
    text: "Under the supervision of your parent, guardian, or counselor, do THREE of the following:"
    choose: 3
    children:
      - n: 6a
        text: Paint a wall or ceiling.
      - n: 6b
        text: Repair or replace damaged tile, linoleum, or vinyl flooring.
      - n: 6c
        text: Install drapery or curtain rods and then hang drapes or curtains.
      - n: 6d
        text: Repair a hole in drywall.
      - n: 6e
        text: Secure a picture, plant hanger or other object approved by your parent or guardian to drywall using anchors.
      - n: 6f
        text: Reinforce a picture frame.
      - n: 6g
        text: Mend an object made of china, glass, or pottery.
      - n: 6h
        text: Fix a drawer slide or fix/replace cabinet pulls.
  - n: "7"
    updated_2026: true
    text: "Do ONE of the following:"
    choose: 1
    children:
      - n: 7a
        text: Explore careers related to this merit badge. Research one career to learn about the training and education needed, costs, job prospects, salary, job duties, and career advancement. Your research methods may include- with your parent or guardian’s permission- an internet or library search, an interview with a professional in the field, or a visit to a location where people in this career work. Discuss with your counselor both your findings and what about this profession might make it an interesting career.
      - n: 7b
        text: Explore how you could use knowledge and skills from this merit badge to pursue a hobby or healthy lifestyle. Research any training needed, expenses, and organizations that promote or support it. Discuss with your counselor what short-term and long-term goals you might have if you pursued this.
