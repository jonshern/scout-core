id: badge:personal-fitness
name: Personal Fitness
edition: 2026
eagle_required: true
official_url: https://www.scouting.org/merit-badges/personal-fitness/
worksheet_url: http://usscouts.org/mb/worksheets/Personal-Fitness.pdf
notes:
  - If meeting any of the requirements for this merit badge is against the Scout’s religious convictions, the requirement does not have to be done if the Scout’s parent or guardian and the proper religious advisors state in writing that to do so would be against religious convictions. The Scout’s parent or guardian must also accept full responsibility for anything that might happen because of this exemption.
requirements:
  - n: "1"
    updated_2026: true
    text: "Defining Personal Fitness. Explain to your counselor what personal fitness means to you, including:"
    children:
      - n: 1a
        text: Describe a person who is physically fit.
      - n: 1b
        text: Describe a person who is mentally, emotionally and socially fit.
      - n: 1c
        text: Describe a person who is spiritually fit.
      - n: 1d
        text: Explain why it is important to be fit in all of these ways.
      - n: 1e
        text: Discuss how each aspect of personal fitness relates to the Scout Oath and Scout Law.
  - n: "2"
    updated_2026: true
    text: "Monitoring Your Health. Do the following:"
    children:
      - n: 2a
        text: Discuss with your counselor the importance of having a physical examination each year. Discuss why overall health, immunizations, medications, allergies, and medical history are covered during an examination. Tell your counselor when you last underwent a physical examination.
      - n: 2b
        text: Explain why it is important to have a routine dental examination. Explain what preventive or corrective treatments your dentist can provide, and why daily oral care is an important part of staying well. Tell your counselor when you last underwent a dental examination.
  - n: "3"
    updated_2026: true
    text: "Your Fitness Knowledge and Habits. Do the following with your counselor:"
    children:
      - n: 3a
        text: Explain the physical exercise you regularly do, whether your routine includes all four components of physical fitness (cardiorespiratory fitness, muscular strength and endurance, flexibility, and body composition), and how your current practices increase or decrease your likelihood of developing cardiovascular disease or other conditions in adulthood.
      - n: 3b
        text: Discuss what harmful substances you consciously avoid, and how these actions affect your risk factors now and in the future.
      - n: 3c
        text: Explain what common diseases can be prevented or mitigated by vaccinations, and whether you are immunized according to the advice of your healthcare provider and the direction of your parent or guardian.
      - n: 3d
        text: Discuss how good nutrition is related to the other components of personal fitness, and if you follow a nutritious, balanced diet.
      - n: 3e
        text: Discuss what a healthy weight is for you, and what you do to maintain a healthy weight.
      - n: 3f
        text: Explain why getting adequate sleep is important, and whether you get enough hours of sleep each night.
      - n: 3g
        text: Discuss whether you spend quality time with your family and friends in social and recreational activities, and how you contribute to creating and maintaining a good home life.
  - n: "4"
    updated_2026: true
    text: Measures of Physical Fitness. Determine with your counselor the assessments of physical fitness and nutrition you will do before, during, and after completing the 12-week program in requirement 7.
    children:
      - n: 4a
        text: "Include a measure of cardiorespiratory (aerobic) fitness: Record the time required to complete a mile walk or run as fast as you can. If you are unable to walk or run as a result of a disability that is permanent or is expected to last for longer than two years, work with your counselor to define a test with a similar degree of aerobic challenge."
      - n: 4b
        text: "Include two measures of muscular strength and endurance: Record either the number of sit-ups done in 60 seconds OR how long a plank was held; AND, record the number of either push-ups OR pull-ups done in 60 seconds. If you are unable to complete one these exercises safely and correctly, work with your counselor to replace it with a different exercise that measures strength and endurance."
      - n: 4c
        text: Include at least one measure of flexibility, such as a back-saver sit-and-reach test or a back scratch test.
  - n: "5"
    updated_2026: true
    text: "Pre-Assessment of Physical Fitness. Before beginning the 12-week program in requirement 7, do the following:"
    children:
      - n: 5a
        text: Complete each of the assessments you defined in requirement 4, and record your results.
      - n: 5b
        text: Identify your weakest and strongest area of physical fitness, and choose an area to target for improvement.
      - n: 5c
        text: Keep a log of what you eat and drink for a period of three days.
      - n: 5d
        text: Based on your diet log, identify at least two improvement goals related to diet and nutrition.
  - n: "6"
    updated_2026: true
    text: "Plan the Program. Outline with your counselor a comprehensive 12-week physical fitness and nutrition program that you will complete based on your improvement goals and ability. The program must incorporate the following:"
    children:
      - n: 6a
        text: "warm-up: low-intensity movement or gentle muscle stretching before each more rigorous workout"
      - n: 6b
        text: "cardiorespiratory (aerobic) element: an activity that raises your heart and respiratory rate for 15 to 30 minutes at least three times per week"
      - n: 6c
        text: "muscular strength and endurance element: repetitive exercises that target different muscles – upper body, core, and/or legs – based on your improvement goals and potential"
      - n: 6d
        text: "flexibility element: movements that arch/lower/stretch/relax your back, rotate your trunk, or stretch your hamstrings"
      - n: 6e
        text: "cool-down: low-intensity movement or gentle stretching to prevent muscle cramps and enhance the benefits of exercise"
      - n: 6f
        text: a plan for achieving your two improvement goals related to diet and nutrition.
  - n: "7"
    updated_2026: true
    text: "Complete the Program. Do the following:"
    children:
      - n: 7a
        text: Complete and keep a log, over 12 consecutive weeks, of the physical fitness and nutrition program you have outlined. (If your program is interrupted by illness or unavoidable conflicts for less than two weeks, you may resume where you left off, adding the missed days or weeks at the end.)
      - n: 7b
        text: During week 4 and week 8 of your program, repeat the assessments you did in requirement 5a before you began. Repeat the same tests for a final assessment within two weeks after completing the 12-week program. Show improvement over your pre-assessment results.
      - n: 7c
        text: For three days during week 8, and again during week 12, keep a log of what you eat and drink. Show improvement toward the diet and nutrition goals you set in requirement 5d.
      - n: 7d
        text: Discuss your results, improvements, insights, and experiences with your counselor after completing the program and assessments.
  - n: "8"
    updated_2026: true
    text: "Future Career or Lifestyle. Do ONE of the following:"
    choose: 1
    children:
      - n: 8a
        text: Explore three careers related to personal fitness. Research one career area by interviewing an expert in the field, visiting a site, or using other resources. Learn about training, education, expenses, job outlook, salary, and advancement. Discuss your findings and career interest with your counselor.
      - n: 8b
        text: Explore how an area of personal fitness could contribute to a hobby or healthy lifestyle. Research education, costs, and organizations related to this activity. Discuss your findings and goals with your counselor.
  - n: "9"
    text: Find out about three career opportunities in personal fitness. Pick one and find out the education, training, and experience required for this profession. Discuss what you learned with your counselor, and explain why this profession might interest you.
