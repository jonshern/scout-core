id: badge:oceanography
name: Oceanography
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/oceanography/
worksheet_url: http://usscouts.org/mb/worksheets/Oceanography.pdf
requirements:
  - n: "1"
    text: Name four branches of oceanography. Describe at least five reasons why it is important for people to learn about the oceans.
  - n: "2"
    text: "Explain the following terms: salinity, temperature, density. Describe how these important properties of seawater are measured by an oceanographer. Discuss the circulation and currents of the ocean. Describe the effects of the oceans on weather and climate."
  - n: "3"
    updated_2026: true
    text: "Describe the characteristics of ocean waves and do the following:"
    children:
      - n: 3a
        text: Point out the differences among the storm surge, tsunami, tidal wave, and tidal bore.
      - n: 3b
        text: Explain the difference between sea, swell, and surf.
      - n: 3c
        text: Explain how breakers are formed.
      - n: 3d
        text: Explain what a rip current is, how to avoid them, and what to do if you are caught in one.
  - n: "4"
    text: "Draw a cross-section of underwater topography. Show what is meant by:"
    children:
      - n: 4a
        text: Continental shelf
      - n: 4b
        text: Continental slope
      - n: 4c
        text: "Abyssal plain Name and put on your drawing the following: seamount, guyot, rift valley, canyon, trench, and oceanic ridge. Compare the depths in the oceans with the heights of mountains on land."
  - n: "5"
    text: List the main salts, gases, and nutrients in seawater. Describe some important properties of water. Tell how the animals and plants of the ocean affect the chemical composition of seawater. Explain how differences in evaporation and precipitation affect the salt content of the oceans.
  - n: "6"
    text: Describe some of the biologically important properties of seawater. Define benthos, nekton, and plankton. Name some of the plants and animals that make up each of these groups. Describe the place and importance of phytoplankton in the oceanic food chain.
  - n: "7"
    text: "Do ONE of the following:"
    choose: 1
    children:
      - n: 7a
        text: Make a plankton net. Tow the net by a dock, wade with it, hold it in a current, or tow it from a rowboat.* Do this for about 20 minutes. Save the sample. Examine it under a microscope or high-power glass. Identify the three most common types of plankton in the sample.
      - n: 7b
        text: Make a series of models (clay or plaster and wood) of a volcanic island. Show the growth of an atoll from a fringing reef through a barrier reef. Describe the Darwinian theory of coral reef formation. O *May be done in lakes or streams.
      - n: 7c
        text: Measure the water temperature at the surface, midwater, and bottom of a body of water four times daily for five consecutive days. You may measure depth with a rock tied to a line. Make a Secchi disk to measure turbidity (how much suspended sedimentation is in the water). Measure the air temperature. Note the cloud cover and roughness of the water. Show your findings (air and water temperature, turbidity) on a graph. Tell how the water temperature changes with air temperature.
      - n: 7d
        text: Make a model showing the inshore sediment movement by littoral currents, tidal movement, and wave action. Include such formations as high and low waterlines, low-tide terrace, berm, and coastal cliffs. Show how offshore bars are built up and torn down.
      - n: 7e
        text: Make a wave generator. Show reflection and refraction of waves. Show how groins, jetties, and breakwaters affect these patterns.
      - n: 7f
        text: Track and monitor satellite images available on the internet for a specific location for three weeks. Describe what you have learned to your counselor.
  - n: "8"
    text: "Do ONE of the following:"
    choose: 1
    children:
      - n: 8a
        text: Write a 500-word report on a book about oceanography approved by your counselor.
      - n: 8b
        text: Visit one of the following and write a 500-word report about your visit.
        children:
          - n: 8b1
            text: Oceanographic research ship
          - n: 8b2
            text: Oceanographic institute, marine laboratory, or marine aquarium
      - n: 8c
        text: Explain to your troop in a five-minute prepared speech “Why Oceanography Is Important” or describe “Career Opportunities in Oceanography.” (Before making your speech, show your speech outline to your counselor for approval.)
  - n: "9"
    text: Describe four methods that marine scientists use to investigate the ocean, underlying geology, and organisms living in the water.
