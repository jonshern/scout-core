id: badge:fly-fishing
name: Fly Fishing
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/fly-fishing/
worksheet_url: http://usscouts.org/mb/worksheets/Fly-Fishing.pdf
requirements:
  - n: "1"
    text: "Do the following:"
    children:
      - n: 1a
        text: Explain to your counselor the most likely hazards you may encounter while participating in fly-fishing activities and what you should do to anticipate, help prevent, mitigate, and respond to these hazards. Name and explain five safety practices you should always follow while fly-fishing.
      - n: 1b
        text: "Discuss the prevention of and treatment for health concerns that could occur while fly-fishing: cuts and scratches, puncture wounds, insect bites, hypothermia, dehydration, heat exhaustion, heatstroke, sunburn."
      - n: 1c
        text: Explain how to remove a hook that has lodged in your arm.
  - n: "2"
    text: Demonstrate how to match a fly rod, line, and leader to achieve a balanced system. Discuss several types of fly lines, and explain how and when each would be used. Review with your counselor how to care for this equipment.
  - n: "3"
    text: "Demonstrate how to tie proper knots to prepare a fly rod for fishing:"
    children:
      - n: 3a
        text: Tie backing to the arbor of a fly reel spool using an arbor knot.
      - n: 3b
        text: Tie backing to the fly line using a nail (tube) knot.
      - n: 3c
        text: Attach a leader to the fly line using a nail (tube) knot or a loop-to-loop connection.
      - n: 3d
        text: Add a tippet to a leader using a surgeon’s knot or a loop-to-loop connection.
      - n: 3e
        text: Tie a fly onto the terminal end of the leader using an improved clinch knot.
  - n: "4"
    text: "Explain how and when each of the following types of flies is used: dry flies, wet flies, nymphs, streamers, bass bugs, poppers, and saltwater flies. Tell what each one imitates. Tie at least two types of the flies mentioned in this requirement."
  - n: "5"
    text: Demonstrate the ability to cast a fly 30 feet consistently and accurately using both overhead and roll cast techniques.
  - n: "6"
    text: Go to a suitable fishing location and observe what fish may be eating both above and beneath the water’s surface. Explain the importance of matching the hatch.
  - n: "7"
    text: "Do the following:"
    children:
      - n: 7a
        text: Explain the importance of practicing Leave No Trace Seven Principles and the Outdoor Code. Discuss the positive effects of the Leave No Trace Seven Principles and the Outdoor Code on fly-fishing resources.
      - n: 7b
        text: Discuss the meaning and importance of catch and release. Describe how to properly release a fish safely to the water.
  - n: "8"
    text: Obtain and review a copy of the regulations affecting game fishing where you live or where you plan to fish. Explain why they were adopted and what is accomplished by following them.
  - n: "9"
    updated_2026: true
    text: Explain what good outdoor sportsmanlike behavior is and how it relates to anglers. Tell how the Leave No Trace Seven Principles and the Outdoor Code relate to a fishing sports enthusiast, including the aspects of littering, trespassing, courteous behavior, and obeying fishing regulations.
  - n: "10"
    updated_2026: true
    text: Catch one fish on a fly and identify it.
  - n: "11"
    text: If regulations and health concerns permit, clean and cook a fish you have caught. Otherwise, acquire a fish and cook it. (You do not need to eat your fish.)
