id: badge:golf
name: Golf
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/golf/
worksheet_url: http://usscouts.org/mb/worksheets/Golf.pdf
requirements:
  - n: "1"
    text: Discuss safety on the golf course. Show that you know first aid for injuries or illnesses that could occur while golfing, including lightning, heat reactions, sunburn, dehydration, blisters, animal or bug bites, poison ivy exposure, sprains, strains.
  - n: "2"
    text: "Complete ONE of the following options:"
    choose: 1
    options:
      - key: "1"
        name: Traditional Golf
      - key: "2"
        name: Disc Golf
    children:
      - n: 2a-opt1
        option: "1"
        text: Study the USGA “Rules of Golf” now in use.
        children:
          - n: 2a-opt11
            text: Tell about the three categories of golf etiquette.
          - n: 2a-opt12
            text: Demonstrate that you understand the definitions of golf terms.
          - n: 2a-opt13
            text: Show that you understand the “Rules of Amateur Status.”
      - n: 2b-opt1
        option: "1"
        text: Tell about your understanding of the World Handicap System.
      - n: 2c-opt1
        option: "1"
        text: "Do the following:"
        children:
          - n: 2c-opt11
            text: Tell about the early history of golf.
          - n: 2c-opt12
            text: Describe golf’s early years in the United States.
          - n: 2c-opt13
            text: Tell about the accomplishments of a top golfer of your choice.
      - n: 2d-opt1
        option: "1"
        text: "Do the following:"
        children:
          - n: 2d-opt11
            text: Tell how golf can contribute to a healthy lifestyle, mentally and physically.
          - n: 2d-opt12
            text: Tell how a golf exercise plan can help you play better. Show two exercises that would help improve your game.
      - n: 2e-opt1
        option: "1"
        text: "Show the following:"
        children:
          - n: 2e-opt11
            text: The proper grip, stance, posture, and key fundamentals of a good swing
          - n: 2e-opt12
            text: Driver played from a tee
          - n: 2e-opt13
            text: The fairway wood shot
          - n: 2e-opt14
            text: The long iron shot
          - n: 2e-opt15
            text: The short iron shot
          - n: 2e-opt16
            text: The approach, chip-and-run, and pitch shots
          - n: 2e-opt17
            text: A recovery shot from a bunker or heavy rough
          - n: 2e-opt18
            text: A sound putting stroke
      - n: 2f-opt1
        option: "1"
        text: "Play a minimum of two nine-hole rounds or one 18-hole round of golf with another golfer about your age and with your counselor, or an adult approved by your counselor. Do the following:"
        children:
          - n: 2f-opt11
            text: Follow the “Rules of Golf.”
          - n: 2f-opt12
            text: Practice good golf etiquette.
          - n: 2f-opt13
            text: Show respect to fellow golfers, committee, sponsor, and gallery.
      - n: 2g-opt1
        option: "1"
        text: Find out about three careers related to traditional golf. Pick one and identify the education, training, and experience required for this profession. Discuss this with your counselor, and explain why this interests you.
      - n: 2a-opt2
        option: "2"
        text: Study the “PDGA Official Rules of Disc Golf” now in use.
        children:
          - n: 2a-opt21
            text: Tell about the six areas of Courtesy (812).
          - n: 2a-opt22
            text: Describe the seven areas of Scoring (808).
      - n: 2b-opt2
        option: "2"
        text: Tell about your understanding of the “PDGA Disc Golfer’s Code.”
      - n: 2c-opt2
        option: "2"
        text: "Do the following:"
        children:
          - n: 2c-opt21
            text: Tell about the history of disc golf and why it is an inclusive game.
          - n: 2c-opt22
            text: Discuss with your counselor the contributions Ed Headrick made to the sport of disc golf.
          - n: 2c-opt23
            text: Describe the evolution of disc design.
          - n: 2c-opt24
            text: Tell about the accomplishments of a top disc golfer of your choice.
      - n: 2d-opt2
        option: "2"
        text: "Do the following:"
        children:
          - n: 2d-opt21
            text: Tell how disc golf can contribute to a healthy lifestyle, mentally and physically.
          - n: 2d-opt22
            text: Tell how a disc golf exercise plan can help you play better. Show two exercises that would help improve your game.
      - n: 2e-opt2
        option: "2"
        text: "Show the following:"
        children:
          - n: 2e-opt21
            text: A good throwing grip
          - n: 2e-opt22
            text: A good runup (X-step) when throwing a disc
          - n: 2e-opt23
            text: Backhand shot
          - n: 2e-opt24
            text: Forehand shot
          - n: 2e-opt25
            text: Overhand shot
          - n: 2e-opt26
            text: Rolling shot
          - n: 2e-opt27
            text: A good (in-line) putting stance
          - n: 2e-opt28
            text: A good straddle putting stance
          - n: 2e-opt29
            text: A good putting grip
          - n: 2e-opt210
            text: A good putting motion & follow through
          - n: 2e-opt211
            text: The proper use of a mini-marking disc
      - n: 2f-opt2
        option: "2"
        text: "Play a minimum of 18-holes of disc golf with another disc golfer about your age and with your counselor, or an adult approved by your counselor. Do the following:"
        children:
          - n: 2f-opt21
            text: Follow the “PDGA Official Rules of Disc Golf.”
          - n: 2f-opt22
            text: Practice good disc golf etiquette.
          - n: 2f-opt23
            text: Show respect to fellow disc golfers and other people in the park along with any wildlife, trees, and plants on the property.
      - n: 2g-opt2
        option: "2"
        text: Find out about three careers related to disc golf. Pick one and identify the education, training, and experience required for this profession. Discuss this with your counselor, and explain why this interests you.
