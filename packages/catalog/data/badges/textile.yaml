id: badge:textile
name: Textile
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/textile/
worksheet_url: http://usscouts.org/mb/worksheets/Textile.pdf
requirements:
  - n: "1"
    text: Discuss with your counselor the importance of textiles. Explain the terms fiber, fabric, textile. Give examples of textiles you use every day.
  - n: "2"
    text: "Do the following:"
    children:
      - n: 2a
        text: Get swatches of two natural-fiber fabrics (100 percent cotton, linen, wool, or silk; no blends). Get swatches of two synthetic-fiber fabrics (nylon, polyester, acrylic, olefin, or spandex). Get a sample of one cellulosic fabric (rayon, acetate, or lyocell).
      - n: 2b
        text: Give the origin, major characteristics, and general content of each type of fiber obtained for 2(a). Explain the difference between a cellulosic manufactured fiber and a synthetic manufactured fiber.
      - n: 2c
        text: Describe the main steps in making raw fiber into yarn, and yarn into fabric.
      - n: 2d
        text: Assume you will soon buy a new garment or other textile item. Tell your counselor what fiber or blend of fibers you want the item to be, and give reasons for your choice.
  - n: "3"
    text: "Do TWO of the following:"
    choose: 2
    children:
      - n: 3a
        text: Visit a textile plant, textile products manufacturer, or textile school or college. Report on what you saw and learned.
      - n: 3b
        text: Weave a belt, headband, place mat, or wall hanging. Use a simple loom that you have made yourself.
      - n: 3c
        text: With a magnifying glass, examine a woven fabric, a nonwoven fabric, and a knitted fabric. Sketch what you see. Explain how the three constructions are different.
      - n: 3d
        text: Make a piece of felt.
      - n: 3e
        text: Make two natural dyes and use them to dye a garment or a piece of fabric.
      - n: 3f
        text: Waterproof a fabric.
      - n: 3g
        text: Demonstrate how to identify fibers, using microscope identification or the breaking test.
  - n: "4"
    text: "Explain the meaning of 10 of the following terms: warp, harness, heddle, shed, aramid, spandex, sliver, yarn, spindle, distaff, loom, cellulose, sericulture, extrusion, carbon fibers, spinneret, staple, worsted, nonwoven, greige goods."
  - n: "5"
    text: List the advantages and disadvantages of natural plant fibers, natural animal fibers, cellulosic manufactured fibers, and synthetic manufactured fibers. Identify and discuss at least four ecological concerns regarding the production and care of textiles.
  - n: "6"
    text: Explain to your counselor, either verbally or in a written report, five career possibilities in the textile industry. Tell about two positions that interest you the most and the education, cost of training, and specific duties those positions require.
