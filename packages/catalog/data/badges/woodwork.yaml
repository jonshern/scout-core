id: badge:woodwork
name: Woodwork
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/woodwork/
worksheet_url: http://usscouts.org/mb/worksheets/Woodwork.pdf
notes:
  - "*Requirement text: official 2025 Scouts BSA Requirements and the 1/1/2026 Major Requirement Changes (Scouting America). Worksheets: U.S. Scouting Service Project (usscouts.org). Generated May 2026.*"
requirements:
  - n: "1"
    text: "Do the following:"
    children:
      - n: 1a
        text: Explain to your counselor the most likely hazards you may encounter while participating in woodwork activities, and what you should do to anticipate, help prevent, mitigate, and respond to these hazards. Explain what precautions you should take to safely use your tools.
      - n: 1b
        text: Show that you know first aid for injuries that could occur while woodworking, including splinters, scratches, cuts, severe bleeding, and shock. Tell what precautions must be taken to help prevent loss of eyesight or hearing, and explain why and when it is necessary to use a dust mask.
      - n: 1c
        text: Earn the Totin’ Chip recognition.
  - n: "2"
    text: "Do the following:"
    children:
      - n: 2a
        text: Describe how timber is grown, harvested, and milled. Tell how lumber is cured, seasoned, graded, and sized.
      - n: 2b
        text: Collect and label blocks of six kinds of wood useful in woodworking. Describe the chief qualities of each. Give the best uses of each.
  - n: "3"
    text: "Do the following:"
    children:
      - n: 3a
        text: Show the proper care, use, and storage of all working tools and equipment that you own or use at home or school.
      - n: 3b
        text: Sharpen correctly the cutting edges of two different tools.
  - n: "4"
    text: Using a saw, plane, hammer, brace, and bit, make something useful of wood. Cut parts from lumber that you have squared and measured from working drawings.
  - n: "5"
    text: Create your own woodworking project. Begin by making working drawings, list the materials you will need to complete your project, and then build your project. Keep track of the time you spend and the cost of the materials.
  - n: "6"
    text: "Do TWO of the following:"
    choose: 2
    children:
      - n: 6a
        text: Make working drawings of a project needing beveled or rounded edges and build it.
      - n: 6b
        text: Make working drawings of a project needing curved or incised cuttings and build it.
      - n: 6c
        text: Make working drawings of a project needing miter, dowel, or mortise and tenon joints and build it.
      - n: 6d
        text: Make a cabinet, box, or something else with a door or lid fastened with inset hinges.
      - n: 6e
        text: Help make and repair wooden toys for underprivileged children OR help carry out a woodworking service project approved by your counselor for a charitable organization.
  - n: "7"
    text: Talk with a cabinetmaker or carpenter. Learn about the training, apprenticeship, career opportunities, work conditions, work hours, pay rates, and union organization that woodworking craftsmen have in your area.
