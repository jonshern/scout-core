id: badge:chess
name: Chess
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/chess/
worksheet_url: http://usscouts.org/mb/worksheets/Chess.pdf
requirements:
  - n: "1"
    updated_2026: true
    text: "Do the following:"
    children:
      - n: 1a
        text: Discuss with your counselor the history of the game of chess.
      - n: 1b
        text: Research a famous chess player and what accomplishments made him or her famous. Discuss with your counselor.
  - n: "2"
    updated_2026: true
    text: "Discuss with your counselor the following:"
    children:
      - n: 2a
        text: Why chess is considered a game of planning and strategy.
      - n: 2b
        text: The benefits of playing chess, including developing critical thinking skills, concentration skills, and decision-making skills, and how these skills can help you in other areas of your life.
      - n: 2c
        text: Sportsmanship and chess etiquette.
  - n: "3"
    updated_2026: true
    text: "Demonstrate to your counselor that you know each of the following. Then, using Scouting EDGE to teach someone who does not know how to play chess:"
    children:
      - n: 3a
        text: The name of each chess piece
      - n: 3b
        text: How to set up a chessboard
      - n: 3c
        text: "How each chess piece moves and captures, including: four rules of castling, en passant captures, pawn promotion, check, ways to get out of check, and checkmate."
      - n: 3d
        text: The five ways a game can end in a draw.
  - n: "4"
    updated_2026: true
    text: "Do the following:"
    children:
      - n: 4a
        text: Demonstrate scorekeeping using the algebraic system of chess notation.
      - n: 4b
        text: Discuss the differences between the opening, the middle game, and the endgame.
      - n: 4c
        text: "Explain four opening principles. Demonstrate for your counselor the first five moves of the following openings: Ruy Lopez, French Defense, Queen’s Gambit Declined, Sicilian Defense."
      - n: 4d
        text: On a chessboard, demonstrate Scholar's Mate, Fool's Mate, Légal Mate, Fried Liver Attack, and Noah’s Ark Trap.
  - n: "5"
    updated_2026: true
    text: "Do the following:"
    children:
      - n: 5a
        text: "Explain four of the following elements of chess strategy: exploiting weaknesses, force, king safety, pawn structure, space, tempo, clock management."
      - n: 5b
        text: "Explain any five of these chess tactics: clearance sacrifice, decoy, discovered attack, double check, double attack, fork, interposing, overloading, overprotecting, pin, skewer, remove the defender, zwischenzug, and zugzwang."
      - n: 5c
        text: "Set up a chessboard as follows and with White to move first, demonstrate how to force checkmate on the Black king:"
        children:
          - n: 5c1
            text: White on e1, the White rooks on a1 and h1, and the Black king on e5.
          - n: 5c2
            text: White king on e1, White queen on d1, Black king on e5.
          - n: 5c3
            text: White king on e1, White rook on a1, Black king on e5.
      - n: 5d
        text: "With White king on d4, White pawn on e3, and Black king on e6:"
        children:
          - n: 5d1
            text: With White to move, demonstrate how White can force Black to allow his pawn to reach the last rank and be promoted to a queen.
          - n: 5d2
            text: With Black to move, demonstrate how Black can force a draw.
      - n: 5e
        text: Set up and solve five direct-mate problems provided by your counselor.
  - n: "6"
    updated_2026: true
    text: Explain to your counselor how chess tournaments are run, including the Swiss system tournament format, the round robin tournament format, pairings for each round, time controls, touch move, scoring, and chess ratings.
  - n: "7"
    updated_2026: true
    text: "Do ONE of the following:"
    choose: 1
    children:
      - n: 7a
        text: Play at least three games of chess with other Scouts and/or your counselor. Replay the games from your score sheets and discuss with your counselor how you might have played each game differently.
      - n: 7b
        text: Play in a scholastic (youth) chess tournament and use your score sheets from that tournament to replay your games with your counselor. Discuss with your counselor how you might have played each game differently.
      - n: 7c
        text: Organize and run a chess tournament with at least four players, plus you. Have each competitor play at least two games.
