id: badge:geology
name: Geology
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/geology/
worksheet_url: http://usscouts.org/mb/worksheets/Geology.pdf
requirements:
  - n: "1"
    text: Define geology. Discuss how geologists learn about rock formations. In geology, explain why the study of the present is important to understanding the past.
  - n: "2"
    text: Pick three resources that can be extracted or mined from Earth for commercial use. Discuss with your counselor how each product is discovered and processed.
  - n: "3"
    updated_2026: true
    text: Review a geologic map of your area or an area approved by your counselor, and discuss the different rock types and estimated ages of rocks represented. Determine whether the rocks are sedimentary, metamorphic, or igneous. Explain if the geologic map shows horizontal, folded, faulted, or intrusive rocks, and explain how you arrived at your conclusion.
  - n: "4"
    text: "Do ONE of the following:"
    choose: 1
    children:
      - n: 4a
        text: With your parent or guardian’s and counselor’s approval, visit with a geologist, land-use planner, or civil engineer. Discuss this professional’s work and the tools required in this line of work. Learn about a project that this person is now working on, and ask to see reports and maps created for this project. Discuss with your counselor what you have learned.
      - n: 4b
        text: Find out about three career opportunities available in geology. Pick one and find out the education, training, and experience required for this profession. Discuss this with your counselor, and explain why this profession might interest you.
  - n: "5"
    updated_2026: true
    text: "Do the following:"
    children:
      - n: 5a
        text: Discuss with your counselor the importance of the Leave No Trace Seven Principles and the Outdoor Code as they relate to the study of geology.
      - n: 5b
        text: Explain how you practiced the Leave No Trace Seven Principles and the Outdoor Code while traveling in natural areas and while collecting rock and fossil specimens for this merit badge.
  - n: "6"
    updated_2026: true
    text: "Do ONE of the following:"
    choose: 1
    children:
      - n: 6a
        text: Explore careers related to this merit badge. Research one career to learn about the training and education needed, costs, job prospects, salary, job duties, and career advancement. Your research methods may include -- with your parent or guardian’s permission -- an internet or library search, an interview with a professional in the field, or a visit to a location where people in this career work. Discuss with your counselor both your findings and what about this profession might make it an interesting career.
      - n: 6b
        text: Explore how you could use knowledge and skills from this merit badge to pursue a hobby or healthy lifestyle. Research any training needed, expenses, and organizations that promote or support it. Discuss with your counselor what short-term and long-term goals you might have if you pursued this.
