id: badge:plumbing
name: Plumbing
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/plumbing/
worksheet_url: http://usscouts.org/mb/worksheets/Plumbing.pdf
requirements:
  - n: "1"
    text: "Do the following:"
    children:
      - n: 1a
        text: Describe how a properly working plumbing system protects your family’s health and safety.
      - n: 1b
        text: List five important local health regulations related to plumbing and tell how they protect health and safety.
      - n: 1c
        text: Describe the safety precautions you must take when making home plumbing repairs.
  - n: "2"
    text: "Do the following:"
    children:
      - n: 2a
        text: Make a drawing and explain how a home hot- and cold-water supply system works. Tell how you would make it safe from freezing.
      - n: 2b
        text: Make a drawing and explain the drainage system of the plumbing in a house. Show and explain the use of drains and vents.
  - n: "3"
    text: Show how to use five important plumber’s tools.
  - n: "4"
    text: "Identify and explain the following terms: washer, retaining nut, plunger (rubber force cup), solder, flux, elbow, tee, nipple, coupling, plug, union, trap, drainpipe, water meter."
  - n: "5"
    text: Name the kinds of pipe that are used most often in a plumbing system. Explain why these pipes are used.
  - n: "6"
    text: "Do FOUR of the following, each under the supervision of a knowledgeable adult:"
    choose: 4
    children:
      - n: 6a
        text: "Visit the plumbing section of a hardware store or home center and identify:"
        children:
          - n: 6a1
            text: PVC pipe and fittings
          - n: 6a2
            text: CPVC pipe and fittings
          - n: 6a3
            text: PEX pipe and fittings
          - n: 6a4
            text: Copper pipe and fittings
          - n: 6a5
            text: Steel pipe and fittings
          - n: 6a6
            text: Specialty plumbing tools
      - n: 6b
        text: Cut, clean (debur), PVC or CPVC pipe; solvent weld at least three connections to include a coupling, tee, and elbow.
      - n: 6c
        text: Cut PEX pipe; make at least one connection using either a quick-connect fitting or a crimp fitting (using specialized tools).
      - n: 6d
        text: Solder a copper connection using a gas torch.
      - n: 6e
        text: Replace a kitchen or lavatory faucet.
      - n: 6f
        text: Remove, clean or replace, and reinstall a sink or lavatory drain trap.
      - n: 6g
        text: Properly apply pipe thread tape to a pipe or a plumbing connector.
  - n: "7"
    text: Identify three career opportunities that would use skills and knowledge in plumbing. Pick one and research the training, education, certification requirements, experience, and expenses associated with entering the field. Research the prospects for employment, starting salary, advancement opportunities and career goals associated with this career. Discuss what you learned with your counselor and whether you might be interested in this career.
