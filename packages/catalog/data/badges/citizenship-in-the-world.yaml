id: badge:citizenship-in-the-world
name: Citizenship in the World
edition: 2026
eagle_required: true
official_url: https://www.scouting.org/merit-badges/citizenship-in-the-world/
worksheet_url: http://usscouts.org/mb/worksheets/Citizenship-in-the-World.pdf
requirements:
  - n: "1"
    text: Explain what citizenship in the world means to you and what you think it takes to be a good world citizen.
  - n: "2"
    text: Explain how one becomes a citizen in the United States, and explain the rights, duties, and obligations of U.S. citizenship. Discuss the similarities and differences between the rights, duties, and obligations of U.S. citizens and the citizens of two other countries.
  - n: "3"
    text: "Do the following:"
    children:
      - n: 3a
        text: Pick a current world event. In relation to this current event, discuss with your counselor how a country’s national interest and its relationship with other countries might affect areas such as its security, its economy, its values, and the health of its citizens.
      - n: 3b
        text: Select a foreign country and discuss with your counselor how its geography, natural resources, and climate influence its economy and its global partnerships with other countries.
  - n: "4"
    text: "Do TWO of the following:"
    choose: 2
    children:
      - n: 4a
        text: Explain international law and how it differs from national law. Explain the role of international law and how international law can be used as a tool for conflict resolution.
      - n: 4b
        text: Using resources such as major daily newspapers, the internet (with your parent or guardian’s permission), and news magazines, observe a current issue that involves international trade, foreign exchange, balance of payments, tariffs, and free trade. Explain what you have learned. Include in your discussion an explanation of why countries must cooperate in order for world trade and global competition to thrive.
      - n: 4c
        text: Select TWO of the following organizations and describe their role in the world.
        choose: 2
        children:
          - n: 4c1
            text: United Nations and United Nations Children’s Fund (UNICEF)
          - n: 4c2
            text: International Court of Justice (The World Court)
          - n: 4c3
            text: International Criminal Police Organization (Interpol)
          - n: 4c4
            text: World Organization of the Scout Movement
          - n: 4c5
            text: World Health Organization (WHO)
          - n: 4c6
            text: Amnesty International
          - n: 4c7
            text: International Federation of Red Cross and Red Crescent Societies (IFRC)
          - n: 4c8
            text: Cooperative for American Relief Everywhere (CARE)
          - n: 4c9
            text: European Union
  - n: "5"
    text: "Do the following:"
    children:
      - n: 5a
        text: Discuss the differences between constitutional and nonconstitutional governments.
      - n: 5b
        text: Name at least five different types of governments currently in power in the world.
      - n: 5c
        text: Show on a world map countries that use each of these five different forms of government.
  - n: "6"
    updated_2026: true
    text: "Do the following:"
    children:
      - n: 6a
        text: Explain how a government is represented abroad and how the United States government is accredited to international organizations.
      - n: 6b
        text: "Describe the roles of the following in the conduct of foreign relations: ambassador, consul, Bureau of Global Public Affairs, United States and Foreign Commercial Service."
      - n: 6c
        text: Explain the purpose of a passport and visa for international travel.
  - n: "7"
    text: "Do TWO of the following (with your parent or guardian’s permission) and share with your counselor what you have learned:"
    choose: 2
    children:
      - n: 7a
        text: Visit the website of the U.S. State Department. Learn more about an issue you find interesting that is discussed on this website.
      - n: 7b
        text: Visit the website of an international news organization or foreign government, OR examine a foreign newspaper available at your local library, bookstore, or newsstand. Find a news story about a human right realized in the United States that is not recognized in another country.
      - n: 7c
        text: Visit with a student or Scout from another country and discuss the typical values, holidays, ethnic foods, and traditions practiced or enjoyed there.
      - n: 7d
        updated_2026: true
        text: Attend or participate in a World Organization of the Scouting Movement (WOSM) event such as the World Scout Jamboree, World Scout Moot, World Scout Congress, Jamboree Over The Air, or Jamboree Over The Internet. Attendance at a national or regional Jamboree sponsored by a WOSM- National Scout Organization is also allowed.
      - n: 7e
        text: Participate in or attend an international event in your area, such as an ethnic festival, concert, or play.
