id: badge:electricity
name: Electricity
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/electricity/
worksheet_url: http://usscouts.org/mb/worksheets/Electricity.pdf
requirements:
  - n: "1"
    text: "Demonstrate that you know how to respond to electrical emergencies by doing the following:"
    children:
      - n: 1a
        text: Explain how to turn off power for a particular circuit and the whole house in the event of an emergency.
      - n: 1b
        text: Demonstrate how to rescue a person touching a live wire in the home.
      - n: 1c
        text: Describe how to safely get out of a car in an accident if you suspect a utility wire is on the car.
      - n: 1d
        text: Show how to render first aid to a person who is unconscious from an apparent electrical shock.
      - n: 1e
        text: Show how to treat an electrical burn.
      - n: 1f
        text: Explain what to do in the event of an electrical fire.
      - n: 1g
        text: Explain what to do if caught out in the open during an electrical storm.
  - n: "2"
    text: Complete an electrical home safety inspection of your home, using the checklist found in the Electricity pamphlet or one approved by your counselor. Discuss what you find with your counselor.
  - n: "3"
    text: Make a simple electromagnet and use it to show magnetic attraction and repulsion.
  - n: "4"
    text: "Do the following:"
    children:
      - n: 4a
        text: Explain the difference between direct current and alternating current, the advantages and disadvantages of each, and give a practical example of the use of each type.
      - n: 4b
        text: Explain three ways that electricity is produced.
  - n: "5"
    text: Make a simple drawing to show how a battery and an electric bell work. Describe the purpose of each of the components.
  - n: "6"
    text: "Do the following:"
    children:
      - n: 6a
        text: Define what overloading an electric circuit means. Tell what you have done to make sure your home circuits are not overloaded.
      - n: 6b
        text: Determine if there is an overload on a branch circuit by either getting the current draw from all the equipment plugged into the circuit or use the power equation to calculate the current draws.
      - n: 6c
        text: Explain why a fuse blows and a circuit breaker trips.
      - n: 6d
        text: Tell how to find a blown fuse and a tripped circuit breaker in your home. Show how to safely reset the circuit breaker.
  - n: "7"
    text: Make a floor plan wiring diagram of the lights, switches, and outlets for a room in your home. Show which fuse or circuit breaker protects each one.
  - n: "8"
    text: "Do the following:"
    children:
      - n: 8a
        text: Read a meter associated with an electric bill. Determine the total power used since the bill, and the cost of that power.
      - n: 8b
        text: Explain other charges on the bill that were taxes or fees.
      - n: 8c
        text: Discuss with your counselor five ways your family can conserve energy.
  - n: "9"
    text: Explain the following
    children:
      - n: 9a
        text: "Electrical terms: Current, energy, power, resistance, voltage"
      - n: 9b
        text: "Units of measure: Ampere (amps), ohms, volts, watts, watt-hours"
      - n: 9c
        text: "Electrical conditions: Generating source with example, ground, open circuit, overvoltage, potential difference, short circuit"
      - n: 9d
        text: "Equipment and its use: Circuit, conductor, ground fault circuit interrupter (GFCI), insulator, inverter, rectifier, rheostat, substation, surge protection, solar panel, transformer, transmission and distribution systems, wind turbine."
  - n: "10"
    text: "Do TWO of the following:"
    choose: 2
    children:
      - n: 10a
        text: Connect a buzzer, bell, or light with a battery. Have a key or switch in the line.
      - n: 10b
        text: Make and run a simple electric motor (from a kit is acceptable, if approved by your counselor ahead of time).
      - n: 10c
        text: Build a simple rheostat. Show that it works.
      - n: 10d
        text: Build a single-pole, double-throw switch. Show that it works.
      - n: 10e
        text: Explain how 3-way switch wiring works in a lighting circuit.
      - n: 10f
        text: Connect two lights together in a series circuit along with a battery and a switch. Then connect the same circuit in parallel. Discuss the differences in the two circuits.
  - n: "11"
    text: Identify three career opportunities that would use skills and knowledge in electricity. Pick one and research the training, education, certification requirements, experience, and expenses associated with entering the field. Research the prospects for employment, starting salary, advancement opportunities and career goals associated with this career. Discuss what you learned with your counselor and whether you might be interested in this career.
