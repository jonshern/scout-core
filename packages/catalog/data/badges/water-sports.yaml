id: badge:water-sports
name: Water Sports
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/water-sports/
worksheet_url: http://usscouts.org/mb/worksheets/Water-Sports.pdf
requirements:
  - n: "1"
    text: "Do the following:"
    children:
      - n: 1a
        text: Explain to your counselor the most likely hazards you may encounter while participating in water sports activities and what you should do to anticipate, help prevent, mitigate, and respond to these hazards.
      - n: 1b
        text: "Review prevention, symptoms, and first-aid treatment for the following injuries or illnesses that could occur while participating in water sports: blisters, cold-water shock and hypothermia, dehydration, heat-related illnesses, sunburn, sprains, strains, minor cuts and bruises, spinal injury, and concussions and head trauma."
      - n: 1c
        text: Review the Scouting America Safety Afloat policy. Tell how it applies to water sports.
  - n: "2"
    text: "Do the following:"
    children:
      - n: 2a
        text: Discuss with your counselor the characteristics of life jackets most appropriate for water sports, and tell why one must always be worn while waterskiing or wakeboarding. Then demonstrate how to select and fit a life jacket for water sports activities.
      - n: 2b
        text: Review and discuss the Water Sports Safety Code with your counselor. Promise that you will live up to it and follow it in all water work for this merit badge. Review the safety precautions that must be used by the boat operator in pulling waterskiers and wakeboarders.
  - n: "3"
    updated_2026: true
    text: "Before doing requirements 4 through 6, successfully complete the Scouting America swimmer test. Note: See the Swimming merit badge pamphlet for details about the Scouting America swimmer test."
  - n: "4"
    text: "Show the following skier signals to the safety observer in the boat: skier safe, faster, slower, turns, back to dock, cut motor, skier in water."
  - n: "5"
    text: "Showing reasonable control while using two skis, one ski, or a wakeboard, do the following:"
    children:
      - n: 5a
        text: Show how to enter the water from a boat and make a deepwater start without help.
      - n: 5b
        text: Starting from outside the wakes, show you can cross both wakes four times and return to the center of the wake each time without falling.
      - n: 5c
        text: Show you can fall properly to avoid an obstacle. Also show that you can drop handle and coast to a stop without losing your balance.
  - n: "6"
    text: While on shore, show that you know how to properly adjust the bindings of your ski(s) or wakeboard to fit yourself. Then, in deep water, show you can adjust bindings to fit. Recover and put on your ski(s) or wakeboard that has come off during a fall.
