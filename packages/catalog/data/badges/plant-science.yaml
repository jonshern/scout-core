id: badge:plant-science
name: Plant Science
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/plant-science/
worksheet_url: http://usscouts.org/mb/worksheets/Plant-Science.pdf
requirements:
  - n: "1"
    text: Make a drawing and identify five or more parts of a flowering plant. Tell what each part does.
  - n: "2"
    text: Explain photosynthesis and tell why this process is important. Tell at least five ways that humans depend on plants.
  - n: "3"
    text: Explain how honeybees and other pollinating insects are important to plant life.
  - n: "4"
    text: Explain how water, light, air, temperature, and pests affect plants. Describe the nature and function of soil and explain its importance. Tell about the texture, structure, and composition of fertile soil. Tell how soil may be improved.
  - n: "5"
    text: Tell how to propagate plants by seeds, roots, cuttings, tubers, and grafting. Grow a plant by ONE of these methods.
  - n: "6"
    text: List by common name at least 10 native plants and 10 cultivated plants that grow near your home. List five invasive non-native plants in your area and tell how they may be harmful. Tell how the spread of invasive plants may be avoided or controlled in ways that are not damaging to humans, wildlife, and the environment.
  - n: "7"
    updated_2026: true
    text: "Do ONE of the following:"
    choose: 1
    children:
      - n: 7a
        text: Explore careers related to this merit badge. Research one career to learn about the training and education needed, costs, job prospects, salary, job duties, and career advancement. Your research methods may include-with your parent or guardian’s permission-an internet or library search, an interview with a professional in the field, or a visit to a location where people in this career work. Discuss with your counselor both your findings and what about this profession might make it an interesting career.
      - n: 7b
        text: Explore how you could use knowledge and skills from this merit badge to pursue a hobby or healthy lifestyle. Research any training needed, expenses, and organizations that promote or support it. Discuss with your counselor what short-term and long-term goals you might have if you pursued this.
  - n: "8"
    text: "Choose ONE of the following options and complete each requirement:"
    choose: 1
    options:
      - key: A
        name: Agronomy
      - key: B
        name: Horticulture
      - key: C
        name: Field Botany
    children:
      - n: 8a-optA
        option: A
        text: Describe how to prepare a seedbed.
      - n: 8b-optA
        option: A
        text: "Make and use a seed germination tester to test 50 seeds of four of the following plants: corn, cotton, alfalfa, soybeans, clover, wheat, rice, rye, barley. Determine the percentage of live seeds."
      - n: 8c-optA
        option: A
        text: "Explain one important insect pest and one important disease that damage each of the following: corn, small grains, cotton. Collect and name five weeds that compete with crops in your locality. Tell how to control these weeds without harming people, wildlife, or useful insects."
      - n: 8d-optA
        option: A
        text: On a map of the United States, identify the chief regions where corn, cotton, forage crops, small grain crops, and oil crops grow. Tell how climate and location of these regions make them leaders in the production of these crops.
      - n: 8e-optA
        option: A
        text: "Complete ONE of the following alternatives:"
        children:
          - n: 8e-optA1
            text: "Corn: (a) Grow a plot of corn and have your plot inspected by your counselor. Record seed variety or experimental code number. (b) Tell about modern methods of commercial corn farming and the contributions that corn makes to today’s food and fuel supply. (c) Tell about an insect that can damage corn, and explain how it affects corn production and how it is controlled."
          - n: 8e-optA2
            text: "Cotton: (a) Grow a plot of cotton and have your plot inspected by your counselor. (b) Tell about modern methods of commercial cotton farming, and about the uses of cotton fiber and seed and the economic value of this crop. (c) Tell about an insect that can damage cotton, and explain how it affects cotton production and how it is controlled."
          - n: 8e-optA3
            text: "Forage Crops: (a) Collect, count, and label samples of each for display: perennial grasses, annual grasses, legumes, and broadleaf weeds. Indicate how each grass and legume is used. Keep a log of the site where you found each sample and share it with your counselor. (b) Explain how legumes can be used to enrich the soil and how they may deplete it under certain conditions. Explain how livestock may enrich or deplete the soil. (c) Name five poisonous plants that are dangerous to livestock, and tell the different ways of using forage crops as feed for livestock."
          - n: 8e-optA4
            text: "Small Grains: (a) Give production figures for small grain crops listed in the U.S. Statistical Report or Agricultural Statistics Handbook for the latest year available. (b) Help in harvesting a crop of grain. Tell how to reduce harvesting losses and about modern methods of growing one small grain crop. (c) Visit a grain elevator, flour mill, cereal plant, feed or seed company. Talk with the operator. Take notes, and describe the processes used and tell your patrol, troop, or class about your visit."
          - n: 8e-optA5
            text: "Oil Crops: (a) Grow a plot of soybeans and have your plot inspected by your counselor. (b) Tell about modern methods of growing soybeans on a commercial scale, and discuss the contributions soybeans make to our food supply. (c) Explain why a hard frost can be dangerous to soybeans just after emergence."
        choose: 1
      - n: 8a-optB
        option: B
        text: "Visit one of the following places and tell what you learned about horticulture there: public garden, arboretum, retail nursery, wholesale nursery, production greenhouse, or conservatory greenhouse."
      - n: 8b-optB
        option: B
        text: "Explain the following terms: hardiness zone, shade tolerance, pH, moisture requirement, native habitat, texture, cultivar, ultimate size, disease resistance, habit, evergreen, deciduous, annual, perennial. Find out what hardiness zone you live in and list 10 landscape plants you like that are suitable for your climate, giving the common name and scientific name for each."
      - n: 8c-optB
        option: B
        text: "Do ONE of the following:"
        children:
          - n: 8c-optB1
            text: Explain the difference between vegetative and sexual propagation methods, and tell some horticultural advantages of each. Grow a plant from a stem or root cutting or graft.
          - n: 8c-optB2
            text: Transplant 12 seedlings or rooted cuttings to larger containers and grow them for at least one month.
          - n: 8c-optB3
            text: Demonstrate good pruning techniques and tell why pruning is important.
          - n: 8c-optB4
            text: After obtaining permission, plant a tree or shrub properly in an appropriate site.
        choose: 1
      - n: 8d-optB
        option: B
        text: "Do the following:"
        children:
          - n: 8d-optB1
            text: Explain the importance of good landscape design and selection of plants that are suitable for particular sites and conditions.
          - n: 8d-optB2
            text: Tell why it is important to know how big a plant will grow.
          - n: 8d-optB3
            text: Tell why slower-growing landscape plants are sometimes a better choice than faster-growing varieties.
      - n: 8e-optB
        option: B
        text: "Choose ONE of the following alternatives:"
        children:
          - n: 8e-optB1
            text: "Bedding Plants: (a) Grow bedding plants appropriate for your area in pots or flats from seed or cuttings in a manufactured soil mix. Explain why you chose the mix and tell what is in it. (b) Transplant plants to a bed in the landscape and maintain the bed until the end of the growing season. Record your activities, observations, materials used, and costs. (c) Demonstrate mulching, fertilizing, watering, weeding, and deadheading, and tell how each practice helps your plants. (d) Tell some differences between gardening with annuals and perennials."
          - n: 8e-optB2
            text: "Fruit, Berry, and Nut Crops: (a) Plant five fruit or nut trees, grapevines, or berry plants that are suited to your area. Take full care of fruit or nut trees, grapevines, or berry plants through one season. (b) Prune a tree, vine, or shrub properly. Explain why pruning is necessary. (c) Demonstrate one type of graft and tell why this method is useful. (d) Describe how one fruit, nut, or berry crop is processed for use."
          - n: 8e-optB3
            text: "Woody Ornamentals: (a) Plant five or more trees or shrubs in a landscape setting. Take full care of the trees or shrubs you have planted for one growing season. (b) Prune a tree or shrub properly. Explain why pruning is necessary. (c) List 10 trees (in addition to those listed in general requirement 5 above) and tell your counselor how each is used in the landscape. Give the common and scientific names. (d) Describe the size, texture, color, flowers, leaves, fruit, hardiness, cultural requirements, and any special characteristics that make each type of tree or shrub attractive or interesting. (e) Tell five ways trees help improve the quality of our environment."
          - n: 8e-optB4
            text: "Home Gardening: (a) Design and plant a garden or landscape that is at least 10 by 10 feet. (b) Plant 10 or more different types of plants in your garden. Tell why you selected particular varieties of vegetables and flowers. Take care of the plants in your garden for one season. (c) Demonstrate soil preparation, staking, watering, weeding, mulching, composting, fertilizing, pest management, and pruning. Tell why each technique is used. (d) Tell four types of things you could provide to make your home landscape or park a better place for birds and wildlife. List the common and scientific names of 10 kinds of native plants that are beneficial to birds and wildlife in your area."
        choose: 1
      - n: 8a-optC
        option: C
        updated_2026: true
        text: "Visit a park, forest, Scout camp, or other natural area near your home. While you are there:"
        children:
          - n: 8a-optC1
            text: Determine which species of plants are the largest and which are the most abundant. Note whether they cast shade on other plants.
          - n: 8a-optC2
            text: Using information from maps, textbooks, or the internet, describe the environmental factors that may influence the presence of plants on your site, including latitude, climate, air and soil temperature, soil type and pH, geology, hydrology, and topography.
          - n: 8a-optC3
            text: Record any differences in the types of plants you see at the edge of a forest, near water, in burned areas, or near a road or railroad.
      - n: 8b-optC
        option: C
        updated_2026: true
        text: Select a study site that is at least 100 by 100 feet. Make a list of 10 woody plants (trees and shrubs) and 10 non-woody plants in the study site. Find out which of these are native plants and which are exotic (or nonnative).
      - n: 8c-optC
        option: C
        updated_2026: true
        text: Tell how an identification key works and use a simple key to identify 10 kinds of plants (in addition to those in general requirement 5 above). Tell the difference between common and scientific names and tell why scientific names are important.
      - n: 8d-optC
        option: C
        updated_2026: true
        text: After gaining permission, collect, identify, press, mount, and label 10 different plants that are common in your area. Tell why voucher specimens are important for documentation of a field botanist's discoveries.
      - n: 8e-optC
        option: C
        updated_2026: true
        text: Obtain a list of rare plants of your state. Tell what is being done to protect rare plants and natural areas in your state. Write a paragraph about one of the rare plants in your state.
      - n: 8f-optC
        option: C
        updated_2026: true
        text: "Do ALL of the requirements in ONE of the following alternatives:"
        choose: 1
        children:
          - n: 8f-optC1
            text: "Tree Inventory: (a) Identify the trees of your neighborhood, a park, a section of your town, or a Scout camp. (b) Collect, press, and label leaves, flowers, or fruits to document your inventory. (c) List the types of trees by scientific name and give common names. Note the number and size (diameter at 4 1/2 feet above ground) of trees observed and determine the largest of each species in your study area. (d) Show two or more people how to use a leaf or twig key to identify at least five species of trees or shrubs."
          - n: 8f-optC2
            text: "Transect Study: (a) Visit two sites, at least one of which is different from the one you visited for Field Botany requirement 1. (b) Use the transect method to study the two different kinds of plant communities. The transects should be at least 500 feet long. (c) At each site, record observations about the soil and other influencing factors AND do the following. Then make a graph or chart to show the results of your studies. (1) Identify each tree within 10 feet of the transect line. (2) Measure the diameter of each tree at 4 1/2 feet above the ground, and map and list each tree."
          - n: 8f-optC3
            text: "Nested Plot: (a) Visit two sites, at least one of which is different from the one you visited for Field Botany requirement 1. (b) Mark off nested plots and inventory two different kinds of plant communities. (c) At each site, record observations about the soil and other influencing factors AND do the following. Then make a graph or chart to show the results of your studies. (1) Identify, measure, and map each tree in a 100-by-100-foot plot. (Measure the diameter of each tree larger than 3 inches in diameter at 4 1/2 feet above the ground.) (2) Identify and count all trees and shrubs in a 10-by-10-foot plot within each of the larger areas. (3) Identify and count all broad-leaved plants (trees, shrubs, vines, and herbaceous plants) all plants (wildflowers, ferns, grasses, mosses, etc.) of a 4-by-4-foot plot within the 10-by-10-foot plot."
          - n: 8f-optC4
            text: "Herbarium Visit: (a) Write ahead and arrange to visit an herbarium at a university, park, or botanical garden; OR, visit an herbarium website (with your parent or guardian's permission). (b) Tell how the specimens are arranged and how they are used by researchers. If possible, observe voucher specimens of a plant that is rare in your state. (c) Tell how a voucher specimen is mounted and prepared for permanent storage. Tell how specimens should be handled so that they will not be damaged. (d) Tell about the tools and references used by botanists in an herbarium."
          - n: 8f-optC5
            text: "Plant Conservation Organization Visit: (a) Write ahead and arrange to visit a private conservation organization or government agency that is concerned with protecting rare plants and natural areas. (b) Tell about the activities of the organization in studying and protecting rare plants and natural areas. (c) If possible, visit a nature preserve managed by the organization. Tell about land management activities such as controlled burning, or measures to eradicate invasive (non-native) plants or other threats to the plants that are native to the area."
  - n: "9"
    updated_2026: true
    text: Discuss the importance of the Leave No Trace Seven Principles and the Outdoor Code as they relate to plant science. Explain how you have followed the Leave No Trace Seven Principles and the Outdoor Code while in natural areas during field observation, specimen collection, and identification.
