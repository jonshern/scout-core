id: badge:insect-study
name: Insect Study
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/insect-study/
worksheet_url: http://usscouts.org/mb/worksheets/Insect-Study.pdf
requirements:
  - n: "1"
    text: "Safety. Do the following:"
    children:
      - n: 1a
        text: Explain to your counselor the most likely hazards associated with exposure to ants and bees and what you should do to anticipate, help prevent, mitigate, and respond to these hazards.
      - n: 1b
        text: Discuss the prevention of and treatment for health concerns that could occur while working with ants and bees, including insect bites and anaphylactic shock.
  - n: "2"
    text: "Anatomy. Do the following:"
    children:
      - n: 2a
        text: Tell how insects are different from other animals.
      - n: 2b
        text: Show how insects are different from millipedes and spiders.
      - n: 2c
        text: Point out and name the main parts of an insect.
      - n: 2d
        text: Describe the characteristics that distinguish the major orders of insects.
  - n: "3"
    text: "Life Cycles. Do the following:"
    children:
      - n: 3a
        text: Compare the life histories of a butterfly and a grasshopper. Tell how they are different.
      - n: 3b
        text: Raise an insect through complete metamorphosis from its larval stage to its adult stage (e.g., raise a butterfly or moth from a caterpillar). (Some insects are endangered species and are protected by federal or state law. Every species is found only in its own special type of habitat. Be sure to check natural resources authorities in advance to be sure that you will not be collecting any species that is known to be protected or endangered, or in any habitat where collecting is prohibited. In most cases, all specimens should be returned at the location of capture after the requirement has been met. Check with your counselor for those instances where the return of these specimens would not be appropriate.)
  - n: "4"
    text: "Observation and Analysis. Do the following:"
    children:
      - n: 4a
        text: Discuss the importance of the Leave No Trace Seven Principles and the Outdoor Code as they relate to insect study. Explain how you have followed the Leave No Trace Seven Principles and the Outdoor Code during field observation, specimen collection, and identification.
      - n: 4b
        text: Observe 20 different live species of insects in their habitat. In your observations, include at least four orders of insects.
      - n: 4c
        text: Make a scrapbook of the 20 insects you observe in 5(b) Include photographs, sketches, illustrations, and articles. Label each insect with its common and scientific names, where possible. Share your scrapbook with your merit badge counselor.
      - n: 4d
        text: From your scrapbook collection, select eight species of insects and identify what role they play in the ecosystem.
  - n: "5"
    text: "Social Insects. Do the following:"
    children:
      - n: 5a
        text: Tell things that make social insects different from solitary insects.
      - n: 5b
        text: "Do ONE of the following:"
        choose: 1
        children:
          - n: 5b1
            text: Observe an ant colony in a formicarium (ant farm). Find the queen and worker ants. Explain to your counselor the different chambers found within an ant colony.
          - n: 5b2
            text: Study a hive of bees. Remove the combs and find the queen. Estimate the amount of brood and count the number of queen cells. Explain how to determine the amount of honey in the hive. (If you are allergic to bee stings, pick option 1 above.)
  - n: "6"
    text: "Ecology. Do the following:"
    children:
      - n: 6a
        text: Tell how insects fit in the food web of other insects, fish, birds, and mammals.
      - n: 6b
        text: Explain the role insects serve as pollinators for plants.
  - n: "7"
    text: "Insects and People. Do the following:"
    children:
      - n: 7a
        text: Explain the symbiotic relationship between bees and humankind. Explain what colony collapse disorder (CCD) is and some of the possible causes. Discuss how CCD affects our food supply.
      - n: 7b
        text: Describe three alternatives to insecticides as a way of preventing crop injury and subsequent yield loss. Explain the advantages and disadvantages of these alternatives.
  - n: "8"
    text: "Conservation. Do the following:"
    children:
      - n: 8a
        text: Tell the migration route of an insect (e.g., monarch butterfly). Discuss the challenges they face and how Scouts can contribute to their success.
      - n: 8b
        text: Find out about an insect that is a threatened or endangered species. Discuss the challenges they face and how Scouts can contribute to their success.
  - n: "9"
    text: "Careers and Hobbies. Do ONE of the following:"
    choose: 1
    children:
      - n: 9a
        text: Identify three career opportunities that would use skills and knowledge in Insect Study. Pick one and research the training, education, certification requirements, experience, and expenses associated with entering the field. Research the prospects for employment, starting salary, advancement opportunities and career goals associated with this career. Discuss what you learned with your counselor and whether you might be interested in this career.
      - n: 9b
        text: Identify how you might use the skills and knowledge in Insect Study to pursue a personal hobby. Research the additional training required, expenses, and affiliation with organizations that would help you maximize the enjoyment and benefit you might gain from it. Discuss what you learned with your counselor and share what short-term and long-term goals you might have if you pursued this.
