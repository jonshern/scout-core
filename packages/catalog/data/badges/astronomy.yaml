id: badge:astronomy
name: Astronomy
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/astronomy/
worksheet_url: http://usscouts.org/mb/worksheets/Astronomy.pdf
requirements:
  - n: "1"
    text: "Do the following:"
    children:
      - n: 1a
        text: Explain to your counselor the most likely hazards you may encounter while participating in astronomy activities, and what you should do to anticipate, help prevent, mitigate, and respond to these hazards.
      - n: 1b
        text: Explain first aid for injuries or illnesses such as heat and cold reactions, dehydration, bites and stings, and damage to your eyes that could occur during observations.
      - n: 1c
        text: Describe the proper clothing and other precautions for safely making observations at night and in cold weather.
      - n: 1d
        text: Explain how to safely observe the Sun, objects near the Sun and solar eclipses.
  - n: "2"
    text: Explain what light pollution is and how it and air pollution affect astronomy.
  - n: "3"
    text: "With the aid of diagrams (or real telescopes if available), do the following:"
    children:
      - n: 3a
        text: Explain why binoculars and telescopes are important astronomical tools. Demonstrate or explain how these tools are used.
      - n: 3b
        text: Describe the similarities and differences of several types of astronomical telescopes, including at least one that observes light beyond the visible part of the spectrum (i.e., radio, X-ray, ultraviolet, or infrared).
      - n: 3c
        text: Explain the purposes of three instruments used with astronomical telescopes.
      - n: 3d
        text: Describe the proper care and storage of telescopes and binoculars both at home and in the field.
  - n: "4"
    text: "Do the following (if instruction is done in a planetarium, Scouts must still identify the required stars and constellations outside under the natural night sky):"
    children:
      - n: 4a
        text: Identify in the sky at least 10 constellations, at least four of which are in the zodiac.
      - n: 4b
        text: Identify in the sky at least eight conspicuous stars, five of which are of magnitude 1 or brighter.
      - n: 4c
        text: Make two sketches of the Big Dipper or Cassiopeia from direct observation. In one sketch, show the Big Dipper’s or Cassiopeia’s orientation in the early evening sky. Make another sketch, showing its position several hours later. In both sketches, show the North Star and the horizon. Record the date and time each sketch was made.
      - n: 4d
        text: Explain what we see when we look at the Milky Way.
  - n: "5"
    text: "Do the following:"
    children:
      - n: 5a
        text: List the names of the five most visible planets. Explain which ones can appear in phases similar to lunar phases and which ones cannot, and explain why.
      - n: 5b
        text: Using the internet (with your parent or guardian’s permission) and other resources, find out when each of the five most visible planets that you identified in requirement 5(a) will be observable in the evening sky during the next 12 months, then compile this information in the form of a chart or table.
      - n: 5c
        text: Describe the motion of the planets across the sky.
      - n: 5d
        text: Observe a planet and describe what you saw.
  - n: "6"
    text: "Do the following:"
    children:
      - n: 6a
        text: Sketch the face of the Moon and indicate five seas and five craters. Label these landmarks.
      - n: 6b
        text: Sketch the phase and position of the Moon, at the same hour and place, for four nights (or days) within a one-week period by direct observation. Include landmarks on the horizon such as hills, trees, and buildings. Explain the changes you observe.
      - n: 6c
        text: List the factors that keep the Moon in orbit around Earth.
      - n: 6d
        text: With the aid of diagrams, explain the relative positions of the Sun, Earth, and the Moon at the times of lunar and solar eclipses, and at the times of new, first-quarter, full, and last-quarter phases of the Moon.
  - n: "7"
    text: "Do the following:"
    children:
      - n: 7a
        text: Describe the composition of the Sun, its relationship to other stars, and some effects of its radiation on Earth’s weather and communications.
      - n: 7b
        text: Define sunspots and describe some of the effects they may have on solar radiation.
      - n: 7c
        text: Identify at least one red star, one blue star, and one yellow star (other than the Sun). Explain the meaning of these colors.
  - n: "8"
    text: "With your counselor’s approval and guidance, do ONE of the following:"
    choose: 1
    children:
      - n: 8a
        text: "Visit a planetarium or astronomical observatory. Submit a written report, a scrapbook, OR a video presentation afterward to your counselor that includes the following information:"
        children:
          - n: 8a1
            text: Activities occurring there
          - n: 8a2
            text: Exhibits and displays you saw
          - n: 8a3
            text: Telescopes and other instruments being used
          - n: 8a4
            text: Celestial objects you observed
      - n: 8b
        text: Plan and participate in an observation session that includes using binoculars or a telescope and includes at least 10 celestial objects beyond those observed in requirement 4. These might be lunar features, Messier objects, additional constellations or planets, or artificial satellites including the International Space Station. List the celestial objects you want to observe and find each in a star chart, guidebook or by using an app. Prepare a log or notebook. Discuss with your counselor what you hope to observe prior to your observation session. Review your log or notebook with your counselor afterward.
      - n: 8c
        text: Plan and host a star party for your Scout troop or other group such as your class at school. Use binoculars or a telescope to show and explain celestial objects to the group.
      - n: 8d
        text: Help an astronomy club in your community hold a star party that is open to the public.
      - n: 8e
        text: Personally take a series of photographs or digital images of the movement of the Moon, a planet, an asteroid, meteor, or a comet. In your visual display, label each image and include the date and time it was taken. Show all positions on a star chart or map. Show your display at school or at a troop meeting. Explain the changes you observed.
      - n: 8f
        text: With your parent or guardian and counselor’s approval, use online observing opportunities such as SkyNet to observe planets, comets, galaxies, and/or the sun. Describe your experience to your counselor.
  - n: "9"
    text: "Do ONE of the following:"
    choose: 1
    children:
      - n: 9a
        text: Identify three career opportunities that would use skills and knowledge in astronomy. Pick one and research the training, education, certification requirements, experience, and expenses associated with entering the field. Research the prospects for employment, starting salary, advancement opportunities and career goals associated with this career. Discuss what you learned with your counselor and whether you might be interested in this career.
      - n: 9b
        text: Identify how you might use the skills and knowledge in astronomy to pursue a personal hobby. Research the additional training required, expenses, and affiliation with organizations that would help you maximize the enjoyment and benefit you might gain from it. Discuss what you learned with your counselor and share what short-term and long-term goals you might have if you pursued this.
