id: badge:personal-management
name: Personal Management
edition: 2026
eagle_required: true
official_url: https://www.scouting.org/merit-badges/personal-management/
worksheet_url: http://usscouts.org/mb/worksheets/Personal-Management.pdf
requirements:
  - n: "1"
    text: "Do the following:"
    children:
      - n: 1a
        text: Choose an item that your family might want to purchase that is considered a major expense.
      - n: 1b
        text: Write a plan that tells how your family would save money for the purchase identified in requirement 1(a).
        children:
          - n: 1b1
            text: Discuss the plan with your counselor.
          - n: 1b2
            text: Discuss the plan with your family.
          - n: 1b3
            text: Discuss how other family needs must be considered in this plan.
      - n: 1c
        text: Develop a written shopping strategy for the purchase identified in requirement 1(a).
        children:
          - n: 1c1
            text: Determine the quality of the item or service (using consumer publications or ratings systems).
          - n: 1c2
            text: Comparison shop for the item. Find out where you can buy the item for the best price. (Provide prices from at least two different price sources.) Call around; study ads. Look for a sale or discount coupon. Consider alternatives. Can you buy the item used? Should you wait for a sale?
  - n: "2"
    text: "Do the following:"
    children:
      - n: 2a
        text: Prepare a budget reflecting your expected income (allowance, gifts, wages), expenses, and savings for a period of 13 consecutive weeks.
      - n: 2b
        text: Compare expected income with expected expenses.
        children:
          - n: 2b1
            text: If expenses exceed budget income, determine steps to balance your budget.
          - n: 2b2
            text: If income exceeds budget expenses, state how you would use the excess money (new goal, savings).
      - n: 2c
        text: Track and record your actual income, expenses, and savings for 13 consecutive weeks (the same 13-week period for which you budgeted). (You may use the forms provided in the Personal Management pamphlet, devise your own, or use a computer-generated version.) When complete, present the records showing the results to your counselor.
      - n: 2d
        text: Compare your budget with your actual income and expenses to understand when your budget worked and when it did not work. With your counselor, discuss what you might do differently the next time.
  - n: "3"
    text: "Discuss with your counselor FIVE of the following concepts:"
    children:
      - n: 3a
        text: The emotions you feel when you receive money.
      - n: 3b
        text: Your understanding of how the amount of money you have with you affects your spending habits.
      - n: 3c
        text: Your thoughts when you buy something new and your thoughts about the same item three months later. Explain the concept of buyer’s remorse.
      - n: 3d
        text: How hunger affects you when shopping for food items (snacks, groceries).
      - n: 3e
        text: Your experience of an item you have purchased after seeing or hearing advertisements for it. Did the item work as well as advertised?
      - n: 3f
        text: Your understanding of what happens when you put money into a savings account.
      - n: 3g
        text: Charitable giving. Explain its purpose and your thoughts about it.
      - n: 3h
        text: What you can do to better manage your money.
  - n: "4"
    text: "Explain the following to your counselor:"
    children:
      - n: 4a
        text: The differences between saving and investing, including reasons for using one over the other.
      - n: 4b
        text: The concepts of return on investment and risk and how they are related.
      - n: 4c
        text: The concepts of simple interest and compound interest.
      - n: 4d
        text: The concept of diversification in investing.
      - n: 4e
        text: Why it is important to save and invest for retirement.
  - n: "5"
    text: "Explain to your counselor what the following investments are and how each works:"
    children:
      - n: 5a
        text: Common stocks
      - n: 5b
        text: Mutual funds
      - n: 5c
        text: Life insurance
      - n: 5d
        text: A certificate of deposit (CD)
      - n: 5e
        text: A savings account
      - n: 5f
        text: A U.S. savings bond
  - n: "6"
    text: "Explain to your counselor why people might purchase the following types of insurance and how they work:"
    children:
      - n: 6a
        text: Automobile
      - n: 6b
        text: Health
      - n: 6c
        text: Homeowner’s/renter’s
      - n: 6d
        text: Whole life and term life
  - n: "7"
    text: "Explain to your counselor the following:"
    children:
      - n: 7a
        text: What a loan is, what interest is, and how the annual percentage rate (APR) measures the true cost of a loan.
      - n: 7b
        text: The different ways to borrow money.
      - n: 7c
        text: The differences between a charge card, debit card, and credit card. What are the costs and pitfalls of using these financial tools? Explain why it is unwise to make only the minimum payment on your credit card. Always be sure to have proper permission before using the internet. It is strongly advised that Scouts view the Personal Safety Awareness videos before starting work. Find details at www. scouting.org/training/youth-protection/scouts-bsa
      - n: 7d
        text: Credit reports and how personal responsibility can affect your credit report.
      - n: 7e
        text: Ways to reduce or eliminate debt.
  - n: "8"
    text: "Demonstrate to your counselor your understanding of time management by doing the following:"
    children:
      - n: 8a
        text: Write a “to do” list of tasks or activities, such as homework assignments, chores, and personal projects, that must be done in the coming week. List these in order of importance to you.
      - n: 8b
        text: Make a seven-day calendar or schedule. Put in your set activities, such as school classes, sports practices or games, jobs or chores, and/or Scout or place of worship or club meetings, then plan when you will do all the tasks from your “to do” list between your set activities.
      - n: 8c
        text: Follow the one-week schedule you planned. Keep a daily diary or journal during each of the seven days of this week’s activities, writing down when you completed each of the tasks on your “to do” list compared to when you scheduled them.
      - n: 8d
        text: With your counselor, review your “to do” list, one-week schedule, and diary/journal to understand when your schedule worked and when it did not work. Discuss what you might do differently the next time.
  - n: "9"
    text: Prepare a written project plan demonstrating the steps below, including the desired outcome. This is a project on paper, not a real-life project. Examples could include planning a camping trip, developing a community service project or a school or religious event, or creating an annual patrol plan with additional activities not already included in the troop annual plan. Discuss your completed project plan with your counselor.
    children:
      - n: 9a
        text: Define the project. What is your goal?
      - n: 9b
        text: Develop a timeline for your project that shows the steps you must take from beginning to completion.
      - n: 9c
        text: Describe your project.
      - n: 9d
        text: Develop a list of resources. Identify how these resources will help you achieve your goal.
      - n: 9e
        text: Develop a budget for your project.
  - n: "10"
    text: "Do the following:"
    children:
      - n: 10a
        text: Choose a career you might want to enter after high school or college graduation. Discuss with your counselor the needed qualifications, education, skills, and experience.
      - n: 10b
        text: Explain to your counselor what the associated costs might be to pursue this career, such as tuition, school or training supplies, and room and board. Explain how you could prepare for these costs and how you might make up for any shortfall.
