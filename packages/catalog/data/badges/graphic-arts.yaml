id: badge:graphic-arts
name: Graphic Arts
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/graphic-arts/
worksheet_url: http://usscouts.org/mb/worksheets/Graphic-Arts.pdf
requirements:
  - n: "1"
    text: "Review with your counselor the processes for producing printed communications: offset lithography, screen printing, electronic/digital, relief, and gravure. Collect samples of three products, each one produced using a different printing process, or draw diagrams to help you with your description."
  - n: "2"
    text: Explain the differences between continuous tone, line, and halftone artwork. Describe how digital images can be created and/or stored in a computer.
  - n: "3"
    updated_2026: true
    text: Design a printed piece (flyer, T-shirt, program, form, etc.). Explain your decisions for the typeface or typefaces you use and the way you arrange the elements in your design. Explain which printing process is best suited for printing your design. If desktop publishing is available, identify what hardware and software would be appropriate for outputting your design.
  - n: "4"
    text: "Produce the design you created for requirement 3 using one of the following printing processes:"
    children:
      - n: 4a
        text: Offset lithography Make a layout, and produce a plate using a process approved by your counselor. Run the plate and print at least 50 copies.
      - n: 4b
        text: Screen printing Make a hand-cut or photographic stencil and attach it to a screen that you have prepared. Mask the screen and print at least 20 copies.
      - n: 4c
        text: Electronic/digital printing Create a layout in electronic form, download it to the press or printer, and run 50 copies. If no electronic interface to the press or printer is available, you may print and scan a paper copy of the layout.
      - n: 4d
        text: Relief printing Prepare a layout or set the necessary type. Make a plate or lock up the form. Use this to print 50 copies.
  - n: "5"
    updated_2026: true
    text: "Postpress Operations. Do the following:"
    children:
      - n: 5a
        text: Discuss the finishing operations of padding, drilling, cutting, and trimming with your counselor.
      - n: 5b
        text: "Collect, describe, or identify examples of the following types of binding: perfect, spiral, plastic comb, saddle stitch, and case."
  - n: "6"
    updated_2026: true
    text: Do ONE of the following, and then describe the highlights of your visit with your counselor.
    choose: 1
    children:
      - n: 6a
        text: Visit a newspaper printing plant. Follow a story from the editor to the press.
      - n: 6b
        text: Visit a retail, commercial, or in-plant printing facility. Follow a project from beginning to end.)
      - n: 6c
        text: Visit a school's graphic arts program. Find out what courses are available and what the prerequisites are.
      - n: 6d
        text: With your parent or guardian's permission, visit three websites that belong to graphic arts professional organizations and/or printing-related companies (suppliers, manufacturers, printers). Print out or download product or service information from two of the sites.
  - n: "7"
    text: Find out about three career opportunities in graphic arts. Pick one and find out the education, training, and experience required for this profession. Discuss this with your counselor, and explain why this profession might interest you.
