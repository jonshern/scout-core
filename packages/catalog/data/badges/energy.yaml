id: badge:energy
name: Energy
edition: 2026
eagle_required: false
official_url: https://www.scouting.org/merit-badges/energy/
worksheet_url: http://usscouts.org/mb/worksheets/Energy.pdf
requirements:
  - n: "1"
    text: "Do the following:"
    children:
      - n: 1a
        text: With your parent or guardian’s permission, use the internet to find a blog, podcast, website, or an article on the use or conservation of energy. Discuss with your counselor what details in the article were interesting to you, the questions it raises, and what ideas it addresses that you do not understand.
      - n: 1b
        text: After you have completed requirements 2 through 8, revisit your source for requirement 1(a). Explain to your counselor what you have learned in completing the requirements that helps you better understand the article.
  - n: "2"
    text: "Show you understand energy forms and conversions by doing the following:"
    children:
      - n: 2a
        text: "Explain how THREE of the following devices use energy, and explain their energy conversions: toaster, greenhouse, lightbulb, bow drill, cell phone, nuclear reactor, sauna, electric vehicles."
      - n: 2b
        text: Construct a system that makes at least two energy conversions and explain this to your counselor.
  - n: "3"
    text: "Show you understand energy efficiency by explaining to your counselor a common example of a situation where energy moves through a system to produce a useful result. Do the following:"
    children:
      - n: 3a
        text: Identify the parts of the system that are affected by the energy movement.
      - n: 3b
        text: Name the system’s primary source of energy.
      - n: 3c
        text: Identify the useful outcomes of the system.
      - n: 3d
        text: Identify the energy losses of the system.
  - n: "4"
    text: Conduct an energy audit of your home. Keep a 14-day log that records what you and your family did to reduce energy use. Include the following in your report and, after the 14-day period, discuss what you have learned with your counselor.
    children:
      - n: 4a
        text: List the types of energy used in your home such as electricity, wood, oil, liquid petroleum, and natural gas, and tell how each is delivered and measured, and the current cost; OR record the transportation fuel used, miles driven, miles per gallon, and trips using your family car or another vehicle.
      - n: 4b
        text: Describe ways you and your family can use energy resources more wisely. In preparing your discussion, consider the energy required for the things you do and use on a daily basis (cooking, showering, using lights, driving, watching TV, using the computer). Explain what is meant by sustainable energy sources. Explain how you can change your energy use through reuse and recycling.
  - n: "5"
    text: "In a notebook, identify and describe five examples of energy waste in your school or community. Suggest in each case possible ways to reduce this waste. Describe the idea of trade-offs in energy use. In your response, do the following:"
    children:
      - n: 5a
        text: Explain how the changes you suggest would lower costs, reduce pollution, or otherwise improve your community.
      - n: 5b
        text: Explain what changes to routines, habits, or convenience are necessary to reduce energy waste. Tell why people might resist the changes you suggest.
  - n: "6"
    text: Prepare pie charts showing the following information, and explain to your counselor the important ideas each chart reveals. Tell where you got your information. Explain how cost affects the use of a nonrenewable energy resource and makes alternatives practical.
    children:
      - n: 6a
        text: The energy resources that supply the United States with most of its energy
      - n: 6b
        text: The share of energy resources used by the United States that comes from other countries
      - n: 6c
        text: The proportion of energy resources used by homes, businesses, industry, and transportation
      - n: 6d
        text: The fuels used to generate America’s electricity
      - n: 6e
        text: The world’s known and estimated primary energy resource reserves
  - n: "7"
    text: Tell what is being done to make FIVE of the following energy systems produce more usable energy. In your explanation, describe the technology, cost, environmental impacts, and safety concerns.
    children:
      - n: 7a
        text: Biomass digesters or waste-to-energy plants
      - n: 7b
        text: Cogeneration plants
      - n: 7c
        text: Fossil fuel power plants
      - n: 7d
        text: Fuel cells
      - n: 7e
        text: Geothermal power plants
      - n: 7f
        text: Nuclear power plants
      - n: 7g
        text: Solar power systems
      - n: 7h
        text: Tidal energy, wave energy, or ocean thermal energy conversion devices
      - n: 7i
        text: Wind turbines
  - n: "8"
    text: Identify three career opportunities that would use skills and knowledge in energy. Pick one and research the training, education, certification requirements, experience, and expenses associated with entering the field. Research the prospects for employment, starting salary, advancement opportunities, and career goals associated with this career. Discuss what you learned with your counselor and whether you might be interested in this career.
